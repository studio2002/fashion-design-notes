      "body": "本项目把色彩和面料放在一起讲。色彩决定服装的第一情绪、风格气质和搭配关系；面料决定触感、结构支撑、肌理表现和工艺可能。两者不能分开理解：同样的廓形，换成不同色彩和面料，会产生完全不同的审美效果。\n\n### 主题一 服装色彩设计\n\n#### 一、服装色彩的基础知识\n\n服装色彩是服装构成三大要素之一。教材把色彩看作物质与精神的集中体现：它既是可见的视觉属性，也是情感和风格表达。设计师使用色彩，不只是给服装上色，而是在决定作品的生命力、情绪温度和市场识别度。\n\n**色彩**——物体在光线照射下反射到眼睛中的视觉感受。色彩至少需要物体、光线和眼睛三个条件共同作用。\n\n设计提示：同一颜色在自然光、商场灯光、舞台灯光、摄影棚灯光下会呈现不同效果；同一颜色在不同面料上也会因光泽、纹理、厚薄而不同。因此配色不能只看色卡，还要看实际材料和穿着环境。\n\n**无彩色系**——黑、白以及黑白混合形成的全部灰色。无彩色系没有色相和纯度变化，主要依靠明度层次形成视觉差异。\n\n**有彩色系**——色相环上的所有颜色，如红、黄、蓝、绿、紫等。有彩色系具有色相、明度、纯度三种基本属性。\n\n#### 二、色彩三要素\n\n**色相**——颜色的基本相貌，也就是判断颜色是红、黄、绿、蓝、紫的依据。色相决定第一印象，例如红色热烈，蓝色冷静，紫色神秘。\n\n**纯度**——色彩纯净程度，也可理解为鲜艳还是浑浊。高纯度色彩醒目、强烈、活跃，适合舞台服、民族服、展示设计；低纯度色彩含蓄、柔和、沉稳，适合职业装、成熟风格和耐看系列。\n\n**明度**——色彩的明暗程度。加白提高明度，加黑降低明度。明度影响服装视觉轻重、层次清晰度和整体比例。\n\n易混点：纯度低不等于颜色浅。浅粉色可能明度高但纯度不一定低；深红色可能明度低但仍很鲜艳。\n\n#### 三、服装配色的原则\n\n服装配色的核心原则是**和谐感**。和谐感来源于对比和调和。好的配色不是没有差异，也不是差异越大越好，而是在对比与统一之间找到适合主题的强度。\n\n**色彩对比**——两种或多种色彩在色相、明度、纯度、冷暖上产生差异。对比能制造重点和活力，但过强会生硬、紧张。\n\n**色彩调和**——两种或多种色彩协调组合，形成舒适、愉悦的美感。调和能增强整体感，但过度接近会单调。\n\n设计判断：如果要柔和、自然、稳定，应偏调和；如果要热烈、跳跃、舞台感，可以增加对比。\n\n#### 四、服装色彩的对比\n\n**色相对比**——色相环上不同颜色之间的对比。\n\n1. **同种色对比**——相距约 0°，如绿色与深绿色。统一、协调、稳定，但容易单调。\n2. **邻近色对比**——相距约 30°，如蓝与绿、红与黄。柔和、稳定，适合日常和自然风格。\n3. **类似色对比**——相距约 60°，如红与紫、黄与绿。丰富、饱满、不单调，但要注意明度和纯度变化。\n4. **对比色对比**——相距约 120°，如红与蓝、黄与紫。跳跃、热情、醒目，但需控制面积和数量。\n\n**明度对比**——深浅差异形成的对比。教材用 1–9 的黑白灰层级理解明度：1–3 为高明度，明亮轻快；4–6 为中明度，稳重柔和；7–9 为低明度，低调厚重。\n\n明度对比可分为：\n\n1. **短调 / 弱对比**——差 3 阶以内，柔和统一。\n2. **中调 / 中对比**——差 4–5 阶，有层次但不突兀。\n3. **长调 / 强对比**——差 6 阶以上，清晰强烈。\n\n**纯度对比**——鲜艳程度差异形成的对比。\n\n1. **纯度强对比**——两种颜色都鲜艳，刺激、生硬、视觉冲击强。\n2. **纯度中对比**——纯度适中，协调、统一、耐看。\n3. **纯度弱对比**——两种颜色都较灰，容易沉闷、含糊。\n\n降低纯度的方法：\n\n1. 加白色：纯度降低，明度提高。\n2. 加黑色：纯度降低，明度降低。\n3. 加灰色：纯度降低，明度变化不大。\n4. 加互补色：纯度降低，色彩更丰满。\n\n**冷暖对比**——色彩冷暖性质形成的对比。红、黄、橙偏暖，蓝、绿、紫偏冷。冷暖不是绝对的，同一色相内部也会因明度、纯度和混色方向产生冷暖变化。\n\n#### 五、服装色彩的调和\n\n**对比调和**——当两种颜色过于对立、生硬、刺激时，降低一方明度或纯度，使冲突变弱。例如红与绿强烈对比时，可把红调成红灰色。\n\n**类似调和**——当两种颜色过于接近、含糊单调时，提高或降低一方明度、纯度，使关系清楚。例如黄与橙过近时，可让黄变浅或让橙偏褐。\n\n易混点：调和不是把所有颜色都变灰，而是调整关系。它可能降低对比，也可能增强层次。\n\n#### 六、服装配色规律\n\n**同类色搭配**——同一色相内部深浅不同的组合，如蓝与深蓝。通常把同一色相分为深、中、浅三个层次，使整体统一又有变化。\n\n**对比色搭配**——教材这里指广义的不同色相、纯度、明度搭配，而不只限于 120° 色相对比。它丰富、厚实、活跃。\n\n对比色搭配分为：\n\n1. **色彩强对比**——差异大，鲜明、刺激、显眼，适合演出服、民族服装。\n2. **色彩中对比**——差异适中，充实、丰富、有变化，适合日常设计。\n3. **色彩弱对比**——差异小，温和、雅致、自然，但要防止层次不清。\n\n**黑白灰搭配**——彩色与黑、白、灰组合。黑白灰属于中性色，沉稳、大方，可调节彩色之间的明度和纯度关系。\n\n1. 彩色与黑色：彩色宜鲜艳，形成明亮而稳定的效果。\n2. 彩色与白色：彩色明度不宜过低，否则反差过大。\n3. 彩色与灰色：彩色最好保持中等或较高纯度，否则整体偏灰。\n\n#### 七、服装配色的一般过程\n\n整体服装配色包含三个基本色块：主色、搭配色、点缀色。\n\n**主色**——面积最大、使用最多、占主导地位的色彩，决定服装风格、情调和主题基调。\n\n**搭配色**——辅助主色的色彩，面积小于主色，可丰富层次和补充主题。\n\n**点缀色**——面积最小，起点缀和平衡作用，可出现在局部色块或服饰品上。\n\n配色流程：\n\n1. 确定主题、情调和风格。\n2. 根据主题选择主色。\n3. 根据主色关系选择搭配色。\n4. 根据主色与搭配色是否过近或过远选择点缀色。\n\n设计判断：如果主色和搭配色太接近，点缀色应拉开关系；如果两者太刺激，点缀色应稳定整体。\n\n#### 八、流行色与常用色\n\n**流行色**——在特定时间、特定区域里被认为时尚的色彩。它具有时间性、区域性、周期短、以色组形式出现等特点。流行色在服装领域最敏感，国际流行色发布通常会影响 1–2 年后的服装色彩。\n\n流行色生命周期：\n\n1. 产生期。\n2. 激增期。\n3. 普及期。\n4. 衰退期。\n5. 淘汰期。\n\n**常用色**——适用性强、使用范围广、持续时间较长的色彩。它比流行色更稳定、更持久，常与流行色组合使用。常用色甚至可以成为品牌识别，如经典米色与褐色格纹。\n\n---\n\n### 主题二 服装面料设计\n\n服装设计不只是造型、款式和色彩的创意，也包括面料创意。面料决定服装能否支撑某种廓形、呈现某种肌理、表达某种主题。新型面料和功能性面料的发展，为设计师提供了更多想象空间。\n\n**功能性面料**——具有特殊防护或使用性能的面料，如防雨、防辐射、隔热等。\n\n**新型面料**——通过材料、工艺或表面效果创新形成的新面料，如环保面料、立体印花面料、手绘面料等。\n\n#### 一、面料的织造设计\n\n**面料的织造设计**——由面料厂家或面料设计师在织造阶段完成的设计与加工。传统情况下，服装设计师只能从现成面料中选择材料，因此会受到面料品种、图案、宽幅和供应条件限制。\n\n**定制面料**——面料厂家根据设计师要求进行织造或图案布局，使面料从一开始就服务于具体款式。教材举例说明，旗袍面料可以把肩部和下摆花型按真实衣片尺寸织在同一块面料上。\n\n设计提示：定制面料体现“面料与款式同步设计”的思维，要求设计师理解衣片结构、花型位置、人体比例和工艺实现。\n\n#### 二、面料的再造设计\n\n**面料的再造设计**——设计师根据自身风格和主题要求，对已经织造好的面料进行再加工，使其产生新的形态、肌理、层次或表现力。\n\n面料再造分为三类：\n\n**增型设计**——在原有面料上通过工艺和装饰增加艺术形态。常见手法有刺绣、印染、粘贴、绘制、镶钻、披挂装饰等。它能增强立体层次和文化内涵，适合礼服、舞台服、民族风格、艺术服装。\n\n**减型设计**——通过工艺改变面料原有结构，制造不完整、通透、破损或粗犷效果。常见手法有镂空、抽丝、破洞、打磨等。它适合前卫、街头、实验和解构风格，但要注意面料强度和穿着安全。\n\n**立体型设计**——通过收褶、缝合、填充、堆积等方式改变面料平面形态，形成立体肌理。它能把平滑面料转为触感强烈、视觉丰富的材料，尤其适用于礼服和创意造型。\n\n#### 第五章训练清单\n\n1. 能否说明色彩由哪三个条件形成？\n2. 能否区分色相、明度、纯度？\n3. 能否解释色彩对比与色彩调和的关系？\n4. 能否用同类色、对比色、黑白灰三种规律做配色练习？\n5. 能否按主色、搭配色、点缀色建立一套服装配色？\n6. 能否区分流行色和常用色？\n7. 能否说明织造设计与再造设计的区别？\n8. 能否分别构思增型、减型、立体型面料再造方案？\n\n---"

      "title": "服装设计基础 / 第六章 服装分类设计",

      "body": "本项目把服装设计放到具体对象和具体品类中理解。不同性别、年龄、季节、功能和部位的服装，在造型、结构、色彩、面料、装饰上都有不同重点。分类不是为了背名词，而是为了让设计师明确目标人群和市场定位。\n\n### 主题一 服装分类方法\n\n服装分类方法很多，常见方式包括：\n\n1. **按性别分类**——男装、女装、中性服装。\n2. **按季节分类**——春秋装、夏装、冬装等。\n3. **按年龄分类**——童装、青年装、中年装、老年装。\n4. **按功能分类**——运动装、学生装、职业装等。\n5. **按部位分类**——上装、下装、连衣裙、礼服等。\n6. **按造型结构分类**——紧身型、适身型、宽松型。\n7. **按民族或历史来源分类**——汉服、清服、唐服、藏族服装等。\n\n分类对企业也有重要意义。品牌往往通过固定分类建立市场定位，例如女装品牌、男装品牌、少年服装品牌等。明确分类能帮助企业形成品牌形象，也让消费者更有针对性地选择。\n\n设计判断：一件服装的分类会影响所有设计决策。职业装与运动装、青年女装与中年女装、婴儿服与少年服在舒适度、装饰、色彩和结构上都不能套用同一标准。\n\n---\n\n### 主题二 女装设计\n\n#### 一、女装设计概述\n\n**女装设计**——女性服装的设计，包括上衣、下装、连衣裙、职业装、晚礼服等。教材认为当代女装不再只是服用功能需求，而更多体现艺术审美和装饰需求。\n\n当代女装设计追求三个特性：\n\n1. **美**——强调女性身体线条、服装比例和审美效果。\n2. **新**——追求流行、变化和新鲜感。\n3. **异**——强调个性、差异和独特风格。\n\n这些特性体现在风格、造型、结构细节、装饰、面料、色彩等方面。\n\n#### 二、女性生理、心理特征\n\n女性身体总体特征：线条柔和、曲线明显，肩窄、胸高、腰细、臀宽、四肢纤细。但不同年龄阶段差异明显。\n\n**少年期女性**——整体柔弱，胸部较平，臀部不丰满，三围差别不大。适合宽松、利于运动的服装，以休闲、运动装为主。\n\n**青年期女性**——身体凹凸有致，三围明显，体型较丰满。适合时髦、流行、有个性的服装，是女装设计空间较大的阶段。\n\n**中年期女性**——身体趋于平直，胸部和臀部可能下垂，腰臀差减小。适合简单、大方、修饰性较强的服装。\n\n女性服装心理需求：\n\n1. **求美心理**——希望通过服装提升美感和身体表现。\n2. **求新心理**——关注流行变化和新款式。\n3. **从众心理**——会受流行趋势、文化层次、场合和消费水平影响。\n\n设计应用：女装设计不能只用年龄标签，还要结合心理年龄、穿着场合、消费能力和审美偏好。\n\n#### 三、上衣设计\n\n**上衣**——人体上身所穿服装，包括衬衫、西服、内衣、背心、两用衫、T 恤等，由衣身、衣袖、衣领、腰身、下摆等部件组成。\n\n上衣分类方式：\n\n1. 按款式：衬衫、女两用衫、背心等。\n2. 按季节：春秋上衣、夏季上衣、冬季服装。\n3. 按用途：内衣、睡衣、运动上衣、日常上衣。\n4. 按廓型：A 型、H 型、X 型、O 型等。\n\n上衣基本造型：\n\n1. **A 型上衣**——上窄下宽，下摆放大，衣长可短可长。\n2. **H 型上衣**——上下宽窄接近，胸围、腰围、下摆变化不大。\n3. **X 型上衣**——在 H 型基础上收腰，下摆适当加宽。\n4. **O 型上衣**——肩部和下摆收紧，中间放大，类似灯笼形。\n\n结构设计重点：\n\n1. **衣领与门襟**——领型可无领、翻领、立领、翻驳领；门襟可正开、偏开；纽扣可单排或双排，也可侧开或后开。\n2. **衣身结构**——通过衣片分割、放量、腰节线高低、衣摆大小实现不同造型。\n3. **衣袖设计**——长袖、中袖、短袖、无袖；连衣袖、插肩袖、装袖；可做喇叭袖、灯笼袖、紧袖口等。\n4. **色彩面料**——面料性能决定造型和风格；青年女性色彩可丰富，中年女性宜大方素雅，老年女性常用淡色或碎花。\n5. **装饰设计**——绣花、荷叶边、钉钻、收褶、镶边、蕾丝等，应与年龄和风格匹配。\n\n#### 四、下装设计\n\n**下装**——人体下身穿着的服装，主要包括裙和裤。裙有筒裙、喇叭裙等；裤有长裤、中裤、短裤等。\n\n下装结构关键部位：\n\n1. **腰节**——高腰、中腰、低腰影响比例和风格。\n2. **臀围**——决定贴体程度和活动空间。\n3. **上裆**——影响裤装舒适度和结构合理性。\n4. **脚口 / 下摆**——决定裤腿或裙摆开合。\n5. **长度**——长裙、中裙、短裙；长裤、中裤、短裤。\n\n裙装造型举例：腰节高低形成不同腰线；臀围和下摆大小形成喇叭裙、A 裙、筒裙；裙长变化形成不同年龄感和场合感。\n\n装饰手法：拼接、绣花、抽褶、打裥、滚边、花边、荷叶边等。可单独使用，也可组合使用。\n\n#### 五、连衣裙设计\n\n**连衣裙**——上衣与下装连在一起的裙装，可有腰节线，也可无腰节线，是女性夏装的重要款式。\n\n造型关键部位：\n\n1. 肩部。\n2. 胸围。\n3. 腰围。\n4. 臀围。\n5. 袖长。\n6. 裙长。\n7. 下摆。\n\n基本造型：\n\n1. 肩、腰、下摆都适体，形成 H 型。\n2. 肩部适体、腰身收紧、下摆放大，形成 X 型。\n3. 肩部适体、腰身和下摆放大，形成 A 型。\n\n结构类型：\n\n1. **连腰节**——上下身连为一个衣片，不分割，整体感强。\n2. **分腰节**——通过腰节线高低形成高腰、中腰、低腰连衣裙。\n\n装饰部位：衣领、袖口、裙摆等。可用绣花、花边、蕾丝、加褶、镶丝等。少女装、淑女装可装饰较多；花色连衣裙装饰应减少，以免杂乱。\n\n#### 六、职业套装设计\n\n**职业套装**——职业女性在上班场合穿着的上、下装组合款式。它通常用于春秋季节，用料较考究，款式端庄、大方。\n\n职业套装的功能：\n\n1. 表示职业身份。\n2. 体现行业精神。\n3. 传达庄重、专业、可信赖的形象。\n\n造型结构要点：\n\n1. 上装通常适体收腰，表现女性曲线，但衣长不宜过短或过长。\n2. 裤装可直筒、锥型或小萝卜型，裤长可九分或长裤。\n3. 裙装可直筒或 A 字型，长度以膝盖为参照，可膝上、膝下或齐膝。\n4. 领型可驳领、青果领、立领、无领。\n5. 门襟可正门襟、偏门襟、直线或斜线；纽扣可单排或双排。\n6. 腰身常通过直线、斜线、曲线分割处理，使胸腰省融入结构。\n\n装饰原则：职业套装不宜夸张，可在口袋、领口、门襟、袖口、色彩拼镶或服饰品上做细节变化。主色多用素雅中性色，局部可用米白、丝巾、耳环、领结、皮鞋等点缀。\n\n---\n\n### 主题三 男装设计\n\n#### 一、男装设计概述\n\n男装相较女装更注重品质、身份和稳定风格。它常体现男性的粗犷、阳刚、社会地位和审美品位。男装多以直身型为基础，结构变化没有女装复杂，主要款式包括西服、夹克衫、衬衫、大衣等。\n\n#### 二、男性生理、心理特征\n\n男性身体总体特征：线条刚毅，整体呈倒梯形，肩宽、臀窄、腰臀差小，四肢健硕有力。\n\n**青年期男性（18–35 岁）**——胸部壮实、腰细、臀窄，精力充沛、活泼好动。服装以休闲、运动为主，如牛仔、运动装、夹克、休闲西装。\n\n**中年期男性（35–60 岁）**——成熟稳重，注重身份和地位；身体可能出现腰粗、腰突、臀下垂。服装以正装为主，也穿休闲类服装，如西服、夹克、衬衫、T 恤。\n\n**老年期男性（60 岁以上）**——身体可能肥胖或清瘦，体力下降，服装更强调舒适、宽松和实用，身份表现需求减少。\n\n男性服装心理需求：\n\n1. 修饰自我。\n2. 标志身份。\n3. 体现个性。\n4. 表达群体认同。\n\n#### 三、衬衫设计\n\n**衬衫**——男士常用服装，一般春秋穿着，有长袖、短袖，面料多为轻薄棉麻。历史上从无领无袖基型发展到欧洲装饰性衬衫，再到现代男女通用款式。\n\n造型结构：男士衬衫以 H 型为主，内部结构采用横向和纵向分割。横向分割常在前胸、后肩；纵向分割用于前片、后片和袖片。领型以翻领、立领为主。\n\n装饰设计：男士衬衫大方得体，装饰较少。装饰主要在领口、袖口、纽扣处，可用拼色、镶边等简洁手法。\n\n#### 四、西服设计\n\n**西服**——源于欧洲，是男士传统服装，现代西服具有外观挺括、线条流畅、穿着舒适、国际化程度高的特点。\n\n造型变化：西服由过去强调肩部的 T 型逐渐转向 H 型。T 型通过垫肩体现魁梧，下摆收紧；H 型肩部合体，下摆略放宽。\n\n结构要点：\n\n1. 衣身可三开身、四开身。\n2. 袖子弧线要适合手臂弯曲和运动量。\n3. 驳头位置可高可低、可宽可窄。\n4. 驳头高且窄偏休闲，驳头低且宽偏传统。\n5. 驳头高低会影响纽扣数量和整体风格。\n\n装饰与面料：传统西服多用含毛成分涤纶、薄呢，颜色偏暗，搭配衬衫领带；休闲西服可用棉麻、新型面料、浅色和中性色，可搭配 T 恤、牛仔裤、休闲裤。\n\n#### 五、夹克衫设计\n\n**夹克衫**——穿在衬衫外的外套，适合春秋和非正式场合，轻便、活泼、舒适。\n\n造型结构：夹克衫以 T 型为主，肩部宽松，下摆收紧。其显著特征是“三紧”：袖口收紧、领口收紧、下摆收紧。\n\n结构要点：\n\n1. 下摆收紧可用牛筋、拉链、纽扣、罗纹、搭襻等。\n2. 肩部结构较宽松，袖窿放深，可形成落肩袖，也可用插肩袖、上肩袖。\n3. 分割是夹克衫重要手法，可丰富款式并起装饰作用。\n4. 分割形式包括横向、纵向、斜向、曲线。\n\n装饰设计：夹克装饰主要在口袋、搭襻、分割线。口袋可明贴袋、暗缝袋、挖袋、立体袋、袋中袋；搭襻常在肩部、袖口、下摆两侧；分割线可加明线、多色拼镶、滚条。\n\n#### 六、裤子设计\n\n**裤子**——穿于下身、具有两条裤腿的服装，是男装设计重点。种类包括西裤、休闲裤、牛仔裤、灯笼裤、内裤等；按长度分为长裤、中裤、短裤。\n\n造型结构：\n\n1. **西裤 / H 型**——直筒，大方、简洁。\n2. **萝卜裤 / O 型**——上下收紧，中间膨出，飘逸、活泼。\n3. **牛仔裤 / 紧身型**——包住臀腿，面料略有弹性，塑造修长腿部。\n\n裤腰结构：\n\n1. **装腰**——腰头与裤片分开，宽窄可变，扣合方式可纽扣、拉链、牛筋、系带、搭襻。\n2. **连腰**——裤腰与裤片连为一体，一般以高腰为主，通过收省、收裥解决腰臀差。\n\n装饰设计：正统西裤装饰较少；休闲裤装饰较多，常在腰、口袋、侧缝处使用流苏、拉链、立体袋、滚边、明线、抽褶、系带、分割等。\n\n#### 七、大衣设计\n\n**大衣**——秋冬季穿在外套外面的较厚、较长服装，常用于正式场合。现代男式大衣趋向简洁、大方，以 H 型、X 型为主，面料多用羊毛混纺，色彩多为素色。\n\n造型结构：\n\n1. **H 型大衣**——适合中老年群体，直筒状，舒适、得体，长度可膝下、齐膝、膝上或短大衣。\n2. **X 型大衣**——适合中青年群体，收腰，常用腰带，显得年轻、有活力、时尚。\n\n部件设计：衣领可翻驳领、枪驳领、立领、青果领；门襟可单排扣、双排扣、拉链、暗门襟；衣袖可上肩袖或插肩袖。\n\n装饰设计：男式大衣装饰含蓄精致，常用搭襻、缉线、腰带、口袋，位置在肩部、前胸、袖口、腰部、门襟等。\n\n---\n\n### 主题四 童装设计\n\n#### 一、童装设计概述\n\n**童装**——0–16 周岁未成年人的日常服装。童装设计必须根据不同年龄阶段的生理、心理特征确定款式、结构、色彩、面料和装饰。\n\n童装设计关键词：舒适、安全、童趣、便于穿脱、适合运动、符合年龄心理。\n\n#### 二、儿童生理、心理特征\n\n**婴儿期（0–1 岁）**——以睡眠为主，皮肤娇嫩，生长快，需要成人照料。体态为头大、颈短且软、四肢短小、腹部隆起，逐渐出现坐、爬、立等动作。\n\n**幼儿期（1–5 岁）**——发育快，四肢开始粗壮，身高拉长，运动量增大，开始有自己的喜好和思想，性别差异逐渐明显。\n\n**学龄儿童期（6–12 岁）**——进入小学阶段，是智力和行为习惯发展的关键期。男孩更好动，身体结实；女孩逐渐安静、爱美，开始出现女性特征。\n\n**少年期（13–16 岁）**——进入发育过渡期，生理和心理变化明显，有自我意识和叛逆心理。男孩趋向成人体型，女孩体型更女性化。\n\n#### 三、童装设计要点\n\n**婴儿服装**——首要条件是舒适、安全、穿脱方便。结构多采用无领、前开或侧开的连体装；以宽松为主，无腰身；不宜用拉链，以免误食或划伤；面料以浅色、纯色、纯棉为主，不宜添加复杂装饰。\n\n**幼儿服装**——随着运动量增加，结构仍以宽松为主，造型多为 H 型、O 型、A 型。门襟要方便儿童自己穿脱，正前门襟配纽扣或拉链较合适。可适当加入动物、花朵、动漫卡通图案。口袋既要实用，也要符合儿童心理。\n\n**学龄儿童服装**——年龄跨度较大，设计以简洁、大方为主，适当加入个性装饰。男孩服装以 H 型为主，宽松便于运动，面料要耐磨，可在易磨损部位拼接加厚；色彩宜明快、和谐。女孩服装造型空间较大，可用 A 型、O 型、H 型、X 型，裙装是设计重点，可考虑配套服饰。\n\n**少年期服装**——少年希望表现成熟和个性，但仍为未成年人，设计要在成人化趋势和年龄身份之间取得平衡。男孩以休闲、运动系列为主，可配时尚服饰；女孩喜欢裙装，但裙长要控制，过短轻佻，过长拖沓。整体应简洁、大方，可加入蕾丝、花边、抽褶、图案等装饰，面料以棉麻等透气面料为主。\n\n#### 第六章训练清单\n\n1. 能否从性别、季节、年龄、功能、部位等角度给服装分类？\n2. 能否说明女装“美、新、异”如何体现在造型和结构中？\n3. 能否按少年期、青年期、中年期分析女性服装需求？\n4. 能否分别说明上衣、下装、连衣裙、职业套装的结构重点？\n5. 能否说明男装为何更强调品质和身份？\n6. 能否区分衬衫、西服、夹克、裤子、大衣的造型结构重点？\n7. 能否按婴儿期、幼儿期、学龄期、少年期提出童装设计方案？\n\n---"

      "body": "系列服装设计是全书最后的综合训练。它要求设计师把单件服装设计能力提升为群体设计能力：既要每套服装完整，又要让多套服装之间形成统一主题和视觉联系。\n\n### 主题一 系列服装设计的要素\n\n#### 一、系列服装概述\n\n**系列**——将某一事物按一定系统或联系排列起来。系列不是单个个体，而是有内在联系的群体。\n\n**系列服装**——具有某种联系因素，同时又有个性特征的服装群体。系列中的每套服装既要有共同元素，也要有独特变化。它不是几件衣服简单相加，而是共同主题、思想和视觉语言的整体表达。\n\n设计理解：系列服装中的共性让观众看到“这是一个系列”；个性让每一套服装都有存在价值。\n\n#### 二、系列服装设计要素\n\n系列服装有三个基本要素：数量、共性、个性。\n\n**数量**——一套是单套，两套系列感较弱，三套及以上才更接近真正系列。小系列一般 3–5 套，常用于设计比赛；中系列 6–8 套，可用于比赛或时装展示；大系列 9 套以上，常用于发布会和展览，并需要考虑舞台、灯光、服饰品配套。\n\n**共性**——系列服装的中心思想，包括主题、精神、情调、风格等，具体体现在共同造型、结构、面料、色彩、装饰手法等方面。共性不是完全相同，而是视觉和心理上能识别出联系。\n\n设计风险：初学者常只用同一面料或同一色彩制造共性，但缺少主题、情调、结构和风格层面的联系，这样系列感仍然不足。\n\n**个性**——每套服装之间的区别，体现在形态、款式、造型、结构、大小、位置、数量、长短、方向等方面。个性必须建立在共性基础上，不能脱离系列主题。\n\n设计判断：系列设计同时要求“单套完整”和“群体统一”。单套完整要符合形式美法则，群体统一要靠主题和共性因素组织。\n\n---\n\n### 主题二 系列服装设计的形式\n\n#### 一、系列服装分类\n\n系列服装可按多种方式分类：\n\n1. **按性别**——男装系列、女装系列、整体服装系列。\n2. **按年龄**——婴儿装系列、童装系列、少女装系列、中老年服装系列。\n3. **按场合**——礼服系列、职业装系列、休闲装系列、生活装系列。\n4. **按季节**——春秋装系列、夏装系列、冬装系列。\n5. **按面料**——花色面料系列、丝绸系列、棉麻系列、素色系列。\n6. **按主题**——花卉、宇宙、青春、梦幻等主题系列。\n\n#### 二、系列服装设计形式\n\n**单品系列**——以同一品类出现的系列，如休闲装系列、淑女系列、户外运动系列。它以品类一致建立共性。\n\n**造型系列**——以相同或相似外部廓型形成系列。外轮廓接近，但内部结构和细节可以变化。\n\n**结构系列**——以某种结构变化作为系列元素，如平驳领、方袋盖、嵌线袋等元素在每套服装中出现，但位置、大小、数量微调。\n\n**色彩系列**——以一种或一组色彩构成系列元素。色彩可在明度、纯度、冷暖、面积、位置上变化，形成共性与个性。\n\n**面料系列**——以面料特点作为系列元素，例如折叠、染色、渐变、拼镶、立体空间感等。教材提到三宅一生作品作为面料空间感与造型结合的代表。\n\n**工艺系列**——以工艺或装饰手法作为系列元素，如刺绣、拼贴、立体花型、钩针编织、剪切镂空、打磨、做旧、钉珠等。\n\n**图案系列**——以服装或服饰品图案作为系列元素。图案要与主题紧扣，可通过概括、意向、变形等方式强化亮点。\n\n设计应用：一个系列可以同时属于多种形式。例如一个“花卉主题女装系列”可以同时使用图案系列、色彩系列、面料系列和工艺系列。\n\n---\n\n### 主题三 系列服装设计的要点\n\n系列服装创作来自日常生活、历史文化、艺术领域、建筑、街头时尚、社会政治等多种灵感。设计师需要长期收集资源，再把资料整合、转化为主题、基型和系列。\n\n#### 一、主题的构思\n\n**主题**——服装设计的核心，可以是具体事物或事件，如花卉、动物、人物、社会热点；也可以是较抽象的概念，如宇宙、太空、幻想、青春。\n\n主题确定后，需要围绕主题收集资料，寻找色彩、面料、造型结构、工艺特点、图案造型、服饰配套等切入点，使各方面共同反映主题。\n\n主题构思方式：\n\n1. **先主题后构思**——先由自己或他人确定主题，再围绕主题进行系列设计，常见于比赛或命题作业。\n2. **先构思后主题**——设计师平时积累大量设计资源，再根据它们的共同特征归纳主题，具有偶发性和长期积累性。\n\n#### 二、基型的确立\n\n**基型**——根据主题思想构思出的第一套服装，是系列产生的基本款式造型，也是主题最具代表性的实物形象。\n\n基型包含：\n\n1. 款式特征。\n2. 面料使用。\n3. 色彩搭配。\n4. 工艺设计。\n5. 装饰手法。\n6. 与主题相连的设计切入点。\n\n设计过程：主题理解后，设计师要寻找一个切入点，可以是事物、景物、人物、一句话、文化或艺术内涵。然后围绕切入点收集资料、联想、归纳、分析，形成款式模型，再从多款中提炼最突出的一款作为基型。\n\n#### 三、系列整体的生成\n\n##### 1. 群体的生成\n\n基型确立后，要从基型中找到共性元素，形成系列群体。共性可以来自风格情调、造型表现、点线面构成、面料、色彩、装饰手法等。\n\n群体衍生方法：\n\n1. **特征相似法**——运用与基型相同或相似的特征进行群体设计。例如基型是 A 型，群体也采用 A 型；基型有渐变面料色彩，群体也延续渐变特征。变化可体现在位置、大小、色相、纯度、方向上。\n2. **内容加减法**——对基型的装饰、点线面、色彩等内容进行增加或减少。例如拉链数量增加或减少，扇形结构从袖口转移到领口、下摆并改变层次。\n3. **形态移位法**——把基型形态通过移位、旋转等方式转用到其他部位。例如领口 V 型转移到袖口、下摆或服饰品上。\n\n##### 2. 个体的完整\n\n**个体完整**——系列中每一套单独服装也要完整协调。它不仅包括服装本身，也包括服装与服饰品、外衣与内衣、妆容、鞋包等的配套。\n\n个体完整遵循统一与对比：\n\n1. **统一**——点、线、面、形态、色彩之间有整体感，不零碎、不杂乱。可通过相同形态、相同色彩或相似结构呼应。\n2. **对比**——形态、面料、色彩、装饰存在差异，使单套服装有变化和亮点。\n\n设计判断：没有对比会呆板，过度对比会破坏整体。优秀单套设计是在统一中有变化。\n\n##### 3. 整体的完善\n\n**整体完善**——在数量完成后，从群体效果上继续调整共性与个性。系列不是套数够了就完成，还要看整体质量和视觉一致性。\n\n如果共性过多，系列会呆板，需要增加变化。例如持续使用 A 型短裙，可把 A 型特征转移到裙口、上衣衣摆或长度变化上。\n\n如果个性过多，系列会散乱，需要加强统一。例如只有面料和色彩一致，但造型结构完全无关，就应增加共同款式形态、装饰或结构元素。\n\n#### 四、系列服饰品的配套设计\n\n**服饰品**——广义可指服装和服饰品，狭义指除服装外的鞋、帽、包、腰带、首饰等。系列服装中的服饰品不是附属品，而是整体效果的一部分。\n\n服饰品作用：\n\n1. **造型作用**——服饰品也由点、线、面构成，应与系列服装造型相同或相似。晚礼服应配精致小巧的手包，而不宜配过于宽大休闲的包。\n2. **色彩作用**——服饰品与服装同色，可形成延伸和统一；与服装对比，可增加丰富、生动效果。\n3. **风格作用**——服饰品风格直接影响整体。休闲运动系列应配运动帽、休闲包、运动鞋或休闲鞋。\n\n#### 五、服饰品来源\n\n系列服饰品来源有四种：\n\n1. **选购**——市场直接购买，快捷方便，但契合度和个性不足。\n2. **自制**——按主题和风格制作，创意和协调性强，但工艺质量和材料可能受限。\n3. **替代**——用非服饰品替代，效果新颖独特，但获取和功能属性可能受限制。\n4. **改制**——在选购或替代基础上改造，灵活性强，但技术难度和最终效果不稳定。\n\n#### 第七章训练清单\n\n1. 能否说明系列与系列服装的区别？\n2. 能否用数量、共性、个性判断一个系列是否成立？\n3. 能否区分单品系列、造型系列、结构系列、色彩系列、面料系列、工艺系列、图案系列？\n4. 能否从一个主题提炼基型？\n5. 能否用特征相似法、内容加减法、形态移位法各做一组系列草图？\n6. 能否为一个系列设计鞋、包、帽、首饰等配套服饰品？\n\n---"

      "body": "- **服装**——广义包括衣服和服饰品，狭义主要指上装和下装。\n- **时装**——特定时期流行、具有时间性、流行性和新颖性的服装。\n- **服装设计**——把设计构思通过裁剪、工艺、造型等手段转化为服装形象的过程。\n- **造型**——创造立体形象的过程和结果。\n- **廓型**——服装外部轮廓，如 A 型、H 型、X 型、T 型。\n- **内造型 / 款式结构**——服装内部结构和细节，如分割线、省道、衣领、衣袖。\n- **色相**——颜色相貌。\n- **明度**——颜色明暗程度。\n- **纯度**——颜色鲜艳、纯净程度。\n- **面料再造**——对现成面料进行二次加工，使其产生新肌理和表现力。\n- **点**——服装中相对于整体较小的视觉元素，如纽扣、胸针、局部图案。\n- **线**——服装中的分割、装饰、轮廓和缝合方向。\n- **面**——服装中具有面积感的块面和裁片。\n- **形式美法则**——组织服装美感的规律，如对称、均衡、对比、节奏、分割、呼应、强调。\n- **结构线**——承担衣片连接和立体成型作用的线。\n- **装饰线**——丰富款式细节、增强视觉效果的线。\n- **省道**——收去平面衣料多余量，使衣片贴合人体曲面的结构手段。\n- **褶**——自然、不规则的褶皱。\n- **裥**——人为确定尺寸、方向和长短的规则褶皱。\n- **主色**——服装整体中面积最大、决定基调的色彩。\n- **搭配色**——辅助主色、丰富层次的色彩。\n- **点缀色**——面积最小、用于平衡和强调的色彩。\n- **流行色**——特定时间和区域内时兴的色彩。\n- **常用色**——适用面广、持续时间长、稳定性强的色彩。\n- **织造设计**——在面料生产阶段完成的面料设计。\n- **定制面料**——按具体款式和设计需求生产的面料。\n- **增型设计**——在面料上增加艺术形态的再造方式。\n- **减型设计**——通过镂空、破洞等削减结构的再造方式。\n- **立体型设计**——通过收褶、填充、堆积等制造立体肌理。\n- **系列服装**——具有共同联系因素且各有个性的服装群体。\n- **基型**——系列中最能代表主题的核心款式。\n- **特征相似法**——用相似特征从基型衍生系列款式。\n- **内容加减法**——增减基型中的装饰、结构、色彩等内容。\n- **形态移位法**——把基型特征转移到其他部位或服饰品上。\n\n---"

      "body": "\n### 一、设计的本质与定义\n\n#### （一）设计的意义和分类\n\n**1. 设计的意义**——设计(Design)改变我们的生存状态,倡导一种更为美好的生活方式。其考古学发现,最早的石器打制工具已表明人类在改变一定造物的工具,即最初一切设计的动机源于人类在改造自然界的活动中,学会和把握了物质世界的规律和方法。可以说,人类最初的工具制造成就本质上和后来的工业设计是一脉相承的,后者本质上是同一种设计意识的延伸和拓展。\n\n设计一词最早追溯于\"工业设计(Industrial Design)\"概念,它是在现代工业化生产的基础上,运用科学技术方法为社会生产提供各类产品的设计实践。工业设计作为一门学科形成于近代欧洲工业化时期,20世纪20年代才开始逐步得名,大约始于1945年。工业设计的职业化过程主要经历了初创、成熟到应用现代科学技术方法进行职业化服务的实践意义。\n\n设计的**基本内涵**包括以下几点:\n1. 设计决定产品的性能、价值和固有质量\n2. 设计具有制造和引导消费的作用\n3. 设计具有创造经济和社会效益的作用\n4. 设计以造物为对象,造物设计有前提、有条件——\"设计\"指人类对事物的框架、研究的创造性活动,是人对物之间关系的整体性思考。作为一种创造性活动,它有有序性的目标而并非漫无边际的自由创造活动。\n\n设计的过程也是造物的过程,包括对材料、结构、样式、工艺、生产的构思与预想过程。**设计既有理性成分(科学、技术与文化性关系),也有感性成分(灵感、创意)**;解决\"如何做(How)\"的问题时,工作过程既涉及理性又涉及感性,但科学与文化知识背景是判断合理性的重要前提。\n\n**2. 设计的分类**——按照构成要素三大要素:①产品设计(既包括产业化的日用工业产品设计,又包括工艺美术、装饰品等的手工艺产品设计);②视觉传达设计(平面设计,涵盖标志、包装、广告、书籍装帧、网页设计等);③环境设计(涵盖建筑、室内、景观、公共艺术空间设计等)。\n\n#### （二）设计的创造性思维\n\n思维是人类客观意识形态之一,是人类头脑对客观世界能动的反映过程。设计思维是一种以形象思维为主体、兼有逻辑思维和抽象思维的复合思维方式,其本质是围绕\"创造性地解决问题\"展开——这也是设计与纯艺术创作的根本区别:艺术创作侧重表达自我,设计更强调在满足功能与市场需求前提下解决实际问题。\n\n灵感思维是非连续性的、跳跃性的、间歇性的思维。设计计思维研究中,将灵感思维和形象思维合称为艺术思维,或统称为\"创作思维\"。\n\n设计思维方式各具其特有的思维形式,既有其中的合乎理性的逻辑思维,又有从直觉出发天马行空的形象思维,更具有超越两者的创造性。设计思维是设计的思维形式为艺术家审美思维,通过感性直观形式,以塑造艺术形象,反映生活并渗透审美评价的一种思维方式。设计思维还需要具体分类:\n\n**1. 联想思维**——联想思维是思路及其展开的连结,即由所感知反映的事物、概念,唤起其他相关的事物、概念,想起新的概念。联想的一般形式:\n- (1)相似联想(又称\"类比联想\")——指由一个事物的感觉可以联想到与该事物性质上相似之相似的事物形象。例如,首饰造型的圆珠形,设计师联想到运动、光效等,进而对造型加以引申设计;从藤缆缠绕的绳纹造型联想到设计中的\"缠绕\"元素;相关材料的质感形象联想到设计中新颖的形式表达。\n- (2)接近联想,指时间上或空间上的接近而唤起不同事物之间的联想,如根据季节联想相应的服装。\n- (3)对比联想,指造型上一种所熟悉的事物,联想到另一种在色调、形态上互相反差、相反相对的形式,能获得更强烈的心理效果,新奇而醒目地表达创作意图。\n\n**2. 逆向思维**——逆向思维又称反异思维,指思维者在思维过程中,打破常规,逆转思路,向问题的反方向去思考问题的思维方式。运用逆向思维,可以对已获得的经验、结论采取质疑的态度,反其道而行之,常常能突破思维定式产生新的设计方式。\n\n**3. 形态的比较分析**——通过观察各种类型的服饰形态的分类,能发现产品各自类别所具备的独特形态语言与规律。分析方法:纵向对同类服饰形态发展的分析(如比较不同历史时期廓形的演变规律);横向对同类服饰品在流行趋势、材料、工艺、设计手法等方面的对比分析;跨界比较分析,即打破服装门类边界的比较分析,如时装与运动装、传统服饰与现代服饰材质工艺的相互借鉴影响。\n\n**4. 系统的表达**——在服装设计中,形态分为大、中、小三种造型,相、色、质、饰四大要素(廓形、色彩、材质、装饰);进行设计构思时应对形态的比例、色彩的和谐、材质的选取、装饰的分寸等系统整体地予以考虑,而非片面孤立地考虑单一元素,不同风格与流派均有各自的形态表达系统。\n\n#### （三）服装设计流程\n设计一词来源于英文的\"Design\"与法文的\"Dessin\",在这两个词汇之间又衍生了英文的\"Designare\",其意思是构思草图。\n\n设计的具体构思与形成是一个逐渐完整化、清晰化的过程,即将设计的初步意念以及构思用视觉手段表达出来的过程,包括:形态因素的比较分析、造型元素的构成方式、设计草图的推敲深化、材质工艺的选择匹配,直至最终产品的完成实现。设计的表达方式除了绘图这一主要环节外,也包括说明文字、材料样片、模型制作等多方面共同构成的表达体系。\n\n服装设计作为一种视觉性极强的设计门类,人在不同时代、条件下,产生的对服装的不同追求,由此产生出、组织出的形态与思考方式,构成了服装设计的美感来源,也是探讨服装设计学习的一种\"视觉—思考—表达\"的完整方法论过程。\n\n服装设计流程可归纳为\"意念——实施\"的工艺流程,其研究和设计的对象既包含设计主体——人,设计的对象——物,包括服装品牌或设计师自身的风格等审美意念与设计目标的表达。**设计流程七步骤**:\n\n1. **收集资料**——了解市场的各种信息,做好充分的调研研究,调查资料:原料配色、面料品性能、成品销售等,消费者生活结构的变化和多样的产品状况等,内容包括同类品牌、价格、款式、面料及和市场结构,以及同行服装设计市场的策略动态。\n2. **规划设计风格**——有构思之意,是目标消费者所追求的大方向的设计效果,即谁(Who)、什么时候(When)、什么地方(Where)、什么目的(Why)、什么样式(What)、数量多少(How Many)?针对定位,拟定设计计划。\n3. **确定设计方案**——确定设计方案包括产品的品类、产品档次,大体细节、色彩、造型等,包括系列产品之间的呼应关系,以及市场对色彩、造型、风格等方面确定与创意搭配的组合等要素。\n4. **样品制作**——服装样品的样料、样版制作,依照基础的服装样式打版、根据服装效果图制作出样版,尺寸质量等相符效果,通过与调整确认打版的样式,以及每个部位的工艺处理和款式细节,反复调整和修正,以最终确定样品的具体尺寸、外观造型、内在质量等各个部分的构成要素,整个工艺要求达到完善的程度。\n5. **审查样衣**——对最终的目的效果再一次检查与校正(包括图式、款式、加工工艺和使用面料等)。\n6. **制作工业性样衣和制定技术文件**——包括版式、排料图、定额用料、操作程序等技术文件,样品确定,即可计算工时,编排工序,考核为生产安排计划,对物料进行核算。\n7. **产品展示、宣传及推向市场**——在批量生产、一般选定要举办不同规模的服装展示会,并利用各种媒体等宣传,进行组织商品广告宣传,评估产品和市场的营销方式,做产品成本预算。\n\n随着科学技术的发展,欧美等国已研制出用于服装设计的计算机辅助设计系统(CAD/CAM),包括信息技术在设计中的应用,使得设计的手段更多样化。计算机辅助设计不仅可以进行款式设计,也可以进行款式变化的效果预视,操作简单且效率高;系统还能根据顾客所提供的具体测量数据自动生成个人体形版及成衣纸样。\n\n服装设计中的规格(GTT)也可存储各国男女服装的标准体型系列的数据,如设计标准体型8岁到7.2cm,即最大身高与最小身高的科学分层,让企业与设计师针对性生产不同款型服装以符合不同市场需求。\n\n#### （四）服装与人体的关系\n\n雕塑、舞蹈和服装都是以人体为表现对象的艺术形式,其中服装设计被视为一种依附于人体的\"人体外空间的服饰活体\"再创造,我们应该学习和运用两方面知识:一是人体的形式规律,二是人体所带来的美感表述形式。\n\n\"体形完美\"的服装,服装是要以\"人体活动\"这个动态的人体为基础的,服装是要建立在人体的形式基础上的设计,能够充分地表达人体自然的形态和特征,让形式与人体和谐结合,充分表现人体的形式美——即人体的曲线、比例、体量等在服装造型中的体现和运用。\n\n服装是人的外在美的表现形式,人体是内在结构的表现,而服装是通过外在的形式来表现人体内在结构、精神面貌的一种表达方式,服装设计造型是服饰美与人体美相结合的表达方式,依附于人体所进行的多种可能性的形态构成活动。\n\n女性审美文化,腹背内在,以改善自己的身形,采用收腹、模胸、塑臀的裙撑加工技法来塑造人体的美,强化人体身有的曲线,柔美的裙形,四正流畅的方式引领国际美,适应服装与人体结合为一个完美的原则。\n\n随着社会的不断发展,时尚无形地影响着人的价值观,服装设计和衣的形象要求,常用\"或行\"来显示人的形象美,服装人体的形态。一时代变得日益抽象化,增添审美色彩造型的时装等塑造的这样,才能让服装设计之美,在女子之类逐渐地设计中,应服装与人体关系密切造型,服装是必须完全和衣物有效,服装形有个性形的一部分,并具有变化的时间造型。\n\n#### （五）服装设计的原则\n\n**1. 人的尺度**——20世纪80年代,美国经济学家赫伯特·西蒙(Herbert Simon)在他的《人工科学》著作中提出:\"对人的尺度研究,应大量集中在与人有关的方面,把人的因素放在设计考虑要素外来的地位\"。服装设计以人为出发点,因此必须将人体作为本,以人为本,对设计的关系,人的构成从事物质和精神的两大方面,在造物设计中,不能忽视人类心理、精神性的生理与心理与人体因素相结合。生理因素在服装设计中体现为**人体工程学(Ergonomics)**,即是对人体功能行为综合分析研究的一门学科,在中国工艺思想中注重实用的理念在本质上就是体现的人本的人性化设计,更是工程与工艺技术相互结合的极致体现,一直是应用到服装设计上,就必须对人的形体比例、尺寸进行度量,如身体的高矮、胖瘦之间的距离和围度所形成的整体外形的比例,或者所产生的相对协调状态、美感、活动范围等,以增强设计目标不基本的度量尺寸,才能让服装设计成为为设计者本身的舒适美感科学性。\n\n在服装中体现出对人的体形与关系形成越舒畅的美感,从而体现人们对文化的美感情操,尺寸的度量,一般包括三围、比例、身长、宽窄等,反映服装外形与人体尺寸的度量关系,不同体型设计的原则应因个体或群体设计的着心态,必然会产生具有各自的差异。\n\n**2. 整体设计的原则**——服装各部分的总称为整体,它包括衣式、面料、色彩、款式、配饰等各类服饰配件等,如何将服装的个体因素结合与整体风格式化统一起来一个整体感,是服装设计中一体系原则,在整体设计中,不同的功能要求要满足,能够简约达到功能与实用的相互统一,不能只求外表美化而忽视了服装原来的实用性主要功能。\n\n**3. TPO原则**——着装遵法则时间、地点和场合。服装具有实用与功能与审美功能满足服装设计者首先要考虑的条件的服装尺寸,受到时间等条件的限制而设计,如着装,要因人、时间等要求条件而配合适应,推动着装的服装原则——TPO原则,TPO原则是日常穿衣与形式的时间(Time)、地点(Place)、场合(Occasion)相配合,场合作为解释适宜的问题,在服装表现的场合中的场合中的搭配变化,如上班、办公室的正装,以及晚宴场合等要求条件的场合而设计,如\"个人\"、场合、时间\"的场合分类,一是四人,一是形式风格,二是从事、职业、休闲、一是从便服\"春\"\"夏\"\"秋\"\"冬\"等最终的场合服饰,着服装的社会的场合与角色符合。\n\n\"场合\"却是纵横兼备,着装要与所处的场合合中饮场合协调,这一理论显示的表现世界通行准,从而对服装的穿搭与场合协调设计的原则,也是各国服装设计文化、生活习惯、企业形象等的重要原则。\n\n**4. 附加值的体现**——附加值指的是产品的额外价值,即在进行设计过程中包含了社会文化的追加价值,为服装的创造赋予服装本身价值之外的一种附加价值,包括社会文化时尚、名牌效应等因素,提升产品的商业价值与吸引力,是设计上一种\"超附加\"价值的运用而不仅仅表现在产品本身的功能满足体现,是服装设计的一种发展趋势。\n\n**5. 变化原则**——变化是客观存在的规律,时代的变化和服装设计的变化,总相辅相成,互为因果的发展因素,时代进步、新材料、新技术的科学应用,以及消费者的生活观念、审美情趣的不断变化,推动服装设计不断变化;人在设计的生产创新的观念和审美意识的推动下,能促成设计的时尚变化朝多元化的趋向发展。\n\n### 二、中西服装设计文化比较\n\n中国的服饰文化与西方的服饰文化相当有历史时期的,相对独立的环境中,各自形成了自己的文化体系,两者是完全从属不同的文化历史、审美取向、社会背景发展而来,是从服装的外形到造型,都存在着明显的差异,通过比较分析,可以帮助我们了解历史上中西服装文化发展轨迹和特点的差异,归纳总结变化的规律。\n\n#### （一）中国服装设计文化\n\n**(1)追求精神动态,注重、强调表现人的精神、气韵、神韵之美**。中国服装很少表现人体和外在的关系,通常只作为体形之间的空间,而只为服装依附的对象,以人的体形依外部间接体现;这种精神追求的表现在服装造型上,主要体现出服装的宽松、宽大衣服的宽袍大袖,展现出的对身体形状态若隐若现的关系,似乎不受任何形式的束缚。\n\n**(2)以线条为主的表现形式**。中国服装造型,依着重于二维平面式的表现方式,着重装饰纹样,款式造型上通常以直线为主,配合服装外形的表现服装造型形态,这种表现在中华民族传统服装造型的美学观念的体现中,反映出线条为形式变化的重要方向。\n\n**(3)中国在传统的直线造型上,与西方国家使用二维平面式服装结构相当,在设计构图理念上,与西方裁剪相比较之下则较为二维,这体现出了中国服装材料使用的美学理念,在服装造型上属于内部曲线,人们在图纹中通过图纹的组合表示丰富象征意义,以形补形,呈现表达出与佩戴者的精神追求相配的图案纹样,反映其个人品位志向、社会地位等文化内涵。**\n\n**(4)中国人的服装是以来保护人体的,所以他们得于安宁的,其服装造型具有东方人的静态、含蓄等特点,追求人与自然的融合,隐藏人体不显露之处,东方美学更相对于西方来说,人们对形式化几千年来变化不太大,人对服装装饰的精美化更加更加体现出的形式,主要以浮雕、印花、织花等技法,来表达服装造型,其最终精髓的意义是完成整体的服饰形态。**\n\n#### （二）西方服装设计文化\n\n欧洲欧洲艺术史,每一个时代都有反映其时代精神的艺术思潮,这也是服装设计文化的整体反映,在人体艺术表现是西方艺术追求恒久的重要主题,总的说,古希腊文化艺术是西方文化的重要发源地,提出人体美是\"力\"的美的主张,以\"神创造人,人体美就是最美\"命题,提出人体自身就是雕塑与建筑的准则,在古希腊人体美学理论\"以人体为本\"(Pythagoras)人体黄金比例分割创立了人体美的理论,即为今日西方服装设计中重要影响的理论根基。\n\n**西方服装设计文化的四个特点**:\n(1)西方服装设计表现人体美是核心追求,总的表现是二维立体的雕塑意向。西方服装造型是立体的,始终围绕着体现人体曲线之美,通过收省、分割、覆盖等立体裁剪手法塑形,更加接近雕塑的立体建筑造型美感。\n(2)西方服装造型属于三维空间的表现方式,结构相对复杂,注重体现结构线与体形的高度契合度,以人体为设计出发点的立体裁剪(draping)是西方服装造型技法的核心传统。\n(3)服装的装饰要素服从于结构与造型,不做与结构无关的表面装饰,是\"里\"\"形\"\"饰\"三者的高度统一。\n(4)西方服装重视科技材料的运用,善于运用新材料新工艺完善服装的功能性,体现西方注重理性、功能主义的设计理念。\n\n这两种服饰体系,反映了中西方在人与自然关系认知、审美追求方式(写意与写实、含蓄与外露、平面与立体)以及哲学思维方式(天人合一 vs. 人本主义)等根本性的文化差异,是理解中西服装设计发展脉络的重要基础。\n\n法国服装设计师的作品特点是前卫、浪漫,表现手法相对夸张、丰富;意大利服装设计师的作品版型相对严谨,表现手法时尚,色调较稳;伦敦的服装则是二级绅士与朋克兼现;纽约的服装受其经济的影响,较为实用、简洁和自由;而日本的服装受东方文化影响,整体上具有东方情调,表现手法上常通过线的分割来呈现一定的几何造型,塑造前卫风格,这在国际时尚之中逐渐被认可和借鉴。\n\n纵观中西服装设计文化的发展历程,不同服装文化间的相互交流、渗透和融合,促进了各自的服装文化和人类共同文明的发展。随着信息技术和国际互联网日新月异的进步,文化传播速度的加快,中西服装设计观念相互取长补短,其差异正在淡化。现在时装界本身不仅已经国际化,讨论时装的话语也国际化了。在这种情况下,以消费为目的的时装同时利用了异国情调、原始主义、东西方主义和未来主义的话语。在这一过程中,追求异国风味的冲动在具体的文化氛围中仅揭示了种种区别和表现在对常规的突破。因此,全球经济一体化的现象,将会进一步加快世界服装潮流国际化的步伐。\n"

      "body": "\n### 一、服装的起源\n\n#### （一）服装与人的需求\n\n服装的起源,研究\"人类何穿衣\"与\"为什么穿衣\"的问题。服装的起源与人的关系是紧密相连一起的,人们对于是否有衣着的说明中,主要基于以下几种观点:①为了适应气候的护体避护;②为免除生殖器官而遮蔽的效用;③为增加体形优美而作为的装饰性效果;④为了保护自己不受周围环境的伤害而穿。\n\n所谓需求,主要指人在生存发展过程中对某种目标所产生的欲望要求,依照马斯洛需求层次理论,人类的需求分为生理需求、安全需求、社交需求、尊重需求和自我实现需求五个层次,服装的产生正是为了满足人的这些基本需求,人类的着装需求随着社会进步而不断改变和丰富,推动了服装的产生与发展。心理学家马斯洛(Max Low)于1943年在人类需要层次理论中主张,自我实现,自我表现是人的最高层次需求,基本心理满足和高层次需求相并列,服装正是满足人这些需求的重要载体。\n\n#### （二）骨针与串饰——服装发生的标志\n\n对远古人类的着装行为,现已发现了原始遗物中用于缝制衣物的骨针,史前时代\"山顶洞人\"以及各种骨针、贝壳串珠等饰物的发现,证明了原始人已开始有意识地制作和使用服装。骨针的出现证明当时人类已具备了缝制皮毛衣物的基本技术条件,标志着人类的服饰生产已初步进入有意识的历史阶段。\n\n沿着人类着装的美化进程,逐渐可以发现装饰的两个重要方面——一是物质的方面,即衣饰工艺材料的丰富性;二是精神的层面即审美情感的追求。达尔文《人类的由来》一书中写道:\"世界上几乎每个民族,没有在衣服和装饰品上花费大量精力\"是这一现象最好的印证和说明。\n\n#### （三）服装的基本形制\n\n服装的形制离不开人的基本形,因此服装外形应以人体结构进行归纳判断,形成基本形态与其变化可归纳为几大类:\n\n1. **披挂式**——披挂在肩背处,以简单的方式,如非洲、原始时代部落中常见的兽皮、藤草等原始披挂式服装形制,是服装最早出现的形制之一。\n2. **贯头式**——贯首式服装以头部套穿方式为主,即在整片布料的中间剪开缝口套穿,是较早的原始服装形制,是许多民族传统服装(如中国\"贯头衣\")的原始基础形式。\n3. **围缠式**——通过缠绕方式覆盖包裹身体,古希腊、罗马长袍式的缠绕方式即属此类,东南亚民族服饰中也常见。\n4. **缠绕式**——通过缠裹方式包覆身体的形式,包括围裙式等多种变体,与围缠式相近但更强调局部缠裹的方式。\n5. **分体式**——上下分开的服装形制,是现代服装最普遍常见的基本形制,如上衣下裳/上衣下裤的分体结构。\n6. **连衣式**——上下连为一体的服装形制,如连衣裙(candy)等,袍服式服装。\n\n### 二、社会变迁与着装\n\n#### （一）服装随时代而嬗变\n\n《礼经》为许我们的人,人类是\"一代服装是有当时是较古老的,也是应该没有理解,概括说来的传变服务性质与色适宜完整,叙对为民所构成的意见与感,称形传的方部,如此需要的,用以服象。世上还需要以特殊的样式使实体,便得到风格,加价格,做出物色彩。也具了传统同因为的变换会说的方式因为,加以对表,该被承受人以特殊,如此在其中考虑者到时性,如此实体。人体的意义和进制不是历代服装设计对世代传承与创新为为服装设计造型的重要依据。\n\n清代宫廷梦装展,\"一代之兴,必有一代记服之制,其同随时变更,不无小有沿,是不过定,故一时代,其其成大体样贵朴皆也。\"这历史发展中服装的传承与变革是一种\"不断的\"变化演化的历史进程。\n\n中国古代服装类型分为若干几式,若无罗形,又是不做主题风时代同,则,如此改革不必主服的样式,由此传统的一样式表面等,如此代内容说明是纹样也代表的皮质,从中可以看出当时服装设计如何依靠人不仅能反映当时的美观,依旧遵传统于官人使得代于百分工业,并因和其之义原,\"新代化\"或\"必须现有\"服装样,此表现出改传统重历重的精神传统,历史积极向文化的意义,提出向历史与传统的思想,也代表设计者向历史发展进程中的美的独特体会。\n\n**服装的传承与创新**——服装以物质文明的进程,经历着社会审美情感变迁的过程,也是审视器物与技艺沉淀积累的历史演变过程,历代服装的形制、纹样、工艺都可作为设计者研究传统、汲取灵感的重要来源。\n\n#### （二）服装的继承与创新\n\n传统是事物已有的经历,经验的积累,是事物客观发展已久所形成认识的一种基础和承续系统,历史当代的人们认识事物,往往需要建立在已有的经验和积累基础上,借鉴传统而进行创新性传承发展。\n\n服装设计上,对传统本身也有独特设计上,主要在于是设计者对传统资源的态度,历代的服装设计作品有的服饰形态资料,同时也代表着历代人们的审美,可以说服装是\"形式\"与\"内涵\"两方面同时并存的文化遗产,前者提供借鉴的形式语言,后者提示其背后的思想与价值观念。\n\n20世纪初期,巴黎的工艺美术设计者们开了文化艺术改革的思潮,而其后传统的服装形态观念被大量打破,随着社会生产力的发展,服装的物质属性更多元化。工艺美术的设计者中很多设计师力求在打破传统固化形式的过程当中重新审视和重新利用传统资源转化为具有时代精神的新形式。\n\n服装是一个不断的历史进程演化过程,它是一个不断吸取历史养分基础上创新与再造的过程,不是简单模仿复制,而是要以传统为根,以创新为本,推陈出新,而不能简单沿用历史形式或全盘否定历史价值。\n\n20世纪70年代伊夫·圣洛朗(Yves Saint Laurent)设计的\"吸烟装\"系列作品,即是从男装传统形制中汲取灵感,融入女装设计而创造的经典创新案例,充分体现了传统与创新相结合的设计方法论。\n\n历史上,许多经典式样至今仍是的时装设计都产生过深远的影响,是不能设计师的当作一种恒常美进行长期的传承,英国\"Shirt-waist\"的西式衬衫式样,美国上半身包括裙、袍等均可作服装设计,均有立体的设计构成设计,通过设计的表达手法。夏姿在1925年所设计的\"新姿裙\"造型,充分展现了对巴黎经典造型服装的经典借鉴价值,创新的服装设计都要求既能表达古典再融合,吸取本身文化的时装,融合的西部,北方农村与当地的服饰文化,历史上被创作的作品,也是当代对历史文化时尚的重要设计资源,这些历史上一些经典的服装造型,通常会发生周期性再现,重复的规律性再流传,过年时,是国际时尚流行\"复古\"同款式的一种表现。\n\n历史上一些经典服装样式的复兴,都有深刻的时代内涵,它反映了以下特征:①优秀的传统服装样式是人类物质文化的宝贵财富,它的基本设计原理和美的造型,在历史上经受着时间、地理和当代性的双重考验;②历史上一些传统服装样式的复兴,都有深刻的时代内涵,它反映了当时社会的思想和审美观念。\n\n#### （三）走向绿色消费\n\n衣、食、行、住是人类生活的四大元素,人们的\"衣\"位居首位,可见衣服对于我们的重要性。人口日益十三亿多、庞大人口基数导致对服装的需求不一直大量的消费市场,推动了以纺织服装工业为代表的一次工业革命进程,20世纪初,是人类历史上人口经济、科技迅猛发展的重要历史阶段,社会分工细化更加清晰,不断有新的技术产生服务人类,便利了服装的产业化生产。\n\n绿色消费是可持续发展理念在服装生产消费领域的具体延伸和体现,是社会日益发展关注环保、生态与可持续性发展的一种理念意识和行动准则。它作为一种可持续消费方式,注重经济利益与生态利益并重,不以损害环境为代价谋求经济效益的消费,是人类文明进步的重要标志。\n\n绿色消费主要包括以下几个方面理念:①生产过程尽可能不使用带有毒性化学添加剂的原料,以及能循环使用非污染性材料的产品;②消费过程中体验消费产品与生态优美,消费性质本身或其消费方式和过程都不损害健康环境;③废弃处理阶段,产品或包装容易回收再利用,不污染或减少污染环境的产生。\n\n一些国际知名品牌纷纷推出以环保和可持续时尚为理念的产品线,如Vivienne Westwood、Stella McCartney等设计师积极倡导绿色时尚生活理念,通过采用有机棉、可再生材料等推动服装产业向更加可持续的方向发展。\n\n### 三、服装的文化属性与社会功用\n\n#### （一）服装的文化属性\n\n文化既是人类在生产实践活动中所创造的一切物质和精神财富的总和,也是人类社会历史沉积过程中,不断创造发展并遵循传承演变发展的过程和成果的总和;服装作为人类文化的重要组成部分,记录了人类社会发展和文明的进程,是了解一个国家、一个民族历史文化传承演化的活化石。\n\n服装的文化属性主要体现在:①服装反映了民族的、地域的文化特征;②服装记录了时代的科学技术、经济发展水平;③服装体现了特定历史时期人们的审美观念与价值取向;④服装承载了民族的信仰、习俗与社会制度等文化内涵。\n\n#### （二）服装文化的交流性\n\n服装文化的交流性表现在其发展过程中不同民族、国家和地区间不同风格的服装、面饰的相互影响、借鉴与融合,随着全球化进程的加快,这种交流与融合的速度和广度也在不断加深。\n\n服装的文化交流性表现在其发展过程中不同地域、不同民族之间的服饰文化相互借鉴、吸收与融合。丝绸之路是历史上最典型的东西方服装文化交流通道之一,中国的丝绸、纹样通过丝绸之路传入西方,同时西方的纺织技术、审美观念也传入东方,促成了东西方服装文化数千年来的持续交融。\n\n**文化交流的两种主要方式**:\n(1)不同文化区系之间的自然交流,即通过贸易往来、人口迁徙、宗教传播等和平途径实现的服饰文化交流融合过程,是历史上最主要、最持久的交流方式。\n(2)受制于政治军事(如殖民)等外力强制推行下产生的文化传播,这种交流常伴随文化冲突甚至强制同化,虽有历史局限性,但客观上也促成了不同服饰文化元素的碰撞融合。\n\n其发展至今,20世纪90年代以后,我国的改革开放使中国服装文化进入了最大量的交流阶段,西方现代服装文化理念快速涌入国内并深刻影响了国人的着装观念,与此同时中国传统服饰元素也日益成为国际时尚设计师汲取灵感的重要来源,呈现出双向交流互鉴的态势。\n\n进一步而言,无论历史还是当代的国际服装交流,总的看多元交流促进了世界服装文化多样性繁荣发展,不同民族、地区的服饰文化在保持自身特色的同时,也在交流互鉴中不断丰富发展、与时俱进。\n\n#### （三）服装的社会功用\n\n人类的社会生活的需求和创造发展有着密切,同时服装作为服务人类生活的重要工具,形成一定的社会角色,在中国古代,人们对服装形成社会等级功用的一方面以体现社会秩序,主要以中国封建时代\"礼制\"为代表,服装作为区分社会等级身份的重要工具,严格规定不同等级人群的服装样式、色彩、纹饰等使用规范。\n\n服装是人的第二身份,它对人的社会角色具有明确塑造作用,服装是人的社会属性的直观表达,不同职业、身份、场合往往对应特定的着装规范与要求,这种社会功用至今在制服(如军装、警服、法官袍、护士服等)体系中仍清晰可见。\n\n**\"色·衣\"**——中国传统服饰以色彩区分等级身份制度延续两千余年,历代帝王将相与平民百姓服色都有严格规定,如唐代规定黄色为皇室专用色,紫色为三品以上官员专用,这种色彩制度是中国传统服装社会功用的典型体现。\n\n人类着装的美化,是源出于生存的心理需求,并随着社会思想和实际内容而实用,具有其相应的意义和思想倾向的先觉性和内心的复杂化的表现,随着各历史地域中心理生活及思想文化条件所影响,生活在不同地域、不同民族的人民,由此形成的日常服饰、纹样等,来表现自己不同的生活活动内容和形态,以及所使用的服饰,反映了人对\"美\"的追求和自我认同的心理需求。\n\n美国哲学家爱默尔·希尔(Harr)在《时装的心理分析》一书中指出:服装的社会功能主要包括:①标志人们的社会地位和身份,是\"社会的意义符号\";②表达自我个性,是自我实现和心理满足的表达方式;③适应社会环境的一种保护色彩,色彩、面料等来自不同社会文化背景,反映了个人的一种\"隐藏\"或\"表现\",是社会文化和心理生活的直观呈现。\n\n服装作为记忆和承载社会的价值观和文化的重要媒介,随着社会经济发展,服装在满足人类基本御寒功能需求的基础上,承载了越来越多的社会符号功能与文化意义。\n\n---\n> **课程大纲提示(原书体例)**——课程名称:服装的形态范畴;课程内容:服装的概念、服装的分类与用途;课程时间:5课时;教学目的:了解服装的基本概念、服装的分类和文化类型,熟悉服装设计师与制版师的工作,包括如何画服装效果图和服装裁剪图;教学要求:分析服装的分类与用途,熟悉服装设计的过程。\n---\n"

      "body": "\n### 一、服装的概念\n\n#### （一）衣裳、服饰、服装、时装、成衣\n\n据古籍《易·系辞下》所指:\"黄帝、尧、舜垂衣裳而天下治,盖取之乾坤,乾为天,坤为地。\"天在上地在下,以尊卑而别贵贱,上衣下裳的形制由此而定为服。天子及诸候祭祀之服称为\"裳\";上裳称\"衣\",下裳称\"裳\",古书《汉书》有云:\"上曰衣,下曰裳\"。用现代汉语来诠释,衣是指身体上的部分统称,裳指遮蔽下体的服装部分,即所谓的\"衣\"、\"裳\"两个概念早期是分开的,后来才逐渐合并为\"衣裳\"泛指全身的服装。\n\n**服饰**是对人的着装形式的整体概括,泛指服装及其配饰(首饰、包袋、鞋帽等)的总和。\"服饰\"一词更强调服装及其所有配饰品作为一个整体系统的搭配组合关系,如\"衣冠服饰\"即涵盖了从头到脚的完整装扮体系。\n\n**服装**是我们日常生活中最常使用的概念,泛指人体所穿着的衣物统称,包括各类衣、裤、裙、袍等各种穿着于人体之上的织物制品。\n\n另有广义和狭义之分,狭义的衣,专指上衣,而广义上衣所指为\"衣\",不仅涵盖上身穿着的衣物,更泛指所有穿着于人体上的织物制品的总称。\"衣\"作为汉字的字形本义,即像人两臂张开、衣襟左右交掩之形,是象形字最初造字之源。\n\n**时装**是在特定的时间段内(通常指一个较短的时期,即当时或当季)流行的、代表当下审美与设计潮流前沿的服装形式,具有鲜明的时代性、流行性、季节性特征。20世纪之前,\"时装\"一词并未广泛流行,这一概念是随着19世纪法国高级时装业兴起而逐渐形成的,标志着服装设计开始进入有意识的、专业化的创作阶段。\n\n**\"时装\"一词的兴起**——19世纪中叶,法国设计师查尔斯·弗雷德里克·沃斯(Charles Frederick Worth)首创了高级定制时装的经营模式,将设计师个人的创造性与订制服务结合,标志着现代意义上的\"时装\"概念开端,他也因此被誉为\"高级时装之父\"。\n\n现代时装业发展历经三个时期的演变:①以高级定制(Haute Couture)为核心的贵族/上流社会订制时代;②以成衣化(Ready-to-wear)为标志的批量工业化生产时代,20世纪60年代以后成为主流;③当代多元化、街头风(Street Dress)与高级时装、设计师品牌并存的多层次市场格局时代。\n\n**\"成衣\"**——成衣即工业化批量生产的标准尺码服装,区别于传统的量身定制方式,是工业革命之后规模化生产方式在服装领域的具体体现,极大提高了服装的生产效率与市场普及度,是当代服装产业最主要的生产与销售形式。\n\n#### （二）服装设计师与服装制板师\n\n服装设计是对服装产品方案的策划与设计,涉及服装造型的整体考虑,包括面料、色彩、款式、结构、工艺等要素,是集设计者的艺术素养、专业技术、市场理念于一体的创造性活动。\n\n**制板师(Pattern maker/Cutter)**——制板师负责根据设计师的效果图纸,通过打版技术将平面设计转化为可裁剪制作的服装结构纸样,是连接设计构思与生产实现之间的关键技术环节。制板师需要具备精准的立体空间理解能力、扎实的服装结构与工艺知识,其技术水平直接决定了设计效果能否被准确还原实现,是服装产业中不可或缺的专业技术工种。\n\n现代服装设计工作,是设计师与制板师、样衣工紧密协作配合的系统性工程,好的设计需要制板师精湛的技艺予以准确诠释和呈现,二者相辅相成、缺一不可。\n\n#### （三）服装效果图\n\n效果图是服装设计的第一步,也是服装设计的重要环节之一。服装效果图往往以基本手法,通过一定的艺术处理方法体现设计的手法完成的效果图,是表现服装设计的造型特征和着装效果的一种最直观、最形象的方式。绘制效果图的目的可分为几种:向他人以文字方式作出的构思传达;帮助设计师本人从初步构思引导深化设计;用作最终制作沟通交流的技术依据参考。今天,随着服装效果图的表现手法越来越受到重视,它的功能不再局限于服装设计初步阶段的构思表达,而是贯穿设计全过程,是设计师传达设计理念、与制版师沟通交流的重要工具。\n\n#### （四）服装裁剪图\n\n服装裁剪图指服装装依据服装效果图进行的裁剪结构分解,用直线或曲线、结构线的形式表现出服装造型分解到结构生产制作过程中的构成关系,是服装设计转化为实物成品的关键技术环节。\n\n#### （五）服装的裁剪方法\n\n目前,服装的裁剪方法主要分为平面裁剪方法与立体裁剪方法,其中平面裁剪方法是使用的比较普遍和原型裁剪方法。\n\n**1. 比例裁剪法**——比例裁剪法在我国有20世纪初开始运用于西方的传统的服装裁剪中,通过测量身体各部位的比例数据,是应用比较普遍的一种服装裁剪方法,依据成衣裁剪的款式的服装裁剪方法,已被普遍运用于目前的服装制版结构行业,操作过程比较简明,并具体显示出服装体型规格的分类,便于比较不同服装造型的差异化处理,但这种方法所记录的图纸数据在制版转化时相对精确性、误差性较小,而随着服装造型变化更大更趋复杂,该方法在款式变化中的局限性也逐渐显现。\n\n**2. 原型裁剪法**——原型裁剪法是20世纪80年代,以我国外语教材版权引进先进方法,以国外先进服装制版技术为原型,是当今国际服装结构制板中最常用、最科学的裁剪方法之一,原型是以人体各部位基本尺寸为依据、以最简化的形式表现出人体基本形态特征的服装结构基础样板,它们是作为进一步展开各种造型和款式设计的基础纸样,原型的构建方式包含了对人体运动量、松量、面料特性等多方面因素的科学考量,还需要根据设计款式的变化,运用原型裁剪法进行相应的省道转移、切展等结构处理和技术运用,更适应于现代企业和学校服装教学中的应用。\n\n**3. 平面裁剪法**——平面裁剪法主要指依据国内二十世纪80年代所引进日本平面服装裁剪结构方法,经不断发展完善而形成的一种服装裁剪法,即依据人体各部位测量,主要依据其尺寸比例数据,以直接绘制服装结构图的裁剪方式,适合于成批量生产标准规格的服装打版制作。\n\n平面裁剪的过程,首先要测量人体各部位尺寸,主要部位尺寸(如领围、胸围、腰围、臀围等),利用已知的计算公式,建立起数据结构,并按此进行款式变化(如省道转移与位移)——最后得出结构裁剪的样板结构。\n\n**4. 立体裁剪法**——立体裁剪法起源于西方,并被西方国人视为重要的服装造型创作方法,它是平面裁剪法无法完全取代的一种独立的设计与技法体系。它是设计者以人台或活体模特身上进行直接的观察和披挂造型,直接以立裁的方式创造造型和结构,达到设计者所需要的服装效果,不经过绘图与测算数据的中间环节,更加直观、准确地表现出面料在身体上的悬垂效果与空间造型关系。\n\n立体裁剪的技法能有利于人在立体空间中直接进行造型的构思,因而一直多用于晚礼服、婚纱等对造型要求较高、结构较为复杂的服装类型创作,通过不断的调整立裁试样,可以达到平面裁剪不易实现的一些立体、多变的曲线造型效果,而且立体裁剪与平面裁剪也常结合使用,称作\"综合裁剪法\"之称。\n\n### 二、服装的分类与用途\n\n#### （一）服装的分类\n\n现代服装品类繁多,几乎可以从不同的角度进行归纳分类,一般可以按以下十个方面分类:\n\n1. **从时间上分**——从时间分服装即是基本流行方法,四季季节分为春装、夏装、秋装和冬装。\n2. **从性别上分**——分为男装、女装以及儿童与中性服装。\n3. **从时态上分**——从穿着状态分为传统服装与时装。\n4. **从活动性质分**——分为职业装、运动装、社交装、休闲装、旅装、礼服等。\n5. **从年龄上分**——分为婴幼儿装、童装、少年装、青年装、中年装、老年装等。\n6. **从材料上分**——分为纯棉服装、皮革服装、毛料服装、棉布服装、化纤服装、麻料服装等。\n7. **从工艺制作上分**——分为中式服装与西式服装。\n8. **从服装结构样式上分**——分为宽式与紧身式上分。\n9. **从设计师用途上分**——分为实用装与艺术表演装。\n10. **从服装的文化类型上分**——分为传统类型与现代类型。\n\n#### （二）服装的文化类型\n\n**1. 实用服装设计**——实用服装设计者常以自身实用性为目的的设计,更多考虑功能性用途和穿着实用需要,实用装是最普遍生活中最常见的服装,包括职业装、日常装、家居装等,其考量核心在于满足人们日常生活穿着的功能性需求,是服装设计的最基本形态。\n\n**2. 礼仪服装设计**——所谓礼服,指规范的社会行为规定,在正式或所约定礼仪的规范和礼仪场合中的着装。礼仪服装是在人们社会活动的重要礼仪场合所穿着的服装,应遵循相应场合的着装规范和礼仪要求,是社会秩序在服装领域的具象化体现。\n\n礼仪服装的呈现形式表明了礼仪的重要,常有约定俗成的形式规范可循,不过,\"礼\"因此,一社会的需要而实际社会活动的礼仪要求生产,在正因需要于服装形成的社会形态,在礼仪服装的社会行为约定的种种规范与伦理规范活动的种种约束,礼仪服装的社会作为礼仪行为的活化石。\n\nFormal Wear——即是指在正式社交场合中穿着的**特殊礼仪服装**的用语,如晚礼服在西方特指于正式社交场合穿着的服装,分为公务性、社交性、礼仪性的场合应用需要。\n\n**3. 职业装设计**——职业装,即是标示职业特征时又是用于工作的场合服装,它包括社会公众、社会形象和视觉识别系统(CI)的具体应用,具有可辨识性和视觉规范化统一的重要功用,同时兼具工作过程中人体活动需要的功能性设计考虑。\n\n- (1)功能上实用性——包括标志身份、反映不同工作性质的特性,工时穿着的实用性、耐用性等要求。\n- (2)标志上实用性——用于识别性区分,反映其社会角色、企业形象等身份标志。\n- (3)组织上适用性——以团结意志为目标的创意设计。\n- (4)倡导性设计——赋予工作人员对工作认知的凝聚统一。\n- (5)针对性设计——以标识区分为目标的创意设计,更适合于现代企业和市场目标要求的意识设计中运用。\n\n**4. 创意服装设计**——创意服装设计以超前设计意识为目标的设计,不受实际穿着约束和市场应用可穿性的局限,以设计者个人创意与艺术表达为主要追求,是设计师个人风格与艺术观念探索的主要方式,如三宅一生(Issey Miyake)等设计师的观念性创意作品……意念不惜不比服装本身重要,至少等等考虑。\n\n#### （三）上衣与外套的常用类型\n\n**1. 西装**——西装(西服),男式(西服)是仿英式套装为主的服装形式之一,20世纪初,男装以女性为绅士服装形制,受男装典雅端庄的形式风格影响,时至现代,已成为国际通用的正式商务社交着装形制,材料和结构讲究,一般由外套、衬衫、领带、马甲、长裤等构成完整套装体系。\n\n**2. 中山装**——中山装根据孙中山先生的穿着设计而来,是具有中国典型代表性的服装,西式服装或西式服装造型元素的一种服装,是以西装的三件式结构为基础(袖窿、领口、门襟等)融合中式元素形成的独特服装式样,兼具中西服装设计的形式特征。\n\n**3. 西装背心**——西装背心是与西装配套穿着的无袖上衣款式,可作为西装套装的组成部分单独穿着或叠穿于衬衫外、西装内。\n\n**4. T恤**——T恤,英文\"T-shirt\",原为一种因领型如T字形而得名,其形形结构又文T字母字形而得名之一。\n\n**5. 牛仔装**——牛仔服原为美国人在开发西部的黄金时期,矿工们的一种劳动服而设计的,其面料有耐磨、耐穿的特点,是牛仔专用布(斜纹粗棉布)材质制成的服装类型,伴随牛仔布(Denim)工艺发展,牛仔服的设计款式与风格也日渐多样化,当代早已超越劳动服范畴成为全球风靡的休闲时尚经典单品。\n\n**6. 大衣**——大衣泛指上衣与一体的服装外衣,可分为大衣长大衣、中大衣和短大衣三种,其主要品种有礼服大衣、短大衣、休闲大衣、青年时装大衣等。\n\n**7. 夹克**——夹克为英文\"Jack\"的音译,是短上衣的总称。\n\n**8. 蓑衣**——蓑衣是以稻草等自然植物纤维材料手工编织而成的一种传统雨具服装,兼具御寒和防雨的双重实用功能,是中国传统农耕文化的重要服饰载体之一。\n\n#### （四）裙装的基本类型\n\n服装中的裙,最富有魅力和变化多的要素\n\n女裙的设计,中国历代服饰千百年变化,从形制上看,无非为上衣下裳和上衣下裤的服装形式,总的说,不论历经何种变迁,女裙始终是中国服饰文化中重要的组成部分。1991年,三宅一生设计了一款为世界人所知名的A-Poc,是为不落于设计伦理为基础的男女无异都可穿用的裙装,成为服装史上颠覆性别界限的经典创新范例。\n\n裙装一般以裙腰和裙体的构成方式,可分为以下几个主要种类:①连衣裙(裙腰与上衣连为一体);②背带裙(以背带固定于肩部);③斜裙(裙片以斜线剪裁,展开呈波浪状);④鱼尾裙(腰臀部合体,自膝部以下展开呈鱼尾状);⑤超短裙(裙长通常至大腿中部以上);⑥超长裙(裙长垂至脚踝或地面);⑦塔式裙(以多层重叠的裙摆构成塔状造型)等。\n\n**1. 背心裙**——背心裙又称\"马甲裙\",指上半身为无袖背心式结构的裙装,搭配可穿着于衬衫外,造型简洁,更显青春靓丽,不乏文静、休闲的气质。\n\n**2. 斜裙**——斜裙又称喇叭裙,是腰部合体、裙摆以斜线放射状展开呈波浪造型的裙装形式,可分为三角形斜裙、圆形斜裙、六片式等多种结构裙型,斜裙的裙摆随着行走摆动呈现自然飘逸的动态美感。\n\n**3. 超短裙**——超短裙也称迷你裙,指裙长至大腿部位、膝盖以上的短款裙装,1970年美国著名高级女装设计师安·芙特(Everest)率先设计推出,成为20世纪60年代年轻一代反叛传统、追求自由个性的时尚标志性单品之一,其设计理念也深刻影响了此后数十年的裙装设计流行趋势。\n\n**4. 鱼尾裙**——鱼尾裙特征呈腰臀部合体、膝部以下自然展开如鱼尾状的裙型,常运用于晚礼服设计,以突显穿着者的曲线身形之美。\n\n**5. 塔式裙**——塔裙也称蛋糕裙,以多层重叠的裙摆构成层次分明的塔状或蛋糕状造型,具有活泼、俏皮、浪漫的视觉效果,常用于礼服和休闲装设计中。\n\n**6. 筒裙**——筒裙指从裙腰开始自然垂落呈筒状或管状造型的裙型,又称直裙,常见的有旗袍裙、西装裙、夹克裙、围裹裙等。旗袍裙左右侧缝开叉,因其造型与旗袍腰部以下相同而得名;西装裙通常采用收省、打褶等方法使裙体合身,与西装上衣配套穿着而得名;夹克裙注重拼接装饰,在缝合处巧妙处理,有横插袋或明贴袋,裙后中缝开衩或前中缝开门,也可采用暗褶,因与夹克的装饰特点相近而得名。海南省黎族妇女喜穿无褶筒裙,有长筒裙和中筒裙之分,裙上绣有几何形图案,非常精美。\n\n**7. 连衣裙**——连衣裙指上衣和裙子合为一体构成的裙装,种类繁多,在裙式造型中被誉为\"款式皇后\"。连衣裙可以根据造型的需要形成各种不同的廓型、不同的腰节位置,几乎所有的装饰方式都可以根据需要运用在连衣裙上。因其造型多样、秀丽,适合各层次的妇女穿着。最早的形式为清代的旗袍,也属连衣裙的一种,因受剪裁方审美思想的影响,经改良,裙子的腰部紧窄、臀部围度宽出,下摆又较窄,更加符合个人的体形和曲线之美,加之用料省、裁剪简易,成为中国女性着装文化的典型形态之一。\n\n**8. 晚礼服**——晚礼服指女士在夜晚社交场合中所穿着的华丽裙装。西式晚礼服选料上乘,色彩光感强,具有极强的独特性和排他性。款式多采用抹胸露肩长裙式,展现出着装者的端庄大方、潇洒优雅,有强烈的表现性和雍容华贵感。\n\n**9. 缠绕裙**——用布料缠绕驱干和腿部,用立体裁剪法裁制的裙子。因其缠绕方法不一,裙式也多种多样。缠绕裙常作为晚礼服,当人体动作时,裙体皱褶的光影效果给人以韵律美感。\n\n---\n> **课程大纲提示(原书体例)**——课程名称:服装的形态语言;课程内容:服装的廓型设计、服装的造型要素、服装的部件设计;课程时间:7课时(含放服装设计大师作品影像2课时);教学目的:了解服装廓型设计的基本原理以及点、线、面要素、立体造型与服装领、袖、口袋的设计方法;教学要求:通过对服装整体设计的讲解,熟悉服装形态要素的设计方法以及面料的类型和运用方法。\n---\n"

      "body": "\n### 一、服装的廓型设计\n\n#### （一）廓型的视觉原理\n\n服装设计包括点、面、色、质等构成方式即服装的整体造型和轮廓,英语\"silhouette\",意思是轮廓剪影,泛指服装外形的剪影效果。是服装最能表现视觉造型效果的部分,美国著名心理学家鲁道夫·阿恩海姆(Rudolf Arnheim)在《艺术与视知觉》一书中提出:\"三维物体的形通过二维图形(即轮廓)传达出丰富的信息\",服装造型的成功,很大程度上取决于其外部轮廓形态是否具有独特性与美感。\n\n#### （二）廓型风格的演变\n\n服装设计中,必然具备丰富的想象力和创造力,通过廓型而言,首先表现在设计时对服装\"廓型\"的构成上,世界服装史上有许多著名设计师的创新型都以极为夸张个性的廓型闻名于世,如20世纪50年代末克里斯汀·迪奥(Christian Dior)所设计的\"香槟瓶型\"(Champigen Line);20世纪60年代日的\"倒圆锥形廓型\"的创新设计。1997年川久保玲的设计作品中带有强烈实验性质的主题命名为\"Dress Meets Body\",给全球时装界的服装形态带来一次颠覆性的冲击。\n\n#### （三）廓型的不同类型\n\n从字面意义上讲,服装的基本廓型可概括为十种,即H型、A型、X型、T型、Y型等几类,同样对应几种简洁字型来意示服装廓型,运用简明,概括力强,是服装设计中最常用最基本的廓型分类归纳方式。以点为主的设计方式,通过对造型的具象几何形态归纳,可以帮助设计者快速把握与传达设计意图。\n\n1. **H型**——1954年,迪奥在秋冬时装发布中提出了H型服装造型概念,肩部宽松平直、腰身不收省合体,是整体呈直筒状造型的服装廓型,整体呈现宽下摆或宽下摆造型,强调线条流畅、宽松自由的舒适廓型,具有简洁、休闲的现代感,是当代日常装设计中广泛运用的经典廓型之一。\n2. **A型**——A型主要是通过肩部窄、下摆宽大的直线形轮廓构成三角形式样,通过肩部与下摆两端呈现的比例反差,营造出上小下大的稳定三角形式廓型,视觉效果活泼、俏皮,常运用于青春、休闲风格的女装设计中。\n3. **T型**——T型强调肩部的宽度,轮廓线呈上宽下窄的倒三角形式,力量的象征,而且还有阳刚之气,常运用于强调力量感或前卫风格设计。\n4. **X型**——19世纪末及二次世界大战后的裙装采用了X型,一款穿着造型强调肩部适度扩宽、腰部收紧、下摆蓬松展开,是一种理想体形的塑造效果,X型强调曲线美,是女性化廓型的经典代表,尤其适合女性穿着。\n5. **Y型**——Y型强调肩部宽度,常配以下装收窄的比例设计,是一种强调上宽下窄、上装夸张的对比效果的廓型形式,大方、洒脱的效果。\n6. **腰鼓型**——腰鼓型也称灯笼型廓型,中间膨胀两头收窄,1990年流行于亚洲的裙装形式。\n7. **火炬型**——设计,即\"高腰式\"设计,下装的搭配和体形,是\"腰部提高的服装形式,提高的比较高,是要提高一段的比例造型效果。\n8. **喇叭型**——喇叭型服装上宽下窄,可稍加限制,特点在于摆动摆幅度大,上摆和腰部随体动而摆动流畅。\n9. **郁金香型**——整体造型宛如一支含苞待放的郁金香,腰部以上收窄、下摆自然舒展外扩,呈现优雅、含蓄的浪漫气质。\n10. **茄子型**——廓型呈两头收窄、腰腹部丰满的曲线廓型,有上小下小、中间凸出的形态特征,通常运用于强调腰腹部造型的服装设计中。\n\n**11. 鸵鸟型**——鸵鸟型是由随体型自然摆动而摆下摆的服装造型,腰部合体,下摆呈现自然舒展的伞状效果。\n\n### 二、服装的造型要素\n\n服装设计属于艺术设计的范畴,服装设计的构成元素与艺术设计中的其他元素并不例外,应回归到艺术设计的元素范畴中所具备的元素——点、线、面、色彩和肌理都是相通相连接的,服装造型设计元素通常按视觉艺术设计元素归类分,色彩、材料、质地肌理等要素同样是构成服装造型的重要决定性因素。\n\n#### （一）\"画龙点睛\"的作用\n\n点,是造型设计中最小的元素,具有一定空间位置。有一定的比例视觉效果,同样也是构成服装形态基本要素,在整体设计中,最集中体现在服装门襟、口袋、纽扣、装饰等等各种小的构成部分,在纽扣、口袋、装饰位置的设计中,点的运用可以起到画龙点睛的效果。当作为设计元素运用时,点在设计中不仅可以起到视觉焦点的作用,而且随着点的大小、疏密、组合、位置排列不同,能够营造出不同的视觉节奏与设计意图。\n\n服装中纽扣就作为点的最常见的造型要素,纽扣的种类多、常见有疏钮盘扣、缠盘扣、镶嵌纽盘扣、盘扣设计为一体,如西装纽扣、门襟处纽扣等不同的服饰造型,主要配面在服装的门襟上,有多种不同的服装扣样式,当今设计中低领扣,直排扣的20世纪30年代始采用有着和着精细,低领配套的20世纪70年代\"小外\"扣所形态的解释。纽扣的种类中蕴含着丰富的历史与文化,是探讨服装造型语言的重要参考。\n\n#### （二）面料上的点元素\n\n在服装设计中的点元素设计,应注意点的形状、位置疏密的呼应关系,整体与局部的关系以及对产生视觉美感的秩序法则运用。\n\n**1. 纽扣和装饰扣**——服装与服饰的装饰配件都可以视为点元素运用,除纽扣外,如挂饰、包扣、拉链头等作为点元素装饰,不同的点的运用可以起到装饰美化、突出局部或点缀整体氛围的效果。\n\n### 二、线的变化与性格\n\n点的连续移动构成线,它在空间中起着走向的作用,服装造型是通过线来达成结构轮廓、装饰效果、结构分割的表达,是几乎所有设计造型元素中占有非常重要地位的核心构成要素。线的性格特征直接影响着服装的整体视觉风格,直线简洁刚毅,曲线柔和婉约,不同线条形态与方向的组合能塑造出丰富多变的服装造型效果。\n\n线在服装造型设计中的主要功能包括:轮廓构成、结构分割、装饰点缀等,通过对线的粗细、疏密、曲直、方向等要素的变化组合运用,构成服装形态各具特色的形式风格,是服装造型语言表达最基本、最重要的构成手段之一。\n\n#### （三）面的分割与造型\n\n面,是造型设计中的一个重要因素,是一个二维空间的概念,所以,它有一定的稳固和形状,如正方形、长方形、圆形、不规则形等,从心理上看,面给人的视觉感受是最强烈最重要的一个要素,服装造型很大程度上是由几个不同的面所组合而成,面的排列组合方式赋予服装丰富多样的造型可能性。\n\n服装设计中,平面几何形是服装造型面的三种最基本表现形态:正方形、长方形、三角形、圆形和椭圆形,根据不同的表现形态所形成的不同分割组合方式,服装的立体造型是通过面料本身的可塑性,加以不同分割组合的裁剪与制作而实现的。\n\n#### （四）面的分割与造型\n\n面的分割是服装造型设计中一个非常重要的表现形式,面的分割方法多样,常见的横向分割、纵向分割、斜向分割及组合分割等,不同分割方式产生不一样的视觉效果,面的分割设计不仅是简单的表面划分,而应服务于整体造型结构与美感效果的塑造。\n\n服装造型中不同大小、比例的面元素相互组合搭配,能够产生极为丰富的视觉效果层次和造型变化,是服装设计造型语言中最具表现力和塑造性的元素之一。\n\n#### （五）服装设计中的\"空间感\"\n\n服装的\"空间感\"是近代著名服装设计师将服装造型的一种表现概念,也是服装设计中重要的美学理念。现代服装设计不再局限于平面服装构成的空间概念,而是重新考虑到服装构成的空间、色彩、质感,细节形式等要素,营造服装本身的立体空间感,更进一步涉及到服装造型与人的关系以及穿着状态下所形成的整体空间形态。\n\n服装的空间感,通常可以从静态空间和动态空间两个角度考量:静态空间指服装本身构成的立体空间形态(如服装的层次、体积感),动态空间则考虑人体穿着运动状态下服装与人体之间形成的空间变化关系,其与人与空间构成的相互关系,构成整个服装造型完整的思考所考虑的三个方面,称为\"三度空间\"。\n\n服装是\"流动的雕塑\",不同的立体形态呈不同的个性,同时从人不同的角度观看,服装体也各表现出不同的视觉效果。因此,在服装设计中要考虑整体的\"空间\"方式:一方向的空间可考虑面料的形态与结构,另外一方面通过对造型的组合形态进行设计使服装具有质感,并展现该造型本身的一种\"张力\"和空间感,进一步通过服装本身多变形态存在的立体空间,与人体本身互相衬托作用,形成综合动态的美感效果,而一定的空间形式和造型,人体与三维空间的整体一定的空间关系。\n\n服装造型形态与人的关系密切,建筑重视体积的外形,突出人与周围的关系;了解这层空间形式,服装设计中考虑的形体感,采用相似的层次和线条,如是超越了对服装本身的表现,让人达到了空间和主体的共鸣关系,通过对局部与整体的空间层次的把握,进一步理解和运用于服装造型的三维空间与人体互动关系的表达,超越面料层面之外的更加立体、多维的美学表达方式。\n\n### 三、服装的部件设计\n\n服装的造型作为一种有机的形态,是由服装的形态要素,以及各种部件构成的,这些部件相互组合而成为服装的整体外部形态,是不同部位造型语言相互协调、共同构成服装整体造型的美感表达重要方式。\n\n服装的部件设计中,一般指领、袖、口袋等,这些设计要素为形态与造型上的核心组成部分,以及各种细节、面料材质等要素共同构成服装的完整表达。\n\n#### （一）领型的设计\n\n衣领是构成服装造型中最重要的要素之一,处于视觉中心、所谓\"画龙点睛\"之处,它决定了服装于是最关键的设计元素,一般分类为领和领型两种。领可分为(无领、翻领)、开门开(开门式);无领的领型只有领窝(或领围),有领的领型则包含领座和衣领两部分,设计时应考虑领座与衣领的比例结构关系。\n\n1. **立领**——立领设计包含开门式(中开、右开)领形以及\"旗袍领\"等,领形上开门以及开门位置的变化,领形高低、宽窄、大小的变化,均可打造出不同的风格特征。\n2. **翻领设计**——翻领设计包括开门深浅度的变化,领角形态变化(尖角、圆角),领形宽窄(长领、短领)等,这些设计元素产生风格迥异的视觉效果。\n3. **无领设计**——无领设计包括开门方式的变化,包括横开、竖开、宽窄深浅度的变化,款式风格随开领方式变化多样,举以下三种设计变化种类为例:\n   - (1)对襟式:采用左右对称、方形、圆领、露肩、纯情浪漫等设计,款式庄重、多用于正规礼服设计,如现代古代服饰领形的例证,现代中式服装的女装礼服。\n   - (2)平衣式:主要以对称的形式设计,由于不对称造型的存在,设计上其风格活泼、自由,由此变化产生其独特性的、有较多变化的空间。\n\n#### （二）袖型设计\n\n袖子在服装造型设计中占有重要地位,它是最贴合人体运动幅度和运动机能的重要部位。是主要影响因素之一,为了突出袖子设计的形态变化效果,可用剪口、褶皱、镶嵌等其他不同的表现手法,配合领型形成整体设计的呼应关系,使袖形与领形相互呼应,营造出整体服装造型统一和谐美感的重要设计手段。\n\n#### （三）口袋设计\n\n口袋是服装式样构成要素之一,在服装设计中具有实用和装饰两重意义。不仅式样的口袋有不同的形态,经常使用的类型:袋在贴袋在衣服上的装饰,袋在挂的形式常常存在于口袋衣服上,而暗贴口袋通过款式效果的手法造成一定的形态感,袋型体现设计特点也如变化,袋形也可根据设计的需要变化,常见的袋形包括贴袋、插袋、双嵌线袋、单嵌线袋、有袋盖袋、无袋盖袋等多种类型。\n\n---\n> **课程大纲提示(原书体例)**——课程名称:服装设计的载体——面料;课程内容:面料的概念和分类、面料与服装设计;课程时间:5课时;教学目的:了解服装面料的基本知识,掌握面料与服装设计的关系;教学要求:通过对服装材料的讲解,对材料选择和应用有一个深刻的了解,从而提高服装设计能力。\n---\n"

      "body": "\n### 一、面料的概念和分类\n\n#### （一）面料的概念\n\n面料是体现服装主体特征的材料,是服装设计构想传达实施的载体。作为服装三要素之一,面料不仅可以以诠释服装的格和特性,而且直接左右着服装的色彩、造型的表现效果,是达之的材质、色彩、质感,而搭配所织的服装设计提供了自由发挥的空间可能,materials的质感与选择直接影响到服装设计构思的传达和作品的最终呈现效果,并引发设计与创作。\n\n#### （二）面料的分类\n\n一般而言,面料可分为机织面料和针织面料两大类,这些面料以各自的造型特征、悬垂性、稳性决定服装的风格和用途,机织面料是以纵横相互交叉、结构和排列有序而织成,是热工业化纺织中最常用、应用最广泛的一类面料;针织面料是以线圈相互串套连接而成,具有柔软、悬垂、弹性等特点。\n\n构成面料的原料首先分为天然纤维和化学纤维两大类,天然纤维是以自然界物质为原料,加工成为适宜于纺织的可用应用的形式,天然纤维经过纺纱之后加工成不同的织物形式;天然纤维和化学纤维通过纺纱或织成不同的织物,并混合应用于纺织织物之中。\n\n用于纺织的天然纤维主要有棉、毛、丝、麻的类别,棉和麻是植物纤维,毛和丝是动物纤维,是要根据不同的地区和纺织科学的发展逐渐所形成的面料形态,面料的种类不断丰富拓展。\n\n面料的种类不断丰富,人类经过长期的对面料\"柔软性\"的追求,随着现代科学纤维材料应用及纺织技术的发展进步,超柔软材料(\"Super-soft\")面料就是当年美英日纺织面料工艺的重要成就之一,现在消费者对着装的需要,已趋\"柔软化\"效果的应用,利用微细纤维等编织技术,使用现如今已经能达到令人惊讶地纤维柔化和纤维柔软度效果,面料的\"轻\"和\"轻程\"两大特点,\"绿色纤维品\"已成为21世纪纺织工业的突出主题,随色纺织业和生态服装成为纤维材料,绿色染化和纤维及生态生产条件等条件持,即时也应当技术、艺术和市场的完美结合和统一,并成为推进服装创新与设计发展的重要动力。\n\n### 二、面料与服装设计\n\n在我国艺术设计中,面料不仅仅有可用于实用功能,还有美学上的装饰效果,是服装的发展趋越来越依托材料的特色,风格、性能与力等设计,以我国服装穿的着效应,面料在服装设计中的重要意义所在。\n\n#### （一）面料与服装设计的关系\n\n对服装设计而言,若说是一个不实操中\"立场\"的开花,其中在的服装造型艺术设计,则应该是通过面料及其形式载体加以体现出来的,因此在服装设计中,面料的选择运用,与款式和造型有着密切协作的关系,面料是服装设计造型和艺术效果得以实现的物质基础,不同的面料属性(如厚薄、软硬、悬垂性等)直接影响服装造型的可行性、造型的呈现效果以及着装的舒适度。\n\n服装设计构思与其呈现的最终效果之间,面料如同油画中的颜料、雕塑中的原材料,是设计构思转化为实际成品的物质媒介和载体,设计师须充分了解和把握不同面料的特性(悬垂感、光泽感、肌理感、弹性等),才能选择恰当的面料匹配设计意图,实现设计效果的准确表达。\n\n#### （二）面料的选择\n\n一件完美的服装,其面料的选择甚至更为重要,面料的质感、色泽以及面料的搭配是设计的重要环节,是关乎设计效果表达能否成功的关键因素之一。面料、款式、色彩三者构成服装设计的三大要素,缺一不可,是服装设计整体艺术效果得以呈现的物质基础。\n\n由于面料的种类多种多样,主要以性能分类,可分为夏季面料和冬季面料,棉、麻、丝、毛以及化纤面料从质地上均有各自不同的应用特点,是选择材料应用于服装设计中的重要参考依据。\n\n面料带来了众多变化,各种面料的手法和各种工艺形式交织组成形式不同,五花八门。例如,传统的毛的加工技术开发了新科技运用新的面料,为传统的品类添了一种精美和现代的时装面料的图性,一件具有粗糙质感和肌理感的面料也许能够运用于外观新颖已计算成为设计的图形,是有着一点不失优雅,精细不与织物设计出的迷人色调时,也产生令人感觉温暖处质地和舒适感,在原有更加机理的面料中的印染具有生气和风情,使其产生出的时尚也是被穿的服装。\n\n外观新颖已经成为让设计的一种最高的追求,于是显示服装配用新型面料、织新面料,大量面料还运用于化纤织物系统方法,在此我们研究者,先此我作用不能一体,能反射或强反射的面料,以及在服装和衣料被赋予新颖的服装图性,那些运用作用于能仿的服装意味着新的时代。这些印刷物经能强调不断的面料生结黄和物质,还是原状态形态,来演绎新的物质,如无沦的表面还是,而有些面料材料本身超越了均衡的态度,如提供大量与人生皆很多相互相通的面料,以此形容外的面料相配面料变化,巧妙的运用与打理及物质变化,可运用性质感。\n\n此外,较多的物质分行,内容较服装的形态感和吸取,应对发觉的物质面料带来更多可能性。\n\n通过面料材质的独特感和情不同,越能给\"金属大师\"的面料设计中的方式一种给方式,被誉为\"金属大师\"就体现出材料的转形式一种,这是各种金属材料在他的手里都是得到巧妙的运用,他所设计的服装看起来别人都为工业形态,微缩机的印刷、纹样,或者材料、纸和纸样,纸和布局以及外观图形和印染色的物质等作为服装的奇效果。\n\n#### （三）面料的再造\n\n对材料的开发和再造,在客观上显示出设计师的科学思维和理性思考,在使代服装设计领域,尤其是在一些高级时装的塑造表现上,对面料的创意研发,特别是对材料重要而追切改良已经成为体现服装创新能力的第一目标,所谓面料的重新再造,是指利用面料的第二次设计,即根据设计需要,对成品面料按照工艺程度,进行再造二次改造制造,使其更加符合设计意图、独特造型效果与审美要求。\n\n三松者提到设计中三宅一生的作品之所以让世界瞩目,很大程度上就是因为他不局限于原始材料的物质研究与运用,三宅一生将设计与技术媒质相结合的面料再研发的面料创新的物质研究,创造出的独特面料,再造和探索出别具一格的作品之感,在原始面料属性的基础上通过再造二次工艺处理,创造出崭新的材质效果与视觉表达。\n\n以如粗糙的表面调理的的印染物制品的经济体验,清脆滋作出水,通过低起状的效果和最丰富的态度和相当独特出发,三松一生带乡实验的物质思考,提现了面料工二次创新处的完美搭配,一举分是面料的设计的柔性,和构成整体的最丰富创造设计视觉语言,被时誉予新称为\"布料的魔术师\"。\n\n---\n> **课程大纲提示(原书体例)**——课程名称:服装与装饰;课程内容:服装设计的形式美法则、服装的图案、服装的色彩、服装的种类及其在着装中的意义;课程时间:5课时;教学目的:熟悉服装设计的形式美法则,服装的图案,服装的色彩及饰物的种类及其在着装中的意义;教学要求:通过对服装设计的形式美法则的讲解,对装饰的内容有一个全面系统的了解。\n---\n"

      "body": "\n### 一、服装设计的形式美法则\n\n服装设计,不仅要研究人的生活方式,还要研究服装的美学,现代设计的思考,最重要的因素,就是人的行为方式。设计的思想理念的表达,来自其他生活的社会的一部分,例如服装形态的发展与一变,是要根据服装的一定变化,更重要的一部分因素。服装形态的形态化与一变,是服装形态的一种表现变化,服装形态的变化的规律,更多在于设计者对于形式艺术的一般规律和法则的掌握与运用。\n\n#### （一）变化与统一\n\n变化是艺术的形式与个人,是生命的活力与情感的表现,服装的美学的规律追求变化的统一,一是服装形态的整体统一,服装形式在艺术美中,最重要的一部分。既要有变化又要有整体的统一感,既要变化又要统一,服装系统的一种整体美感是服装设计中不能忽视重要的美学法则。\n\n#### （二）对比与调和\n\n对比与调和法则是各种要素之间对比呈现的关系。对比是各要素间存在的明显差异,体现着相对性、独立性、鲜明性等对比关系,如面料与面料的对比,色彩与色彩的对比,大小、长短、粗细等形式要素之间的对比等,均可产生强烈的视觉冲击效果;调和则强调各要素之间的融合、和谐、协调统一的关系。二者在服装设计中是相辅相成的对立统一关系,恰当运用对比与调和的辩证关系,能使设计既有变化的视觉张力,又不失整体和谐美感。\n\n#### （三）平衡与对称\n\n服装设计中的平衡直接是设计要素中稳重和平衡的心理感受,服装设计中不对称两种形式,对称形均衡,指轴线上或左右不对称的相同的图形,体现了秩序井然、庄重稳定的美感;不对称形式指围绕重心保持视觉上的相对平衡,但具体形式各要素并不完全相同,更加灵活多变,富于动感与个性化表现。这种关系在服装设计中体现为服装的分割结构、色彩分布、装饰配件的呼应等多方面综合考量。\n\n#### （四）比例与尺度\n\n在服装设计中比例尺度是服装各部分及部分与整体之间的比例关系,是决定服装造型美感的重要因素之一。人体自身构造中蕴含着自然的黄金比例关系(如1:1.618),被誉为\"黄金分割率\",这种美学比例关系被大量应用于服装设计的分割比例结构中(如上下装比例、腰节位置等),能够营造出符合大众普遍审美认知的和谐美感效果。\n\n#### （五）节奏与韵律\n\n作为音乐术语,节奏与韵律广泛渗透于人类审美生活的方方面面,它是设计中重复性、渐变性等元素的有机运用所产生的一种视觉美感体现,常成为服装形态设计中制造韵律美感的重要手段。\n\n服装造型设计中不断反复的节奏,韵律可以体现人的感受的表现,反复、渐变等节奏类型,以及不同的间隔和不同变化程度都能带来不同的视觉节奏感受。\n\n**(1)相同形式:线的反复,相似的形、色的重复排列等,是构成基础节奏韵律感的主要形式方法。**\n**(2)渐变形式:线的粗细、面积的大小、色彩的深浅等按一定规律逐渐变化排列的形式。**\n**(3)交替形式:色彩的变化和造型元素的交替排列组合运用。**\n\n总而言之,服装造型设计中通过对节奏韵律的把握运用,能够创造出富有变化又不失协调统一美感的设计效果。\n\n### 二、服装的图案\n\n#### （一）服装图案的类型\n\n图案在服装上是最直观强烈的装饰效果,并具有相应的历史与文化传承价值,传统的图案纹样一般都蕴含着丰富的历史文化寓意和吉祥寓意,通过图案设计传递着服装设计者所要表达的思想情感与文化内涵。\n\n服装图案按照表现形式可分为具象图案、抽象图案、几何图案等类型;按其构成方式又可分为单独纹样、适合纹样、连续纹样(二方连续、四方连续)等类型;图案的题材来源丰富多样,包括动物纹样、植物纹样、几何纹样、人物纹样及各民族传统吉祥纹样等,是体现民族文化特色与时代审美精神的重要设计载体。\n\n#### （二）服装图案的应用\n\n服装图案的应用,有许多服装类型是采用图案作为主要的装饰方式,图案的应用不仅具有装饰美化功能,还承载着丰富的文化寓意与象征意义,图案设计与服装款式造型、面料材质、色彩搭配的有机结合,共同构成服装整体的视觉美感效果。\n\n**1. 保持均衡**——服装属于三维空间的立体艺术,在服装图案设计中应考虑到服装穿着后立体形态在人体动态活动过程中所呈现的视觉效果,图案配色的比例和位置分布应保持人体各部位形态的均衡与协调,不能一味堆砌,缺乏疏密节奏变化。\n\n**2. 突出个性**——着重于单独图案的运用,可通过重复、渐变等持续手法使图案与服装款式相互协协调,或成为传递设计师个人风格与个性化表达的重要方式,同样也是有着相当自由的运用空间。\n\n**3. 整体性**——印象派画家莫奈(Monet)认为,整体之美是一切艺术之美的存在方式和呈现,细节因素最终应从属统一于整体设计的表达。图案的应用需要与服装的整体廓形、款式、色彩、材质等构成完整协调的视觉体系,而非孤立于整体之外的独立装饰元素。\n\n### 三、服装的色彩\n\n#### （一）色彩基础\n\n研究色彩与实践相结合的艺术学科,服装色彩是一门直接与实践相结合的艺术学科,服装的视觉冲击效果首先呈现的即是色彩,是人的视觉对色彩的特殊感应,通过色彩的传达设计意图与情感表达,是色彩在服装设计中传达设计信息重要的表现形式,色彩即无色彩和无彩色两大类,这些色彩包括色相、纯度、明度三个方面构成色彩体系的基本要素。\n\n**1. 色相**——色相也称色别,色性,指色彩的种类和相貌,是区别各种不同色彩的最主要因素,包括红、橙、黄、绿、青、蓝、紫等基本色相,每一个色相又可分为出更多色相层次,如深红、大红、桃红等;深红等等色相都是有各自独立特色的色名,而色彩相貌也是有着这些丰富色相构成的。\n\n**2. 纯度**——纯度也称彩度、彩色饱和度,主要体现为颜色的鲜艳、纯净或混浊程度,纯度越高则色彩越鲜艳浓烈,反之纯度越低则色彩越接近灰色或浊色,不同纯度的色彩搭配运用可以产生丰富层次的视觉效果。\n\n**3. 明度**——明度也称亮度,是指色彩本身的明暗程度,这种视觉效果由光线的反射率决定,反射率越高则明度越高,如白、浅灰、深灰、黑等一系列的明度色阶变化,是决定色彩层次感的重要因素。\n\n#### （二）色彩的性质与情感功能\n\n服装的色彩设计中最为吸引眼球的,它具有超凡的艺术感染力,美国画家迈耶·夏皮罗(Meyer Schapiro)等色彩学专家的研究表明,色彩能够唤起人类丰富的、超越语言文字的情感联想和心理反应,这种反应往往是集体潜意识层面、跨越文化差异而具有一定普遍性的。\n\n服装设计中恰当运用色彩的心理效果和情感功能,能够更精准地传达服装设计的主题意图与情感氛围,例如红色象征热情活力,蓝色传达沉稳理性,绿色代表自然生机,是设计师表达设计理念、与消费者建立情感共鸣的重要工具。\n\n德国心理学家鲁道夫·霍夫曼(Rofmann)曾经说过:\"色彩作为一种独特的语言,本身就是一种强烈的表现力量。\"这说明色彩具有自身丰富的表达系统,是重要的服装设计要素之一,色彩与服装形式和整体色彩系统的构成中,与形态、纹样等方面同为设计要素同等重要,是设计方案不可或缺的重要成分。\n\n服装设计色彩的研究方面涉及以下角度:\n(1)从物理方面研究关于色彩的规律;\n(2)从心理方面研究关于色彩的情感、感受性;\n(3)从美学方面研究关于色彩的规律、协调、组合规律等。\n\n在设计中,色彩是无数种人的期待所产生的视觉情感,或称之美不可言状,其色彩表达的心理情感是通过视觉与心理的结合,给人以色彩的联想意义,以此传达设计的整体理念。\n\n服装的色彩,通过颜色的搭配,色调的组合,色彩的量感等各方面,体现出服装的整体感和设计意图,服装色彩设计中面对多种色彩要素的选择搭配的规律,把握色调的整体协调统一是极为关键的设计能力。\n\n在色彩中,人的心理有得着相应的对应色彩感受,配置着相应的视觉和心理感受,色调是色彩明暗度的调子,主要包括暖调、冷调、明调、暗调、鲜调、灰调等不同的色调风格类别,不同色调风格能够引发人们不同的视觉与心理感受。\n\n从生理方面上,人眼晶状体的调节,对于色彩的感受是非常敏感和差别的,行动色相有相似的,于是就成为了色彩的行动,当我们的对色彩的感受产生的差异性会随着色彩的感受产生的差异性会随着色调的变化而变化,这就说明了色彩的这种视觉心理效应。\n\n#### （三）配色类型与规律\n\n服装的服饰色彩,应等静色的类别和形式的匹配色彩,服装的色彩注意研究整体服装色彩的构成,即所属艺术色彩,以及在配色的整体规律,常见的配色方法包括:\n\n1. **相近色相配色**——即以相邻色相为主进行搭配,如红橙、黄橙等临近色的配色关系,营造和谐统一、清新柔美的视觉效果。\n2. **对比色相配色**——即以色相环中相对或互补关系的色彩进行搭配,如红绿、黄紫等对比色的配色关系,能够产生强烈鲜明的视觉冲击效果。\n3. **对比与调和,相互关系的色彩以互相关系,以补充相互关系的原理搭配色彩,原理配色是色彩由色相、纯度、明度对比与调和构成的整体协调**。运用色彩纯度、明度对比进行搭配,也能营造出层次丰富、主次分明的设计效果。\n\n现代时装十分重视时代色调,流行色作为体现时代精神面貌的、流行色(Fashion Colour)意即时尚、时代的色彩和特色的色彩,是设计者结合起来的色彩研究,通过对色彩流行趋势的敏锐把握,预知的角度和视线,服装设计的色彩效果都在整个国际的和适合中来入观测规律,通过对色彩流行度的行业内的行家和权威机构预测和研究。\n\n服装配色的原则,常常要考虑以下几点:\n(1)要根据一定的目标和搭配色配色,一般按比例分配色彩比例关系,保证色彩组合达到设计效果的比例平衡。\n(2)要与相配的服装能够体现出的整体效果,要按整体配色效果进行判断,而非追求过多色彩的堆砌,不宜色相过多。\n(3)对比与调和,以色彩的性度色感、相应比配组合的色彩(黑、白、灰),不相互一体的色彩,进行搭配对比与协调,能够产生更加丰富的色彩层次效果。\n\n色彩即是设计的主要构成部分,是最能吸引视觉注意的重要设计元素,它具有超越语言直接触发人心理情感的强大表达力量,是设计师传达设计意图和情感诉求的重要视觉语言工具。\n\n每一种类型的人都有与之相应的36种服适合的颜色,借用色彩,即使是最普通的服装能穿出最优美的效果。总之,用不同的色彩和图案能演绎出人新的活力。\n\n### 四、饰物的种类及其在着装中的意义\n\n#### （一）饰物的概念与种类\n\n饰物,一是指首饰,二指服饰品,首饰,在古代一般通指男女头饰,统称为\"头具\"。之后按民间约俗成的概念,首饰现发展,不但用于头部,还包括耳饰、颈饰、手饰、足饰等,逐渐被广大人体全身饰物品的应用,已经在人类追求美的过程中产生和发展。\n\n首饰是历史上极为古老的人类装饰品之一,是象征人类文明的重要标志,其原材料涵盖金属、玉石、贝壳、皮毛等过精心的制作、烧焊、串接,并涉及打造抛磨等工艺,首饰演变到今天,已成为\"体饰\"的统称,不难成为装饰品的种类和形式扩展,已被广泛认识,人们对饰物的偏爱程度日益增高,不同风格的饰品设计已成为服饰整体设计的重要组成部分。\n\n服饰的装饰性,是通过物质材料构成的形式来表现服装的整体美感,所谓服饰材料的选择规律,反映的是当时的历史文化和社会审美观念,因为饰物本身作为装饰品的历史文化演进过程中,承载着丰富的美的传承与创新意义,配件与装饰艺术密不可分,尤其对于时尚的表达具有重要意义。\n\n**(2)对色的探究**——色彩配置的效果受制于视觉心理反应相应的,不仅要求色相、明度、纯度成为适应色彩的调节了,而且更表达对比运用是超越呈现更好的效果的平衡,能是最,首饰的相对比对调更增添视觉美感和层次的丰富度。同时也要参考自身色彩体系与其相互适配色彩之间的关联性,因为服装配色的合理搭配,决定了首饰色彩与服装色彩相协调的整体美感效果,配件与装饰艺术密不可分,尤其对于时尚的表达具有重要意义。\n\n**(5)色彩不单是色彩与色的搭配运用,增添的整体协调统一美感效果,所谓色彩的搭配与个体来说,所以要充分考虑其成色,珍视理想的色彩品味搭配,服装配色除注重本身的整体配色效果外,还要充分考虑饰物色彩本身及其与整体色彩和谐关系,因为首饰色彩本身及其对服装整体色彩效果构成重要影响,自然界饰物的色彩,尤其在色彩范围内,是设计者行色彩的搭配之核心运用,所谓来自设计者色彩灵感的杰出创造(Carole Jackson)提出的\"色彩季节理论\",通过将人体的自然色彩规律与饰品色彩搭配相结合,建立起色彩美学理论体系,把人体色彩、发型、肤色等因素与四季色彩类型相对应,以此更具科学系统地指导人们进行色彩搭配。\n\n古人把结挂系于身上,成为装饰品,后来演变成襟扣、带扣、腰带等。在服装设计中,纽扣的造型、用料、色彩随流而变化,组扣的合理配置能增强服装的结构之美,从而起到画龙点睛的作用。腰带是服装中的分割线,是构成形式美的手段,系腰带的部位可上下调节,修正人体之比例,增添美感,还具有保护腰部、保暖之功用。\n\n首饰的魅力在于造型、质地、色彩等诸多因素与佩带者的脸型、身材、年龄、职业、环境等的搭配配。随着科技的进步,首饰的材料也大为改观,制作作材料主要有金银、仿金银、珠宝玉石、塑料、皮革、石头、木头以及各种合成材料等,起到锦上添花的作用。\n\n男性首饰多为实用性的,如挂表、皮带扣等,女性首饰种类繁多,多为装饰美化女性形态的,色彩多柔美、稳定,既有浓艳的,也有清新淡雅的,其风格日趋多样化、个性化。\n\n服饰品主要指手帕、纱巾、帽子、靴子、包、领带、墨镜等。装的饰物包括头饰、领结、腰带、胸饰、手饰、腿饰、足饰等。饰物在人们的着装中起到画龙点睛的作用,其意义可使着装者的气质、精神、形象得到增强,使人、服装、饰物三者形成和谐统一的整体美。\n\n#### （二）饰物在着装中的意义\n\n从人类文明史来看,饰物在人类没有穿衣之前就已产生,因此,人类着装与饰物是不可分割的。服装的饰物包括头饰、领结、腰带、胸饰、手饰、腿饰、足饰等。饰物在人们的着装中起到画龙点睛的作用,其意义可使着装者的气质、精神、形象得到增添,使人、服装、饰物三者形成和谐统一的整体美。\n\n历史上对权贵而言,许多首饰造型繁琐,制造工艺精湛,成为标示其身份与权势的象征。大多数人,通过佩戴饰物,表现其生活的经济状况和社会地位,表示人与人之间的关系。而现代社会则更多是标示生活的富裕和对美的追求。在我国少数民族地区,据传说,首饰曾是遥邪驱恶、保平安及光明的象征,后来逐渐演变为贵与美的体现。首饰越多,便越富越美,这种观念几乎成为各民族共同的心理状态和风俗习惯。傣族妇女发髻上鎏银彩花环;阿昌族男女人佩戴小巢真菊花或人造菊花;藏族妇女的盘头发嵌珠珠缀红绿相间的彩色毛线,韬无珠光闪烁,但显得得格外秀美;贵州苗族妇女喜欢在头上插木梳,有月牙、姜角、马蹄等形式,或木质本色,或大红油漆,有的甚至包银、点蓝,有的在梳背上装细弹簧,黄顶有银花、银马,有的在乌黑的梳背上刻画鸟或红绿彩纹,木梳既可用于缠紧头发,又成为一种发饰品;高山族妇女插头木栉,梳背上有一个小人或雕一对相向的蛇形物,别具特色。这些饰物不仅是一种造型的艺术,而且是人类行为的艺术,是人类行为的礼仪化、规范化,是一种普泛化的人类行为和社会生活方式,因而它体现了人类行为方式所具备的文化性和文化意义。\n\n---\n> **课程大纲提示(原书体例)**——课程名称:服装设计美学的范畴与基本特征;课程内容:为生活的性格、服装的美学特点;课程时间:5课时;教学目的:了解服装是人类生活方式的一个重要组成部分,是实用与审美的辩证统一;教学要求:通过服装美学的讲解,分析服装的整体美、动态美、主题美和艺术美的特质。\n---\n"

      "body": "\n俗话说\"佛要金装,人要衣装,三分靠打扮,七分靠衣装\",穿衣戴帽各有所好,证明服装的重要性和穿戴在设计美学的问题,服装设计美学是基本的设计社会的分支学科,是应用美学的一种,应用于服装设计的领域,服装设计学作为一种物质产品,是以物质形态形成的,同时服装美学的研究范围也包括应用物质生产和物质文化领域中的各方面研究内容,包括服装美学本身的分类和特点、消费美学与商业价值、社会心理与文化学、宗教学与社会心理学与文化学等,服装美学的文化价值和时代特征也构成了美学研究的对象。\n\n### 一、为生活的性格\n\n服装设计的美,本质上是超越生存的产物,如果仅仅从服装满足其基本御寒的功能性质角度来说,那些草编、树皮之类的原始蔽体物即已足够,人不再需要更为丰富多样的服装形式,正是因为人们对精神文化生活层面的追求,才使得服装设计以美学层面获得更高层次的发展。\n\n服装是人的第二皮肤,也是人体着装状态下所形成的一种整体的生活方式外化的表达形式,也是人类物质文明与精神文明结合的产物,服装作为人体外在符号系统的表达方式,体现出穿着者的个人生活性格、审美取向与心理状态,是内在自我与外在环境的沟通媒介。\n\n#### （一）服装功能与美的统一\n\n服装——作为特质文化,它必须满足人们日常生活、生产劳动中不同工作场景的具体需求,同时它又必须满足人们对美的期望和追求,是服装的功能性与审美性相互统一,不可分割的整体系统。\n\n服装美的的具体表现形式,包括材料、结构、色彩等各方面共同的美的表达,其所形成的材质的视觉肌理美、款式结构的合理美,色彩的和谐搭配美等,是构成服装整体美感体验的重要因素。\n\n服装的美感是服装的物质、精神因素及外在形式的高度统一,是设计者的审美价值取向、生产工艺水平和穿着者穿着状态相互作用下形成的综合美感体验。\n\n具有健康又愉悦地生活,随着新材料的层出不穷,和谐和美的问题,因为审美价值观念是使着装者的服饰,让人和悦满意的自然美感呈现,由于人的精神因素追求的美感元素,包括人们的服饰审美中提出对美的追求,通过审美方式,对形式感和内容之间的意义呈现,是对个体人体的美的追求的外化过程,是服装设计中重要的美学考量。\n\n### 二、服装的美学特点\n\n#### （一）服装的整体美\n\n服装美的一个特点是整体性,它包括服饰、饰物、物色、材料等以及体型美的结合。一体感统一效果的服装设计,让人整体形象更加协调、和谐,是当有着服装造型协调、色彩搭配、材质搭配和面料配饰服装的完整性,整体美是服装设计追求最基本、最核心的美学要求。\n\n服装作为整体,它并不是从整个整体形式风格来看,是要与人的形体外貌、气质、生活习惯所高度配合,而形成整体和谐美感的表达形式,是超越单纯拼凑堆砌各种流行元素,追求内在协调统一的深层次审美境界。\n\n\"整体性\"是构成服装美感的重要基础,与整体表现的均衡、协调等美感相关,只有服装整体美的效果达成完美的均衡协调关系,才能真正体现出服装设计所追求的审美价值。\n\n#### （二）服装的动态美\n\n服装的美感往往在人体空间运动中所呈现的一种,服装被穿着于人体空间运动中,伴随着人体动态活动的呈现方式,与静态展示效果所不同,是服装美感呈现的重要维度之一。\n\n服装的动态美,主要体现在人体活动状态下,服装随着人体运动而产生的空间形态、体积变化,以及面料在动态中所呈现出的悬垂感、飘逸感等视觉效果,这种动态呈现出的美感,是服装设计过程中需要重点考虑的因素之一。\n\n日本设计师三宅一生(\"一枝之烛\")是众所周知深受体现服装动态美学理念的设计典范之一,他的服装作品充分考虑了穿着者身体运动状态下面料与形态的动态变化效果,分析出人的生活状态和多种运动方式对服装造型和面料选择的直接影响,服装设计正是要通过对这种动态关系的深入理解,创造出既符合静态视觉美感、又能在动态穿着过程中呈现出流动韵律美感的优秀设计作品。\n\n#### （三）服饰的主题美\n\n\"主题美\",是艺术作品中的思想、情感、内容和精神追求的高度凝练与集中体现,同样也是服装设计创作过程中所要传达的核心创意理念的表达。\n\n#### （四）服装的艺术美\n\n主题思想是艺术作品中所贯穿始终的核心内容,是艺术家的选择、格调所具体表达的作品思想情感的凝聚核心,服装的流行与传播,同\"艺术之美\"一样,是可代表性、可被大众所接受的美,以更加自由的20世纪60年代的作品,进一步体现出更加自由和释放不受时代束缚,自由艺术设计的态度,作者在设计上突破传统装束限制(Andre Courreges)想造式样\",主义风格,在70年代设计上于1974年前设计了\"松弛式样\"(Francois Lesage)的时尚廓造,安德罗宾(Ande Robbie)设计的\"松造式样\",以及松散、色彩层次、色调等设计手法上都体现出创意作者独特的艺术观念的追求与彰显(Armani)。装饰、体现出,西方一系列时装设计的代表作品都体现出创意独特的艺术风格追求。20世纪90年代后,国际上以卓越的艺术风格和创造性著称的一批服装设计大师如国际组织为主题,深受时装作品的推动感,从传统束缚中获得解放,追求自由个性表达的艺术观念广泛体现。\n\n对现代主义美的追求,亦为传统美学范畴中重要的一环,今人为对创新美的意义和创造上,与时代脉搏相符的一种作为审美观念的更迭和创造性理解和反映。\n\n如中式服装的旗袍不断传承和被时代所时代赋予不同的内容和形式,不断随着时代审美观念的更迭发展,这一点,当服装作为表达主题的一种作品的表达时,常常传达出与其所在的历史时代精神、社会思潮息息相关的深层内涵。\n\n#### （五）材料与技艺的美\n\n服装材料类型繁多,根据用途可分为面料、里料、辅料、材料等,服装材料是构成服装设计的基本要素之一,是变换和实施美感,实际上是与材料密切相关,体现和使用材料的美感,涉及面料的质感、纹理、光泽、垂坠感等物理属性的美感表达。\n\n服装的要求美,可以说是从工艺角度反映一个作品有的、能审美价值的重要因素,一体的整体美感的重要因素表现,是需要以美感为标准。\n\n人对服装材料的感受是综合性的,由视觉、触觉等等生理感官所构成的审美感知,反映着人们对物质材料的感受能力和相应的材料审美情趣。人们对物质材料的审美情趣,反映着人们对物质材料的审美感受性与相应的材料审美情趣,人的这种感官层次感受包括:视觉、触觉、嗅觉,是极为重要的审美感知渠道,是构成美感认知不可或缺的组成部分。\n\n如惯服设计有成或造服,原重视观感服装的审美空间关系,在造过型,服装受到面部造型语言的传达与呈现,材料的选择、造型手法、色彩效果,是设计成完整整体审美的重要因素,不同视觉审美价值追求所会带来更好特有的表达效果。\n\n人们对时装工艺美的追求是复杂而多样的表达,一方面是产品外化服务和呈现审美感受性,另一方面是要以工艺美追求内在深层美感表达,以体现设计意图和穿着舒适、结构合理的整体统一美感。\n\n服装的工艺美主要体现在剪裁、缝制、整烫等各个制作环节的精细程度与技术水平,精湛的工艺技术能够将设计构思准确完美地转化为实体成品,是设计理念得以完整呈现的重要保障。\n\n服装是以工艺形式的完整,体现服装的技术美感,材料越考究、工艺越精湛,越能体现出服装制作的高标准要求,如高档时装的精致做工,细腻工艺往往通过手工缝制、镶嵌、刺绣等传统技艺呈现,是服装工艺美感的极致体现。\n\n历经岁月洗礼、然后传承,并不停留在低层次的表达,还需要不断突破创新,追求更完善精良的技艺呈现,不断精进的工艺技艺是服装设计得以最终完美实现的必要条件与技术支撑。\n\n以在设计上,现代服装设计中的材料的运用,更多的人体活动的方式契合于人体的力和情感,不仅仅只考虑材料本身的物理属性,更需要以人体的舒适度和实际穿着体验作为考量核心,充分考虑材料与人体运动之间的协调关系。\n\n(1)在设计服装时,除了考虑人体外在形态的适应之外,还应当尽量选取那些贴近人体、便于人体运动、穿着舒适的材料,不仅要注意材料外观装饰效果,更要重视材料本身穿着的舒适性和功能性表现,让服装真正做到美观与实用的统一。\n\n利用圈线设计的高低来改变臀部和腰部的长短效果,利用褶子、褶子的长短、肥瘦来改变腿部的线条,利用上装和下装的长短来改变上下身的比例等。\n\n(2)服装板型是以平面形式表现三维立体形态的服装结构工艺,它的技术性主要体现在服装结构的构成形式,材料性能的正确利用和服装与人体之间空间的合理立配化上等方面。服装裁剪时须以度量的尺寸为依据,线条、角度、弧度之间的量值均需用数字表达出立体的人体形态和设计师的美学要求,将服装的前身、后身、袖、以等等按服装设计的款型裁剪出来,再进行缝制,各裁片需经过镶拉、加衬、归拔、熨烫定型或缝合形,在制作过程中应边做边尝试,使服装达到挺括平整的工艺效果。\n\n(3)精确地裁剪、精美地缝制,是服装创意完美化的保障。在加工技艺中,要根据服装的造型、面辅料和结构设计确定加工工艺和材料,就缝合而言,可以形成风格各异的缝合线的强度,这是服装整体造型和款式风格的重要组成部分,如平面与立体、见线迹与不见线迹……它们之间的巧妙组合,拓宽了服装美的表现手段。设计与工艺的有机结合,使技艺与质量同步提升。\n\n(4)褶裥是产生结构线的造型方法。有料的折叠缝制,能产生立体感,是服装细部装饰的工艺形式之一。褶裥的造型手法多种多样,有斐波那(包括顺褶、对褶和压褶)、堆和褶、抽褶、波浪褶等形式,还有细皱褶和自然褶等。利用织物的悬垂性及丝纱纹理,既能实现造型上的功能,又能给服装的变化带来无穷的趣味。褶裥的造型原则,需要在长期的创造中不断探索、不断积累经验,丰富自己的创造内涵。\n\n随着计算机技术的不断发展及艺术设计人员的参与,计算机已成为当今服装设计领域的重要组成部分。服装行业的设计与生产已进入自动化、高效率的时代,不仅量身测代用光电设备,设计和制作用计算机和现代化机械来完成。工业化生产的需求促进了服装CAD这一高科技产业的发展。20世纪90年代,服装以CAD/CAM技术的普及,加快了服装工业的现代化进程。美国率先制订了\"无人缝纫2000年计划\",以最大限度提高服装设计制造的效率,改善产品的品质;日本也开发出三维立体缝纫系统,达到了服装量身定做的单件生产水平;欧洲国家不仅完成了服装自动化生产中各单元技术的开发,而且有机地将各单元技术集成起来,实现服装计算机集成制造。在服装设计中采用先进的信息技术、计算机技术,可以虚拟服装设计,包括服装款式设计(FDS)、服装纸样设计(PDS)、纸样缩放(Grading)、排料(Marking)等;甚至可以先销售,后制造,只有这样,才能满足知识经济时代服装产品的多品种、短周期、高品质、高附加值和快速高效,同时更突出产品个性化的需要。这些革命性的发展将会使服装的工艺技术更加精致完美。\n\n---\n> **课程大纲提示(原书体例)**——课程名称:时装的流行与品牌营销;课程内容:时装流行的心理机制、时装的特征、流行与传播、服装品牌与市场营销;课程时间:7课时(含放时装影像2课时);教学目的:了解时装流行的成因以及时装的周期性和时效性等特点,熟悉时装流行预测与传播方式,了解服装品牌的特点与营销策略;教学要求:结合市场调查,分析时装的流行趋势与传播方式,了解服装品牌的营销模式。\n---\n"

      "body": "\n### 一、时装流行的心理机制\n\n\"流行\"是一种客观的社会现象,它反映了人们日常生活中某一时期内的价值取向、一致的追随和爱好,流行所涉及的事物是相当广泛的,人的服饰是最常见的关于时装流行意义的重要方面。\n\n流行心理及不能相当广泛的,包括社会心理学家(如Jean Gabriel Tarde)的《模仿律》一书中认为一个时代方式一时代流行的、时代兴衰起或情境交叠而生的一种流行意义之现象,流行现象与它的社会心理背景密切相关,是社会集体心理与个体心理之间相互作用的产物。\n\n流行可分为四种主要因素:\n(1)权威的因素;\n(2)新奇的因素;\n(3)实用的因素;\n(4)美的因素。\n\n人们在着装方面首先要肯定不美与否的第一因素,以及在此基础上产生的求异求同心理,这些心理相互交织促使流行意识的多样化,时装流行的意识,即是求新意识、心理定式、传统的定势之间的张力,根据不同的社会需求变换,服饰服装形成一种反复循环的规律,复合大众各种社会心理的表现。\n\n流行的概念是一种社会流行的现象,由许多相似或相互接近的心理及行为方式所构成的一种非常态的短暂的社会现象,流行心理的因素相互作用,推动流行意识的产生和演变,构成了美学变化中的重要变量。\n\n### 二、时装的特征\n\n#### （一）时效性\n\n时装的流行都有一定的时空效应,时间与空间是时装流行时的最重要属性之一,时装是最重要时间性的产物,同时它更是空间性的产物,这体现在几十年来展示的时装中可见一斑。\n\n同质性的原料和新款式的完美工艺手法,发出时尚的个性魅力。\n\n#### （二）周期性\n\n时装由流行到衰落的过程构成了流行周期,循环往复,任何时装都要经历兴盛的基本规律,服装的流行有其自身的规律,总体的发展规律,一般分为三个主要阶段:\n\n(1)上升期:或称导入期,这一时期出现的一种新款的初期,可能受到消费者的强烈欢迎,可能受到一部分市场群体的追捧,但它却引人注目,它一定会成为一种流行的形式,如何形成人们视觉更新的追求。\n\n(2)高峰期:流行普及化阶段,进入到消费的多数人群,由较少数人被受为流行的开创者,追随到全民。\n\n(3)下降期:或称衰退期,时装流行的对象逐渐减弱扩散的程度,本周期的流行已经逐渐过时,趋向消退。\n\n时装的周期循环不同时间区别在于它的变化内容与形式不同,同时时间区间,同时时间区间,时间越是快、内容变化越大不断更新,即成为快时尚(Fast Fashion)现象。\n\n#### （三）标新立异的观赏性\n\n在服装流行中,可以说是丰富多样时代精神的不断成就,人类装扮所具有的服装追求各方面都有服装意义,也正是因为其变化多端的人类文化的进步性,不断创造更新的心理需要,不断被人类进步性中所汲取着。\n\n服装流行是艺术设计中一部分设计意识时装的精神,人类装扮所应有对新装扮的服装追求方面都有服装意义,也正是因为服装本身求新求异的意义,人类文明思想开放和意识形态的多元化,才使得服装流行现象得以持续存在和演化发展。\n\n一个时代的政治、经济、文化决定了这个时代的人们的审美标准。现代科学技术以创新性服装快速发展的一致,各种消费者审美心理特征以此使服装流行者更具有多样性,而政治、经济、社会等各方面因素时对流行的影响方式,服装设计师们应在了解人类审美心理的基础上,能够时时应地把握流行趋势变化,反应到实际服装设计中。\n\n### 三、流行与传播\n\n文化学理论认为,文化传播即文化的互动行为和交流行为,是社会群体以及人与人间的文化流通关系,从人类文化学的角度来阐述流行,文化总是能够引导服装流行的进步之历史,没有文化流播就没有流行发展的历史,人类的任何一种文化都是含有传播因素的,服装的流行行也概莫不能例外,各文化群体之间由于其相互沟通、交融,都为形成了服装流行的地区之间的流播扩散,是现代化的普遍趋势必不可忽略的重要动力,市场经济发展的普及与商业需求所创造了一种服装流行传播和形式方式。\n\n#### （一）流行的传播方式\n\n**1. 纵向流行传播**——历史上一个时装本来就是从历史发展起来的,皇家的服装是上层社会盛装的表征,是服装等级的标志,享受着最完整最高档服务的服务,受着一定的贵族流行时装,更多是限制的严格严格性和历史流传性使用,鲜明的历史一直影响到当今的西方国家的历史,主宰着的《风俗》箴言之\"衣冠者,构衣之标识,而资服识别,自身之尊卑,自食其力得,不月而离入下,不受制约的自己的传统。\n\n那些资于严肃的社会,皇族权贵不留时,服装总是流传的的服务的人所服务的,一般大众是横向流播于上层的资,是走在人前的一般模仿,那些流行影响社会公开发展的不断流步演进,这种现象,提炼层学家称为\"向下流流类型\"。\n\n当一个时代一时代纵向自的时间地流传性时,并宗:\n\n那时期几乎不可分别社会,王族权贵不留时,服装是永远都远流的居于上层的时,是走在人们的一般模仿,而服装的社会公开的地步会所进的不断进步演进,这种现象,提炼层学家称为\"向下流流传\"。\n\n**2. 横向流行传播**——进入20世纪以后当上层的传统被逐渐,同样其社会公众、面貌、能观等等有着多种不同的社会群体不再是一层一等社会等式,而是一群一群不同层次社会文化交叉流传的横向渐渐化,横向流传的服装文化更为丰富多元层次,不再是简单模仿。\n\n经比较流行传播的社会认识,20世纪60年代以后传统横向流行传播模式已经上升成为服装流行的主要方式之一,当西方成为服装的个性化和多样化的流行趋势。\n\n#### （二）时装的流行预测\n\n时装本质上是多变的,远远走在不断的运动之中,归结于流行形式变化及趋势预测则可以提前一定的市场,这种预测有服装流行需要相应可通过。\n\n对服装流行的规律,归纳与研究,反对流行的时装趋势预测,来提前把握供应流行发展趋向,主要预测方式方法,大众流行传播方式,主要基础出大众流行的方向和趋势,还需综合分析历史流行的走向,总结出流行规律,预测方式,大众流行传播方式,主要基础出大众流行的方向和趋势,还需综合分析历史流行的走向,总结出流行规律。\n\n未来社会的国际相关时装企业的服装流行预测,着重时装社会流行的方式,也依据服装的流行趋势和市场服务导向,提出相应流行的时装设计意见,从而做出相应流行的实际市场服务方式。\n\n时装流行预测的意义,它有效为一项理智性的服装行业活动,通过对具有科学性的服装流行预测,大量为服装设计师、生产企业及市场提供参考依据,主要方式方法有以下几种:\n\n(1)综合分析国际、国内的服装流行趋势,归纳出相应的规律和特点;\n(2)分析历年和相应服装流行的因素,根据服务(即市场分析)、模仿的不同变化的流行发展趋势,进行综合分析。\n(3)专家意见分析法,综合国内外服装设计师和面料研发公司的意见分析,得出对服装设计趋势判断有较高准确参考价值的服装流行趋向预测结论,总之,即根据不断更迭发展的社会心理与文化审美变迁趋势,做出对流行方向具有前瞻性的科学预判。\n\n响服装流行的各种因素加以综合性的考察,才能对服装的流行趋势做出准确的反应。\n\n### 四、服装品牌与市场营销\n\n#### （一）服装品牌\n\n服装品牌指服装产业自主的品牌,包括服装的牌子、商号和商标,用以与竞争对手的产品或服务相区别。服装资产至少包括品牌知名度、品牌认知度、品牌忠诚度、品牌联想及品牌权益五个方面要素。对服装工业而言,消费者、产品、营销、传播体系与企业形象共同形成品牌的基本构架。\n\n品牌是竞争中设计力量的象征符号和精神表达,也是走向社会的设计标志的具体化呈现,包括一个服装行业、一个服装设计机构或一个服装设计中的自身品牌。凡观念先进、思考敏锐的服装行业或或专业的品牌机构和设计师,都会十分注重自有品牌的塑造,并从中发掘潜在的价值。品牌作为竞争与消费的产物,一开始就要具备浓郁的文化色彩,不再是单一的文化性价值定型出来,已经是设计文化的直接折射。\n\n服装品牌就是体现设计文化的最具魅力的亮点之一,这就对设计师提出了更多的要求,如:设计师应具备创造性思维,要将世界前沿的时尚元素以及传统的文化积淀作为资源,并予以整合;要认真思考中国本质、领悟设计的深层文化内涵,充分展示设计的原创性、包容性、前瞻性;要以设计角色演绎、丰富和拓展设计文化,以增强设计的竞争力和影响力,适应多元文化的持续发展,以此创造更高的附加值。\n\n因此,设计品牌就是对设计价值、资源、角色的一种独特的诠释。\n\n#### （二）服装品牌的营销策略\n\n服装品牌的营销包括市场调研、竞争策略、品牌的市场定位、服装品牌目标市场的营销策略与营销策略等内容。品牌体验与服务设计等内容。品牌之前必须要了解人们的喜好,不同人的品位、气质、修养各不相同,年龄、职业、形体、肤色也为设计师提供了更多元素,具有了解目标人群、逐一分析他们的特点,把握服装品牌本身的市场定位,并配合服装的目标客户群人们的生活方式和生存状态,也更要人们需要。品牌营销的策略很多,世界上优秀的品牌都有自己创立的品牌理念和独特的营销方式。\n\n例如,无印良品(MUJI),颐名思义,就是没有品牌标志的好产品。它代表的是不时尚,不是流行,而是一种去繁从简、素而不俗的生活理念、生活哲学,是禅宗美学的日常化与普及化。在产品设计上,无印良品还参考禅宗美学,去繁从简,纯粹用商品质量本身来吸引顾客,不要商标,不要图案,不要装饰,还提倡以来自制作,以接近天然的状态出售,很显然这是一种传统日本文化与对现代生活的理解相结合的产物,并非成为了自己独特的品牌经营模式。\n\n市场营销学与消费心理学是一名成功的设计师首先应具有的知识要点,并能根据企业的品牌定位提高自己的目标风格和特色。面对市场竞争中的一个真实的企业或某一个命题设计,设计师必须要会激活设计思维,把握策略定位,提炼最佳创意。设计思维应将策略的设计(从受众需要什么、想听什么去出发)与设计的策略(我们应该干什么、说什么和怎么说)两者融合。品牌的苦心经营和积累是企业于对品牌理念的坚守,英国学者麦克·阿里斯(Michael Aris)说:\"培养所需的消费者,最好的方式就是培养一种消费文化。\"反过来说也同样意味深长。\n\n在这个过程中,设计师与消费者相互依存、相互培植、共同成长。设计水平越高,设计发展越快,在这个交互共生的过程中,产生的能量和影响就越大,就更有利于凸显出设计的先导性特征,而品牌的建构也必然依赖于消费大众。\n\n---\n> **课程大纲提示(原书体例)**——课程名称:服装设计教育的研究与未来;课程内容:服装设计教育、服装历史研究、服装理论研究、服装设计师的位置与素养;课程时间:4课时;教学目的:了解服装设计教育的现状、服装设计的历史研究内容和方法,熟悉作为一名服装设计师应该具备的基本素养;教学要求:从服装教育的角度出发,分析服装设计的技术性、艺术性和商业性三方面的特点,结合服装设计师应具备的素养展开讨论。\n---\n"

      "body": "\n### 一、服装设计教育\n\n设计教育是一个巨大的系统工程,它不仅是一个培养和实践的创造过程,更是造就一个设计观念的建立和创造能力的培养过程。随着现代化科学技术的发展,设计教育一方面要适应发展的情况迅速调整变革以适应当代的变化,培养出综合型人才;另一方面则要发展我校本着培养人才的理念,更要重视人才不断的突破,服装设计教育同样如此。\n\n#### （一）国外服装设计教育的启示\n\n在西方,发达国家的服装教育已经有一百多年的历史,有一些成熟的办学经验,因此成为服装设计行业培育的沃土,日本的服装设计也自成体系,大量的、大学、专科,与西方国际相似的高等技艺水平教育,也就走出了很多优秀的人才,同类似完善的设置管理,结合人才多样化培养的需求,为服装培养向社会输送人才,是当今世界主要国家都非常重视的教育课题之一,受到国内业行进一步的开发,拓宽了服装企业的发展空间,同时也促进了服装教育的进一步发展。\n\n我理研究的方向,已经服装社会学中\"和图美\"并实践在能够体现\"服装造型学科\"和\"服装文化学科\"合在服装历史学的基础上,在服装科学下三个分支。\n\n我日本文化服装学院也有意建立,有的意在培养设计师方面的复合型人才,有的走向工程学科技术方面的深层研究,也有的走向工程学科方面研究学者。\n\n#### （二）国内服装设计教育的现状\n\n国内的服装行业起步较晚,建立了改革开放以来,我国的服装业以20世纪80年代开始才起动加快步伐的,与西方国际大约有百年的发展历史相比,起步比较晚,但发展迅速,目前我国已有数百家高等院校,开设了服装相关专业,形成较为完整的服装教育学科体系。\n\n国土上大学的开设开学,有研究生教育,有本科教育,有专科(高职)教育,一系列多层次教育办学体系已初步建立起来,但整体教学质量与国际先进水平相比,仍有较大提升空间。\n\n从服装行业的发展趋势来看,服装产业已从劳动密集型逐步向知识密集型、创意密集型转变,培养复合应用型人才成为服装设计教育的重要使命,涵盖服装设计、服装工程、服装生产管理与经营等多元化专业方向,已成为服装教育发展的重要趋势。\n\n我国服装设计教育应立足国际经验、结合本土国情,秉持科学发展观,推动传统技艺传承与现代教育理念相结合,面向未来培养具备国际视野、创新能力和文化传承意识的高素质服装设计人才,这是当今服装教育改革发展的重要方向。\n\n今天,我们已进入一个特别的时代精神建设的时代,科学技术的迅速发展,使得艺术的形式和艺术手段发生了巨大的变化,已经把从传统单一的以设计者作为设计中心的模式,打破成了以数字化艺术设计为中心的模式,WTO和网络的信息带来的的多元化的形态,人类历史进入到一个多元化、多层次的时代,这对服装设计教育提出了新的挑战和要求,现代教育方式的一切设计学界已开始考虑到,毕竟服装设计教育不仅仅是学院内的高等教育,同时也开始涌现出更多的社会性教育,一部分职业化的培训、企业委托培养,以及网络时代教育等多种方式,已成为一门新的、也涵盖着的行业教育。\n\n创造未来的服装设计教育者的核心内核,服装的技艺性也需要有更多的能力和创造力,那些以及现代的服务思想的形态,着眼于服装教育在具体教学的过程和框架体系,更符合于各类学者的产业教育,应更为综合性和实践性,反映当代的学生对知识和技术操作的迫切需要,并为学生未来的服装设计从业提供更加系统扎实的知识基础。\n\n### 二、服装历史研究\n\n服装史研究,首先一门历史性的具体考察服装\n\n发展状况与变迁规律的历史学科,是服装科学体系中不可缺少的一个分支。因为服装是过程性连续的、不间断的,与服装形态生产人类服装文化史的变迁过程,具有密切不可分割的关系,而对服装史的研究揭示了服装发展与文化演变各阶段各具体形态发展的规律联系。\n\n#### （一）服装史的研究任务\n\n历史学的研究方法,以现实为过去而追问因果,通过应用相关文化和社会理论,揭示论证过往时期服装形态发展、社会时代背景、经济与社会条件、政治文化背景等诸方面因素相互作用的规律和内在关系,分析形成或影响历代服装形态的多种社会因素,揭示服装形态演化背后所折射映射出的社会文化观念变迁,以此更深入探讨归纳服装历史发展规律及趋势的科学方法。\n\n我们研究服装历史发展的过程中要充分考量:①服装各历史时期的社会历史背景、宗教信仰及审美观念等因素;②服装历史发展中各国各民族相互交流融合的关系,包括风格样式、面料工艺等的相互影响和借鉴,考察服装历史发展中出现的重要转折时期及其成因,归纳分析出服装历史演变的一般性规律,从而更好地服务于当代服装设计的创作实践与理论研究工作。\n\n#### （二）服装史的分类研究\n\n服装史的研究可以从服装设计、服装工艺、服装社会经济学等多角度切入展开研究,如1940年至1941年,美国发明了合成纤维,这种全新的材料改变了传统服装史发展的进程与轨迹;20世纪60年代第二次世界大战的爆发,又极大改变了人们的着装观念与服装形态发展方向,历史事件与社会变迁的相互作用,构成了理解服装历史演进不可或缺的多维视角。\n\n我校服装科学系,培养服装人体与人体科学的相关服装分支学科,与服装历史学、服装设计学、服装工艺学等分支学科相互交叉融合,共同构成了服装科学体系完整的学科架构。\n\n#### （三）文化艺术性\n\n服装既是作为日常生活重要组成部分与生活方式高度相关,又是超越日常实用范畴之外具有深刻精神文化内涵表达价值的形式载体,与社会文化艺术生态密不可分,研究服装形态文化与艺术性的相互关系,探讨服装作为一种文化艺术媒介所承载的时代精神、审美观念与人文关怀,是服装历史与理论研究的重要课题。\n\n服装因作为文化生活紧密联系于个体与整体、社会集体意识形态,而作为社会文化生态的组成部分,服装设计的这种双重属性——既是实用性的物质产品,又是承载文化艺术意义的精神产品——决定了服装设计既要满足实用功能需求,又要承担传承创新文化艺术的使命,这种社会存在与个人存在相统一的双重属性,进一步说明了服装作为一门交叉学科所具备的丰富内涵。\n\n### 三、服装理论研究\n\n服装理论研究属于关于服装研究的理论,而以服装科学中不同专门时期18世纪即得工业革命至今2个世纪的工业变革与服装文化发展,是科学技术文化艺术设计的门类研究。\n\n#### （一）科学技术性\n\n服装科学在服装形态发展历史进程中已具产生了广泛而深刻的作用,主要体现在13世纪起,历史初起始探讨了直到服装结构在内的相互全面的关系,又不断发展的整个19世纪服装科学被应用于服装设计的探索开始,包括对当年欧洲宫廷时装设计经典的深刻影响,如1589年、西班牙宫廷制版师提出的着名西班牙式紧身胸衣(Cagnard de Mouy)版式,还有法国宫廷时装设计师最早提出的紧身胸衣结构裁剪的理论探索。\n\n同一时期,英国发明家詹姆斯·瓦特(James Watt)发明蒸汽机所带来的工业革命浪潮,推动了纺织科技的重大变革,并进一步为服装科学研究的深化拓展了广阔空间和实践基础。\n\n#### （二）艺术性\n\n服装的艺术性研究,是服装科学中探讨服装设计构思、形式表达与审美价值创造相互关系的重要理论维度,通过对服装形态美学规律的研究,揭示服装设计中艺术创造与科学技术相互支撑、相辅相成的内在逻辑关系。\n\n#### （三）商业流通性\n\n服装是作为商品在市场中流通的属性,信息物质经济密切结合的产品属性,即涉及服装的市场调研、成本核算、生产管理、品牌营销等一系列商业运营环节,是服装理论研究中不可回避的重要维度之一。\n\n服装基础的商业性研究,应从产业链的整体角度出发,系统探讨服装从设计构思到生产制造、市场流通、消费者反馈全过程各环节的规律与联系,以此建立起服装理论体系与产业实践相互印证、相互促进的良性循环机制。\n\n### 四、服装设计师的位置与素养\n\n服装设计师是一个既要有对创意的艺术追求,又要考虑代表消费者需求和市场规律的职业,他们既是艺术家,又是产业链中的重要一环。服装设计师的位置和素养,直接关系到设计成果能否真正转化为符合市场需求、具有商业价值的产品。\n\n服装设计师从业需要具备的专业素养包括:扎实的专业理论知识基础、敏锐的审美判断力与创造力、良好的手绘与计算机辅助设计(CAD)技能、深入的市场洞察力与商业意识、优秀的沟通协调能力与团队合作精神等多方面综合素质。\n\n随着科学技术的发展,服装设计的表现手段和创作方式也在不断革新,设计师需要不断学习掌握新技术、新工具,以适应行业发展变化的需求,同时也要坚守对设计本质的深刻理解与不懈追求,在传统技艺传承与现代科技应用之间找到平衡,这是当代服装设计师职业素养构建的重要方面。\n\n---\n> **课程大纲提示(原书体例)**——课程名称:世界著名服装设计师;课程内容:查尔斯·弗雷德里克·沃斯(Charles Frederick Worth)、加布里埃·夏奈尔(Gabrielle Chanel)、克里斯汀·迪奥(Christian Dior)、克里斯特巴尔·巴伦夏加(Cristobal Balenciaga)、皮尔·卡丹(Pierre Cardin)、瓦伦蒂诺·格拉瓦尼(Valentino Garavani)、伊夫·圣·洛朗(Yves Saint Laurent)、三宅一生(Issey Miyake)、让-保罗·戈尔捷(Jean Paul Gaultier)、克里斯汀·拉克鲁瓦(Christian Lacroix)、维维安·韦斯特伍德(Vivienne Westwood)、约翰·加利亚诺(John Galliano)、詹弗兰科·费雷(Gianfranco Ferre);课程时间:4课时;教学目的:了解现代服装设计大师的经典风格,以便对服装设计有更深层次的认识和领悟,为后续的专业设计课程提供有益的参照;教学要求:针对世界著名服装设计大师不同时期的作品,分析其设计思想、发展历程、创作风格以及在历史上产生的重要影响。\n---\n"
    },

      "body": "\n20世纪以来,服装所表现出的最显著的特征就是服装成为流行生活的重要组成部分,成为人们日常生活时尚中最有代表性和最重要的部分。法国服装工业曾通盘垄断主宰时代(\"Alan Shul Fay\"有句名言:\"法国服装之所以具有世界性,不是因为它体现了法兰西文化,是因为它裁剪了世界文化,我们的传统是自由。\")正因为如此,法国的巴黎成为为今世界瞩目的时装中心,连拿先后成了一大批著名的时装设计大师,他们的时装创作之路各不相同发展的天才成就,而且代表着难一无二的风格,他们创造的美是最迷人的,值得我们认真地研究。以有深入学习20世纪服装的发展历史,才能理解那个时代大师们的设计风格和艺术表现,从而借鉴到自己的服装设计当中。\n\n### 一、查尔斯·弗雷德里克·沃斯 (Charles Frederick Worth)\n\n有人说法国过往贵族最流行的美,他世代所称的服装设计师中占有着丝毫特权,被誉为\"高级时装\"策始祖的这位法国的第一位主持人是Auponir。他生前于1858年首英国伦敦,来到法国巴黎从事这一职业,后成为拿破仑三世的皇后欧仁妮的宠幸的皇后指定服装设计师(1825-1895),他的一开创制作规模了西方\"高级时装\"新时代产业化的经典模式,他的重要作品成就了西方高级服装设计史上第一位真正意义上的时装设计师。\n\n18世纪年30年间沃斯所主导的时装制作了\"高级时装\",设计打样师上都身份地位很崇高时代,在这一时期,主要是设计在服装行业的一种代理,当时的服装是量身定制手工的服装,是集体的作品,该设计师所要求出主导个人服装工艺主导性来完成的独一无二的作品,亦即是所被称的时装标签的产物出来,他不代表一定风格的传统主流学。\n\n沃斯的服装在巴黎产业广泛影响,受到当代法国宫廷贵族的追捧一直是法国工艺文化(Empire)的经典,当时也是他给予人的皇家优雅服饰认为,穿着他所设计出的礼服,让人在社交场合展现出高贵的仪态,提升个人形象与社会地位,足以成为于当代女装设计元时的\"巴黎时装业设计中心\"的开创了1868年他创会创立高级时装行业的官方组织,建立了1868年是巴黎时装业设立会员制度的开始,奠定了法国高级时装工业化生产的最重要基石之一,他被誉为\"高级时装之父\",是有效将服装设计这一个专业化的女装设计学正式引以确立了行业设计者的社会认同,他不再是个体裁缝而是设计师的荣耀地位。\n\n### 二、加布里埃·夏奈尔 (Gabrielle Chanel)\n\n夏奈尔(1883-1971年)出生在法国农村,早在第一次世界大战期间,她在杜维尔(Deauville)开设了一家女装商店时,她的服装的手法引起了法国上流社会的追捧,由此她逐渐开始了她辉煌传奇的时尚生涯。1920年在巴黎上流社会享有盛誉的地位,以为她的设计经她精心打理出的意大利式装扮\"穿着法国式装扮女装的意识\",获地位以打开了她时装作品经典成功的先河。\n\n设计一家工厂生产。她所设计的女装为她说是超越,而不如说是更年轻的连生活。她表现的服装为脱离繁复的装饰,当然而不再是让传统那种沉重的束缚,而是自由的、自然的、追求自由内敛,重返女性外在自然的解放。她是首位从女性穿着行为解放着重女性身心的解放的女性设计师,提出了一系列突破性别陈规的经典设计理念。\n\n设计的两大成就都不可磨灭,更充分呈现了如今女装的一个流行至今仍受人喜爱的经典设计——\"巴黎风格\"、\"香奈儿风格\"以及享誉世界的\"小黑裙\"、\"香奈儿套装\",她所主导的经典设计如今仍代表着法国高级时装、优雅精致美学的核心典范传统之一。\n\n### 三、克里斯汀·迪奥 (Christian Dior)\n\n被誉为20世纪最伟大的女装设计师之一的迪奥(1905-1957年),出生于法国诺曼底,33岁时才正式设计出道,与克里斯汀·拉克鲁瓦等设计师一样,直到成名前从事其他行业积累经验,1946年他获得财力上大力资助后开创自己的服装事业,当年由巴黎商会赞助他推出了以复古\"新风貌\"(New Look)命名的经典系列作品,1947年获巨大成功,这一经典设计系列彻底改变了当时二战后女性的着装观念与审美趋向,标志着服装从战后紧缩单调风格重新回归到女性化优雅曲线的历史性转折,是二战后服装史上具有里程碑意义的经典设计事件之一。\n\n迪奥的设计以复古主义为设计基调,大量运用巴黎传统高级时装工艺技巧,善用夸张的收腰、蓬裙等经典元素,塑造出极具女性化曲线美感的经典造型风格,他的设计不仅深刻影响了当时的国际时装潮流走向,也奠定了后世众多年轻设计师(包括伊夫·圣洛朗等传人)接续发展迪奥品牌的设计基础与美学传统。\n\n服装是以人体为基准的立体物,是以人体为基准的空间构造三三服装制的服装造型,是具有时装类型三主要的品位与要素质的基本元素,这些经典最重要设计师们通过独特的探索,是我们服装设计学习历史中不可或缺的重要参考坐标。\n\n### 四、克里斯特巴尔·巴伦夏加 (Cristobal Balenciaga)\n\n巴伦夏加(1895-1972年),出生于西班牙,是同期著名设计大师中最早开始从事时装设计的人,1937年他的巴黎时装屋(即他的第一间高级时装屋)正式建立,1957年推出的支撑式或不规则式的裙型——这被认为是当今一波经典设计力量最主要的一次革新性的创新理念——巴伦夏加,是一名将服装设计视为雕塑艺术的设计大师,他极为擅长用极致简洁的手法处理面料立体裁剪造型,是他对形态与比例之间的关系有极高的敏感把握力和创造探索的美学能力。\n\n他非常注重人体与服装之间能否保证设计的真实性,他这种个体的空间美学在体现设计中的应用与探索,曾使美国当代权威时尚媒体评价他为\"服装设计界的建筑师\"。他极为独立自主的个人风格与美学理念,使他被誉为\"设计师中的设计师\",影响了后世无数当代设计大师的美学创作理念,是最受同代及后世设计师尊崇景仰的设计大师之一。\n\n### 五、皮尔·卡丹 (Pierre Cardin)\n\n1922年,皮尔·卡丹生于意大利威尼斯附近,他14岁开始学习裁剪,1939年,皮尔·卡丹到巴黎发展,后担任帕昆(Paquin)、斯基亚帕雷利(Schiaparelli)等服装屋工作,1946年,他成随即建立起自己的服装屋,在此期间设计出许多富有明快时代感的作品。\n\n1959年,皮尔·卡丹加入了自己成衣设计,主要设计以戏剧服装、简洁具有独特设计感与几何造型元素的女装、时装及舞台服饰为主,在20世纪60年代日益丰富,并将成衣事业开展至全世界市场。\n\n皮尔·卡丹可以使用剪刀,而是用各种奇思异想的布料裁制服装,被誉为\"服装界的鬼才\",最擅长将传统的设计间作巧妙打破,几何图形和抽象概念结合,建构成极具未来感和创新意识的太空造型式样,他极为擅长以服饰造型与几何几何图形结合,先锋前卫探索出的服装式样,富有强烈超前的时代感与创造精神。\n\n皮尔·卡丹极为经营多元化商业运作模式而闻名,通过大规模授权经营的方式将其品牌形象扩展应用到极为广泛庞大的商业领域,其授权品牌产品甚至涉足服装以外的众多相关消费品领域,几乎运用到所有可以想到的方方面面上,是世界上第一位将高级时装商业化、全球授权化经营运作的先驱设计师,巴伦夏加评价他为\"93个国家共有超过500项专利\"。\n\n### 六、瓦伦蒂诺·格拉瓦尼 (Valentino Garavani)\n\n瓦伦蒂诺是意大利著名设计三巨之一,1932年出生于意大利米兰的贵族之家,中学毕业后即赴巴黎学习服装设计与制作技艺,曾先后师从姬龙雪(Guy Laroche)、迪奥等法国著名时装设计大师门下深造学习。\n\n1959年回到意大利成立个人品牌,并于1962年开设首间时装沙龙,他所设计的女装造型极为精致华美,尤其擅长以极其考究细腻的手法体现出典雅高贵的女性化优雅魅力,自他成名以来长期为诸多欧洲皇室成员与国际知名影星贵妇所青睐追捧,以\"瓦伦蒂诺红\"这一标志性专属红色调闻名于世界时装界。\n\n### 七、伊夫·圣·洛朗 (Yves Saint Laurent)\n\n伊夫·圣洛朗(1936-2008年),生于阿尔及利亚,17岁时赴巴黎学习服装设计,1958年以他的第一场独立发布会成功登场,当年22岁的他便正式担任克里斯汀·迪奥公司的首席设计师职务,以年轻的才华承接了迪奥辞世后的品牌领导重任。\n\n1962年他创立了以自己名字命名的YSL个人品牌,并将女装设计理念带入到一个前所未有的全新境界层次,他被认为是当代时尚界最具影响力和革新意识的设计大师之一,他所主导的经典设计理念是将传统专属于男装范畴的元素(如吸烟装、猎装等)大胆引入女装设计领域,创造出兼具阳刚洒脱与优雅魅力的经典设计典范,充分体现出跨越性别边界的先锋设计理念。\n\n伊夫·圣洛朗从多元艺术领域中汲取设计灵感,包括从现代艺术流派(如蒙德里安Mondrian等)、非洲部落艺术、抽象派绘画大师(毕加索Picasso等)乃至中国传统文化元素中汲取创作养分,他的设计作品因而呈现出极为丰富多元的艺术跨界融合特色,极大拓展了传统时装设计的表现边界与文化内涵深度。\n\n他曾于1977年推出以\"中国风\"为主题的经典系列,这一系列作品充分体现出中国传统文化元素与西方现代时装设计理念相互交融碰撞的独特艺术魅力,展现出他对多元文化兼容并蓄的深刻理解与创新演绎能力。\n\n协会所属的服装设计学校毕业,他先后担任著名服装设计师吉梵希(Givenchy)的助理设计师,学习了许多高超的服装工艺技法,1969年他进入巴伦夏加时装屋工作历练,融汇积累了巴黎时装的精髓,三年后自立门户创立了以自己名字命名的品牌\"YSL伊夫·圣洛朗时装屋\"。1971年在巴黎的首次时装个人时装发布会,凭借巨大的市场反响,1973年他登上了当时法国最具影响力的时装公会主席职位,1977年至1976年全巴黎时装公会,1977年至1976年全巴黎时装公会主席职位并将服装设计行业推向了空前发展的巅峰盛况。\n\n三宅一生始终关注西方消费社会不同层面消费者对高级时装差异化审美价值的深刻思考理解,他非常擅长探索日本传统服饰艺术美学理念与西方现代服装设计手法的融合创新之道,他的设计极为重视强调服装本身呈现出的空间造型美感效果,善于运用极具创造性的独特面料改造再造工艺技法,他所代表倡导推动的物质、极简、几何抽象的设计理念,深刻地影响推动了后世无数当代设计师的美学创作走向和设计理念形成。\n\n### 八、三宅一生 (Issey Miyake)\n\n1938年,三宅一生出生于日本广岛,20世纪60年代,三宅从日本著名多摩美术大学(Tama Art University)设计系毕业后,随着赴法国服装学业的进一步深造,1965年在巴黎高级时装设计学院。\n\n巴黎的时装舞台上,表现出引人入胜的魅力,他被著名服装设计者艺术的高度关注,时装的裁剪、结构、面料、褶皱、造型等诸多维度成为服装造型设计的核心探索,除了他的名气以外,依然从美感觉上不失他作品追求的\"上乘服\"设计才华,同时具有深深浸透地体现出对西方传统裁缝艺术精髓的骄人造诣。\n\n三宅一生始终热爱研究开发,始终不断地探索出西式服装剪裁法之外的这种民族的服装形式,他还是继日本民族的服装设计师,如何保留服装设计的东方民族色彩要素,始终探索着自己独立自主的风格,创造具有跨时代精神特质意涵的独特服装造型语言表现风格,以呈现出一种既国际化又不失民族特色的东方式设计美学。\n\n服装的产生的服装造型设计合于身体所在,即适合于人体所自身,服装本身也应贴合并唤起人体丰富的能感官,不同的空间,不同的角度,即使是同一件服装造型,亦能焕发出丰富多变的层次美感表现效果,因此,三宅一生强调让身体与人体空间相互关系为设计考量的重要出发点,使服装成为服装与身体二者相互密不可分的整体美学表达。\n\n服装设计对面料以他的手法,采取国际的创作,是以人体的活动方式契合于人体的力和情感,不仅仅只考虑材料本身的物理属性,更要以人体活动方式为主要参考,是他对时装研究并突破的一种富有独特开创性和探索精神性的美学观念思考。\n\n起皱织物,棉和非织造等等时装,这些在传统的巴黎高级女装界是从未有过的,三宅一生将这些材料与传统面料的裁剪工艺相结合,利用他所创作的独特工艺技法及美学理念,大胆突破传统高定时装工艺的固有边界,充分展现出以创新工艺融合传统技艺所呈现的丰富多元造型语言与视觉表达效果。\n\n三宅一生工艺上突破了传统的思路,得以在服装造型中展现出人体所在的立体感觉的塑造设计手法,方西式工艺与日本服装的传统,打造出独具特色的一系列作品,有对特色的手法,采用最好的面料和织物,使技术带来了新兴市场的新研发和新突破,三宅一是一个创造艺术家,是国家美学界的领跑者与新方向探索者,他对材料本身有着极为深切独到的艺术认识,他主持着重于世,在他的作品无疑是人类的至宝财富。\n\n### 九、让-保罗·戈尔捷 (Jean Paul Gaultier)\n\n1952年,让-保罗·戈尔捷出生于法国一个中产阶级家庭,从小喜欢时装设计,15岁就出版了一本《高定时装剪裁设计》一书,1971年,其才华受到赏识,进入到他的时装工作,之后,他\n\n为习了卡顿(Jean Patou)公司干了几年,推出了自己创立的品牌,1976年,他推出的时代造型的时装,别致鲜活的构思和方法,别热出了自己创立的品牌。设计的想象力和技术都是十分丰富有趣的服饰,他的服装带来了极大的成功变化,风格上是特殊的,让人一时的时装,惊叹于他的想象力与创造力。\n\n以他的服装的设计手法极为独特出乎意料,极具戏剧化和视觉冲击效果,善于打破传统性别刻板界限而重新定义服饰穿着规范,他的经典设计理念对当代整个国际时尚界产生了深远持久的影响,他被誉为塑造了20世纪法国时装乃至世界时装界的重要标志性人物之一,曾担任爱马仕(Hermes)首席设计师职务(1978年)等重要品牌顾问职务,始终以其独树一帜的先锋前卫理念持续引领着国际时装设计潮流的探索与创新。\n\n戈尔捷时期以是一位极具争议性和大胆探索精神的设计师而闻名,不但对传统服装设计观念进行颠覆性思考,还如男装女性化和女装男性化的界限打破,他一直被认为是最具突破创新性和话题性的设计大师,是当代时装设计领域中最勇于挑战和突破传统的设计代表人物之一。\n\n力,他的技术更臻完善,可谓炉火纯青,1987年秋季,他坐获了法国设计时装设计中的经典二奖,布下了服会经济与政界的青睐,舒了法国传统时装的架构。\n\n### 十、克里斯汀·拉克鲁瓦 (Christian Lacroix)\n\n1951年,拉克鲁瓦出生在法国南部的一处地中海阿尔勒(Arles)小镇,他的家庭是了法兰士族地区共黄阴影黄区风格的古典建筑遗迹之中。\n\n早年时,他求求不停地绘出,通过自己的画,去追进自己心中的这种梦想,进过自己以气的风格,推出成了自己以着装设计的经典系列,在他十几岁的时候,他喜欢动手打作衣裙,他物有的服装,他就有物为服饰,是超越自己心之的人的青睐建索康拉·康拉(Christian Bernal)百合姓解决法的图,从而中意到了许多的设计理念上于自己的浪漫成分,如画家奥斯卡·王尔德(Oscar Wilde)、绘画大师、巴黎学院或展现于教养为堂,他记者到蒙比利埃(Montpellier)大学学习(担任7)语,希腊语,艺术史,文学和电影),转到艺术学院后于1973年来到巴黎。\n\n面料使用的多样化,时时兼具现代风格,到1980年,他已经跟随与吉京的宫廷(Imperial Court)设计师携手于此,他也加入到以·和图(Jean Paton)的工作室中,同时决定了向高级时装为向发展,在那时时期,拉克鲁瓦的服装从为自己不同时装,拉克鲁瓦以设计蓬松高廓的裙,有着他的设计发布了第一场高级时装,设计出了自己国际知名,他设计的女装绿续大批高擅一层次的国际的方是1987年,他的名和国的时装协会(CFDA)颁发给他一次奖项,使他被认为是国际级明星。他先驱者,或从最新的年展方式,他被极限。\n\n同年,他在LVMH集团(LVO)启动路一奖记名达著名品牌(Bernard Arnault)的资助下,在巴黎地区开设了自己的设计公司,同学品发点,担任高巴西万百姓的地位是并发挥的重要作用。\n\n1989年,在巴以自己作为的品牌服公司,拉克鲁瓦所也在拉克鲁瓦独立创作个人的服饰的空间,才成了自己以设计的时装,却带来色彩的个性,拉克鲁瓦的独特色彩巨大人,充满有色彩主义的地方,拉克鲁瓦创造的时装十分之独特,而这两种设计以创新精神,他在服装历史发展中的地位是无法可替的。\n\n1994年,拉克鲁瓦推出了自己的国际展系列,并列了国际色彩、极致装饰性的强调经典色彩风格,他被公认为整个巴黎时装历史上以浪漫多姿浓烈的色彩表现和极致奢华装饰性风格著称,创造了极具独树一帜个人特色的高级时装典范。\n\n### 十一、维维安·韦斯特伍德 (Vivienne Westwood)\n\n维维安·韦斯特伍德1941年生于英国的一个小城镇,17岁时与家人迁居曼彻斯特,后来成为一名年轻的教师,并对当代艺术抱有浓厚兴趣,1960年末结识了马尔科姆·麦克拉伦(Malcolm Mclaren),成为她人生的转折点,启发她的人生方向。\n\n英国当时时装设计仍以传统庄重经典风格为主导,一批\"标新立异\"的年轻设计师,主张打破陈规,以完全自由前卫的态度探索前所未有的时装设计新方向,与迈克拉伦(Malcolm Mclaren)相恋期间,她开始正式涉足并进入服装设计领域,凭借二人先锋前卫大胆的设计理念,在70年代到80年代成为伦敦朋克(punk)先锋文化标志性人物,以其鲜明特立独行的个性设计风格闻名于世界时尚舞台。\n\n70年代末的时代,她已经跳出了当年这种\"叛逆青年\"服装的先锋标志,她开始形成了自己独具一格的经典标志性设计语言与风格体系,由此她被誉为\"朋克教母\",是当代英国时装设计界最具代表性与影响力的先锋人物之一。她极为擅长将苏格兰传统格纹面料(Tartan)等经典元素融入到自己极具颠覆性和创造性的先锋设计理念之中,充分展现出她对传统与反叛、经典与前卫相互融合碰撞的独特艺术表达能力。\n\n她的时装作品长时期以来,时装的思想是一个不断被更新的社会思想,不断的挑战和展开,成为当代设计所在国际时尚舞台前沿的不断挑战与思考的一种\"揭示\",这个时装,反映时时代精神的形式一部分。因此我们可以说这些作品是当代艺术与时尚设计跨界融合最典范的代表作品之一。\n\n### 十二、约翰·加利亚诺 (John Galliano)\n\n1960年,加利亚诺出生于直布罗陀,幼年时随家人移居英国,少年时代对时装设计已表现出浓厚的兴趣与天赋,后进入伦敦著名的中央圣马丁艺术设计学院(Central Saint Martins)学习服装设计专业。\n\n1984年他的毕业设计作品便在英国时尚界引起了极大轰动关注,被誉为当年该校最杰出优秀的毕业设计作品之一,并因此获得了伦敦著名精品百货Browns的关注和大力推荐支持,1990年,加利亚诺正式受邀赴巴黎发展个人职业生涯,并很快成长为国际时装界最具影响力和创造性的重要设计师之一,曾先后担任纪梵希、迪奥等国际知名品牌的首席设计师职务,以其独具戏剧张力与浪漫主义色彩的经典设计风格闻名于世界时尚舞台。\n\n加利亚诺设计的服装作品,呈现华丽、飘逸、戏剧化的风格,成为那时代精神的代表。\n\n加利亚诺本人的为人态度使他专心于某件优秀的作品,而不是沉醉于创新型作品,因此他不是那种把设计存留时候留而流现实的时装设计,他设计出深受一些著名女性设计的融合,通道时装的一种真挚感的高级时装,设计出深受一些著名女性设计的融合,通道时装的一种真挚感的高级时装设计效果,传统的民族风情文化传统时装的形式,颇有着人们有着许多的融合,把这种融合的高效应用,把握其人性心理和逻辑,是他成功的重要因素。\n\n加利亚诺1995年后进出任伦敦服装设计学院的一年,1996年10月又被迪奥公司邀以担任——包法法未成他生的新形象,他把梦想化了主色,顺利入围时装最艺廊,精心策划,解构服装,他也把\"迷失\"般空到自己时装作品的最高峰力,\"迷失\"高贵而又难以取有和迷失力,是其中最阳性的一部,是这一次原意本次别人的名字已经不属于他自己,而是成为迪奥公司的一部分,人们已经把他和\"迷奥\"紧紧地联系在一起了。\n\n### 十三、詹弗兰科·费雷 (Gianfranco Ferre)\n\n费雷(1944-2007年)被称为\"时装界天才的建筑师\",他1944年8月15日出生于米兰附近小镇莱格纳诺(Legnano)的一个工人家庭,高中毕业后,他进入米兰工业学院(The Milan Polytechnic Institute)学习,取得了建筑学学位。他的时装设计生涯却是与他所学的建筑设计,则在这时期为米兰他和展现的服装设计上的具工艺美学,20世纪70年代,专职为费雷开始了他的一生,通过的许多沉浸的第一阶段,也在他的裁剪,费雷开始独立创设作发计的第一阶段,通过一些高极为设计打造了意大利一批著名时装编制的经典典范因素设计的图形和事物,是成为有才气的设计师,这个不代表,让费雪意识自己的服装设计方向,坚定了他改行的追求,即时,他加剧了向时装设计方向转发的脚步,备然自己,在他的裁剪,费雷开发了了作方设计过来精练,深取了志方的服装造型精髓,惟得了传承是所有成功作品成表的目标,并且坚持把这种精神贯穿于他的设计中。\n\n1974年,费雷回到意大利,设计了自己的第一个女装成衣系列,并开始之路上,费雷的脚步一刻也不资赋闲,一手撞了属于自己的时装的舞台,无处不是任地风品所有实衣的时尚之门,试问对高强度主为他线与力时装的情境理,让费雷时装的时期打开了国的服装,苦有品口福被通。\n\n被誉为为时装界的建筑师的费雷,向能极其自然的线条,用材料在数学的一体的中把握感觉的手,他极不喜欢的追求奢华的风格,在设计上,他构以不算多女性风格的追求,提高自己对生活的价值,以此突破以对追求高层次的意大利风格。\n\n费雷的服装,不用是他表现服装的追求装意,他意识不出的手无意在追求生活的价值品味,梳理和精细的技术,费雷的设计在于设计与创新和传承合理的说法,考的时装设计思想的忠情感的独有女装设计的名字,\"他是一位真正懂得如何和细节合造和情感的大流媒女装设计师\"。他的设计中被自己表达出色,会追为世界时尚史上一生里程碑\"。\n\n费雷追求传统与创新的融合,以追求女性阴柔美,以此突破以对追求高层次的意大利风格式和秀气传承合理巧合。\n\n参考文献 /127\n\n后 记 /128\n\n---\n"
    },

      "body": "\n《服装设计概论》由余强编著,是\"服装高等教育'十二五'部委级规划教材·服装设计专业系列教材\"之一,中国纺织出版社出版(后记落款2016年1月2日)。全书共十章,构建了从设计基础理论、服装历史社会功能、形态语言技法、面料材质、装饰美学、流行品牌、教育研究到大师传记的完整知识体系:\n\n- **第一至四章(基础理论)**——设计的含义与创造性思维、服装的产生发展与社会功用、服装的形态范畴(概念/分类/裁剪方法)、服装的形态语言(廓型/造型要素/部件设计)\n- **第五至七章(应用理论)**——服装设计的载体面料、服装与装饰(形式美法则/图案/色彩/饰物)、服装设计美学的范畴与基本特征(整体美/动态美/主题美/艺术美/材料工艺美)\n- **第八至九章(产业与教育)**——时装的流行心理机制与品牌营销、服装设计教育的研究与未来(国内外教育现状/服装史论研究/设计师素养)\n- **第十章(人物传记)**——沃斯、香奈儿、迪奥、巴伦夏加、皮尔·卡丹、瓦伦蒂诺、伊夫·圣洛朗、三宅一生、让-保罗·戈尔捷、拉克鲁瓦、维维安·韦斯特伍德、约翰·加利亚诺、詹弗兰科·费雷等13位世界服装设计大师的生平与设计风格\n\n参考文献15条,涵盖中外服饰史、艺术设计理论、服装文化、服装心理学、世界时装史等专著,可作为深入研究的延伸阅读方向。\n\n> **提示**——本书部分页面(尤其第五章\"面料的再造\"及第十章拉克鲁瓦、加利亚诺、费雷等个别段落)原始印刷/扫描质量欠佳,文字辨识存在一定难度,已尽力按语义合理还原,如需精准引用原文建议对照原书核实。\n"
