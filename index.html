      "body": "本项目把色彩和面料放在一起讲。色彩决定服装的第一情绪、风格气质和搭配关系；面料决定触感、结构支撑、肌理表现和工艺可能。两者不能分开理解：同样的廓形，换成不同色彩和面料，会产生完全不同的审美效果。\n\n### 主题一 服装色彩设计\n\n#### 一、服装色彩的基础知识\n\n服装色彩是服装构成三大要素之一。教材把色彩看作物质与精神的集中体现：它既是可见的视觉属性，也是情感和风格表达。设计师使用色彩，不只是给服装上色，而是在决定作品的生命力、情绪温度和市场识别度。\n\n**色彩**——物体在光线照射下反射到眼睛中的视觉感受。色彩至少需要物体、光线和眼睛三个条件共同作用。\n\n设计提示：同一颜色在自然光、商场灯光、舞台灯光、摄影棚灯光下会呈现不同效果；同一颜色在不同面料上也会因光泽、纹理、厚薄而不同。因此配色不能只看色卡，还要看实际材料和穿着环境。\n\n**无彩色系**——黑、白以及黑白混合形成的全部灰色。无彩色系没有色相和纯度变化，主要依靠明度层次形成视觉差异。\n\n**有彩色系**——色相环上的所有颜色，如红、黄、蓝、绿、紫等。有彩色系具有色相、明度、纯度三种基本属性。\n\n#### 二、色彩三要素\n\n**色相**——颜色的基本相貌，也就是判断颜色是红、黄、绿、蓝、紫的依据。色相决定第一印象，例如红色热烈，蓝色冷静，紫色神秘。\n\n**纯度**——色彩纯净程度，也可理解为鲜艳还是浑浊。高纯度色彩醒目、强烈、活跃，适合舞台服、民族服、展示设计；低纯度色彩含蓄、柔和、沉稳，适合职业装、成熟风格和耐看系列。\n\n**明度**——色彩的明暗程度。加白提高明度，加黑降低明度。明度影响服装视觉轻重、层次清晰度和整体比例。\n\n易混点：纯度低不等于颜色浅。浅粉色可能明度高但纯度不一定低；深红色可能明度低但仍很鲜艳。\n\n#### 三、服装配色的原则\n\n服装配色的核心原则是**和谐感**。和谐感来源于对比和调和。好的配色不是没有差异，也不是差异越大越好，而是在对比与统一之间找到适合主题的强度。\n\n**色彩对比**——两种或多种色彩在色相、明度、纯度、冷暖上产生差异。对比能制造重点和活力，但过强会生硬、紧张。\n\n**色彩调和**——两种或多种色彩协调组合，形成舒适、愉悦的美感。调和能增强整体感，但过度接近会单调。\n\n设计判断：如果要柔和、自然、稳定，应偏调和；如果要热烈、跳跃、舞台感，可以增加对比。\n\n#### 四、服装色彩的对比\n\n**色相对比**——色相环上不同颜色之间的对比。\n\n1. **同种色对比**——相距约 0°，如绿色与深绿色。统一、协调、稳定，但容易单调。\n2. **邻近色对比**——相距约 30°，如蓝与绿、红与黄。柔和、稳定，适合日常和自然风格。\n3. **类似色对比**——相距约 60°，如红与紫、黄与绿。丰富、饱满、不单调，但要注意明度和纯度变化。\n4. **对比色对比**——相距约 120°，如红与蓝、黄与紫。跳跃、热情、醒目，但需控制面积和数量。\n\n**明度对比**——深浅差异形成的对比。教材用 1–9 的黑白灰层级理解明度：1–3 为高明度，明亮轻快；4–6 为中明度，稳重柔和；7–9 为低明度，低调厚重。\n\n明度对比可分为：\n\n1. **短调 / 弱对比**——差 3 阶以内，柔和统一。\n2. **中调 / 中对比**——差 4–5 阶，有层次但不突兀。\n3. **长调 / 强对比**——差 6 阶以上，清晰强烈。\n\n**纯度对比**——鲜艳程度差异形成的对比。\n\n1. **纯度强对比**——两种颜色都鲜艳，刺激、生硬、视觉冲击强。\n2. **纯度中对比**——纯度适中，协调、统一、耐看。\n3. **纯度弱对比**——两种颜色都较灰，容易沉闷、含糊。\n\n降低纯度的方法：\n\n1. 加白色：纯度降低，明度提高。\n2. 加黑色：纯度降低，明度降低。\n3. 加灰色：纯度降低，明度变化不大。\n4. 加互补色：纯度降低，色彩更丰满。\n\n**冷暖对比**——色彩冷暖性质形成的对比。红、黄、橙偏暖，蓝、绿、紫偏冷。冷暖不是绝对的，同一色相内部也会因明度、纯度和混色方向产生冷暖变化。\n\n#### 五、服装色彩的调和\n\n**对比调和**——当两种颜色过于对立、生硬、刺激时，降低一方明度或纯度，使冲突变弱。例如红与绿强烈对比时，可把红调成红灰色。\n\n**类似调和**——当两种颜色过于接近、含糊单调时，提高或降低一方明度、纯度，使关系清楚。例如黄与橙过近时，可让黄变浅或让橙偏褐。\n\n易混点：调和不是把所有颜色都变灰，而是调整关系。它可能降低对比，也可能增强层次。\n\n#### 六、服装配色规律\n\n**同类色搭配**——同一色相内部深浅不同的组合，如蓝与深蓝。通常把同一色相分为深、中、浅三个层次，使整体统一又有变化。\n\n**对比色搭配**——教材这里指广义的不同色相、纯度、明度搭配，而不只限于 120° 色相对比。它丰富、厚实、活跃。\n\n对比色搭配分为：\n\n1. **色彩强对比**——差异大，鲜明、刺激、显眼，适合演出服、民族服装。\n2. **色彩中对比**——差异适中，充实、丰富、有变化，适合日常设计。\n3. **色彩弱对比**——差异小，温和、雅致、自然，但要防止层次不清。\n\n**黑白灰搭配**——彩色与黑、白、灰组合。黑白灰属于中性色，沉稳、大方，可调节彩色之间的明度和纯度关系。\n\n1. 彩色与黑色：彩色宜鲜艳，形成明亮而稳定的效果。\n2. 彩色与白色：彩色明度不宜过低，否则反差过大。\n3. 彩色与灰色：彩色最好保持中等或较高纯度，否则整体偏灰。\n\n#### 七、服装配色的一般过程\n\n整体服装配色包含三个基本色块：主色、搭配色、点缀色。\n\n**主色**——面积最大、使用最多、占主导地位的色彩，决定服装风格、情调和主题基调。\n\n**搭配色**——辅助主色的色彩，面积小于主色，可丰富层次和补充主题。\n\n**点缀色**——面积最小，起点缀和平衡作用，可出现在局部色块或服饰品上。\n\n配色流程：\n\n1. 确定主题、情调和风格。\n2. 根据主题选择主色。\n3. 根据主色关系选择搭配色。\n4. 根据主色与搭配色是否过近或过远选择点缀色。\n\n设计判断：如果主色和搭配色太接近，点缀色应拉开关系；如果两者太刺激，点缀色应稳定整体。\n\n#### 八、流行色与常用色\n\n**流行色**——在特定时间、特定区域里被认为时尚的色彩。它具有时间性、区域性、周期短、以色组形式出现等特点。流行色在服装领域最敏感，国际流行色发布通常会影响 1–2 年后的服装色彩。\n\n流行色生命周期：\n\n1. 产生期。\n2. 激增期。\n3. 普及期。\n4. 衰退期。\n5. 淘汰期。\n\n**常用色**——适用性强、使用范围广、持续时间较长的色彩。它比流行色更稳定、更持久，常与流行色组合使用。常用色甚至可以成为品牌识别，如经典米色与褐色格纹。\n\n---\n\n### 主题二 服装面料设计\n\n服装设计不只是造型、款式和色彩的创意，也包括面料创意。面料决定服装能否支撑某种廓形、呈现某种肌理、表达某种主题。新型面料和功能性面料的发展，为设计师提供了更多想象空间。\n\n**功能性面料**——具有特殊防护或使用性能的面料，如防雨、防辐射、隔热等。\n\n**新型面料**——通过材料、工艺或表面效果创新形成的新面料，如环保面料、立体印花面料、手绘面料等。\n\n#### 一、面料的织造设计\n\n**面料的织造设计**——由面料厂家或面料设计师在织造阶段完成的设计与加工。传统情况下，服装设计师只能从现成面料中选择材料，因此会受到面料品种、图案、宽幅和供应条件限制。\n\n**定制面料**——面料厂家根据设计师要求进行织造或图案布局，使面料从一开始就服务于具体款式。教材举例说明，旗袍面料可以把肩部和下摆花型按真实衣片尺寸织在同一块面料上。\n\n设计提示：定制面料体现“面料与款式同步设计”的思维，要求设计师理解衣片结构、花型位置、人体比例和工艺实现。\n\n#### 二、面料的再造设计\n\n**面料的再造设计**——设计师根据自身风格和主题要求，对已经织造好的面料进行再加工，使其产生新的形态、肌理、层次或表现力。\n\n面料再造分为三类：\n\n**增型设计**——在原有面料上通过工艺和装饰增加艺术形态。常见手法有刺绣、印染、粘贴、绘制、镶钻、披挂装饰等。它能增强立体层次和文化内涵，适合礼服、舞台服、民族风格、艺术服装。\n\n**减型设计**——通过工艺改变面料原有结构，制造不完整、通透、破损或粗犷效果。常见手法有镂空、抽丝、破洞、打磨等。它适合前卫、街头、实验和解构风格，但要注意面料强度和穿着安全。\n\n**立体型设计**——通过收褶、缝合、填充、堆积等方式改变面料平面形态，形成立体肌理。它能把平滑面料转为触感强烈、视觉丰富的材料，尤其适用于礼服和创意造型。\n\n#### 项目五训练清单\n\n1. 能否说明色彩由哪三个条件形成？\n2. 能否区分色相、明度、纯度？\n3. 能否解释色彩对比与色彩调和的关系？\n4. 能否用同类色、对比色、黑白灰三种规律做配色练习？\n5. 能否按主色、搭配色、点缀色建立一套服装配色？\n6. 能否区分流行色和常用色？\n7. 能否说明织造设计与再造设计的区别？\n8. 能否分别构思增型、减型、立体型面料再造方案？\n\n---"

      "title": "服装设计基础 / 项目六 服装分类设计",

      "body": "本项目把服装设计放到具体对象和具体品类中理解。不同性别、年龄、季节、功能和部位的服装，在造型、结构、色彩、面料、装饰上都有不同重点。分类不是为了背名词，而是为了让设计师明确目标人群和市场定位。\n\n### 主题一 服装分类方法\n\n服装分类方法很多，常见方式包括：\n\n1. **按性别分类**——男装、女装、中性服装。\n2. **按季节分类**——春秋装、夏装、冬装等。\n3. **按年龄分类**——童装、青年装、中年装、老年装。\n4. **按功能分类**——运动装、学生装、职业装等。\n5. **按部位分类**——上装、下装、连衣裙、礼服等。\n6. **按造型结构分类**——紧身型、适身型、宽松型。\n7. **按民族或历史来源分类**——汉服、清服、唐服、藏族服装等。\n\n分类对企业也有重要意义。品牌往往通过固定分类建立市场定位，例如女装品牌、男装品牌、少年服装品牌等。明确分类能帮助企业形成品牌形象，也让消费者更有针对性地选择。\n\n设计判断：一件服装的分类会影响所有设计决策。职业装与运动装、青年女装与中年女装、婴儿服与少年服在舒适度、装饰、色彩和结构上都不能套用同一标准。\n\n---\n\n### 主题二 女装设计\n\n#### 一、女装设计概述\n\n**女装设计**——女性服装的设计，包括上衣、下装、连衣裙、职业装、晚礼服等。教材认为当代女装不再只是服用功能需求，而更多体现艺术审美和装饰需求。\n\n当代女装设计追求三个特性：\n\n1. **美**——强调女性身体线条、服装比例和审美效果。\n2. **新**——追求流行、变化和新鲜感。\n3. **异**——强调个性、差异和独特风格。\n\n这些特性体现在风格、造型、结构细节、装饰、面料、色彩等方面。\n\n#### 二、女性生理、心理特征\n\n女性身体总体特征：线条柔和、曲线明显，肩窄、胸高、腰细、臀宽、四肢纤细。但不同年龄阶段差异明显。\n\n**少年期女性**——整体柔弱，胸部较平，臀部不丰满，三围差别不大。适合宽松、利于运动的服装，以休闲、运动装为主。\n\n**青年期女性**——身体凹凸有致，三围明显，体型较丰满。适合时髦、流行、有个性的服装，是女装设计空间较大的阶段。\n\n**中年期女性**——身体趋于平直，胸部和臀部可能下垂，腰臀差减小。适合简单、大方、修饰性较强的服装。\n\n女性服装心理需求：\n\n1. **求美心理**——希望通过服装提升美感和身体表现。\n2. **求新心理**——关注流行变化和新款式。\n3. **从众心理**——会受流行趋势、文化层次、场合和消费水平影响。\n\n设计应用：女装设计不能只用年龄标签，还要结合心理年龄、穿着场合、消费能力和审美偏好。\n\n#### 三、上衣设计\n\n**上衣**——人体上身所穿服装，包括衬衫、西服、内衣、背心、两用衫、T 恤等，由衣身、衣袖、衣领、腰身、下摆等部件组成。\n\n上衣分类方式：\n\n1. 按款式：衬衫、女两用衫、背心等。\n2. 按季节：春秋上衣、夏季上衣、冬季服装。\n3. 按用途：内衣、睡衣、运动上衣、日常上衣。\n4. 按廓型：A 型、H 型、X 型、O 型等。\n\n上衣基本造型：\n\n1. **A 型上衣**——上窄下宽，下摆放大，衣长可短可长。\n2. **H 型上衣**——上下宽窄接近，胸围、腰围、下摆变化不大。\n3. **X 型上衣**——在 H 型基础上收腰，下摆适当加宽。\n4. **O 型上衣**——肩部和下摆收紧，中间放大，类似灯笼形。\n\n结构设计重点：\n\n1. **衣领与门襟**——领型可无领、翻领、立领、翻驳领；门襟可正开、偏开；纽扣可单排或双排，也可侧开或后开。\n2. **衣身结构**——通过衣片分割、放量、腰节线高低、衣摆大小实现不同造型。\n3. **衣袖设计**——长袖、中袖、短袖、无袖；连衣袖、插肩袖、装袖；可做喇叭袖、灯笼袖、紧袖口等。\n4. **色彩面料**——面料性能决定造型和风格；青年女性色彩可丰富，中年女性宜大方素雅，老年女性常用淡色或碎花。\n5. **装饰设计**——绣花、荷叶边、钉钻、收褶、镶边、蕾丝等，应与年龄和风格匹配。\n\n#### 四、下装设计\n\n**下装**——人体下身穿着的服装，主要包括裙和裤。裙有筒裙、喇叭裙等；裤有长裤、中裤、短裤等。\n\n下装结构关键部位：\n\n1. **腰节**——高腰、中腰、低腰影响比例和风格。\n2. **臀围**——决定贴体程度和活动空间。\n3. **上裆**——影响裤装舒适度和结构合理性。\n4. **脚口 / 下摆**——决定裤腿或裙摆开合。\n5. **长度**——长裙、中裙、短裙；长裤、中裤、短裤。\n\n裙装造型举例：腰节高低形成不同腰线；臀围和下摆大小形成喇叭裙、A 裙、筒裙；裙长变化形成不同年龄感和场合感。\n\n装饰手法：拼接、绣花、抽褶、打裥、滚边、花边、荷叶边等。可单独使用，也可组合使用。\n\n#### 五、连衣裙设计\n\n**连衣裙**——上衣与下装连在一起的裙装，可有腰节线，也可无腰节线，是女性夏装的重要款式。\n\n造型关键部位：\n\n1. 肩部。\n2. 胸围。\n3. 腰围。\n4. 臀围。\n5. 袖长。\n6. 裙长。\n7. 下摆。\n\n基本造型：\n\n1. 肩、腰、下摆都适体，形成 H 型。\n2. 肩部适体、腰身收紧、下摆放大，形成 X 型。\n3. 肩部适体、腰身和下摆放大，形成 A 型。\n\n结构类型：\n\n1. **连腰节**——上下身连为一个衣片，不分割，整体感强。\n2. **分腰节**——通过腰节线高低形成高腰、中腰、低腰连衣裙。\n\n装饰部位：衣领、袖口、裙摆等。可用绣花、花边、蕾丝、加褶、镶丝等。少女装、淑女装可装饰较多；花色连衣裙装饰应减少，以免杂乱。\n\n#### 六、职业套装设计\n\n**职业套装**——职业女性在上班场合穿着的上、下装组合款式。它通常用于春秋季节，用料较考究，款式端庄、大方。\n\n职业套装的功能：\n\n1. 表示职业身份。\n2. 体现行业精神。\n3. 传达庄重、专业、可信赖的形象。\n\n造型结构要点：\n\n1. 上装通常适体收腰，表现女性曲线，但衣长不宜过短或过长。\n2. 裤装可直筒、锥型或小萝卜型，裤长可九分或长裤。\n3. 裙装可直筒或 A 字型，长度以膝盖为参照，可膝上、膝下或齐膝。\n4. 领型可驳领、青果领、立领、无领。\n5. 门襟可正门襟、偏门襟、直线或斜线；纽扣可单排或双排。\n6. 腰身常通过直线、斜线、曲线分割处理，使胸腰省融入结构。\n\n装饰原则：职业套装不宜夸张，可在口袋、领口、门襟、袖口、色彩拼镶或服饰品上做细节变化。主色多用素雅中性色，局部可用米白、丝巾、耳环、领结、皮鞋等点缀。\n\n---\n\n### 主题三 男装设计\n\n#### 一、男装设计概述\n\n男装相较女装更注重品质、身份和稳定风格。它常体现男性的粗犷、阳刚、社会地位和审美品位。男装多以直身型为基础，结构变化没有女装复杂，主要款式包括西服、夹克衫、衬衫、大衣等。\n\n#### 二、男性生理、心理特征\n\n男性身体总体特征：线条刚毅，整体呈倒梯形，肩宽、臀窄、腰臀差小，四肢健硕有力。\n\n**青年期男性（18–35 岁）**——胸部壮实、腰细、臀窄，精力充沛、活泼好动。服装以休闲、运动为主，如牛仔、运动装、夹克、休闲西装。\n\n**中年期男性（35–60 岁）**——成熟稳重，注重身份和地位；身体可能出现腰粗、腰突、臀下垂。服装以正装为主，也穿休闲类服装，如西服、夹克、衬衫、T 恤。\n\n**老年期男性（60 岁以上）**——身体可能肥胖或清瘦，体力下降，服装更强调舒适、宽松和实用，身份表现需求减少。\n\n男性服装心理需求：\n\n1. 修饰自我。\n2. 标志身份。\n3. 体现个性。\n4. 表达群体认同。\n\n#### 三、衬衫设计\n\n**衬衫**——男士常用服装，一般春秋穿着，有长袖、短袖，面料多为轻薄棉麻。历史上从无领无袖基型发展到欧洲装饰性衬衫，再到现代男女通用款式。\n\n造型结构：男士衬衫以 H 型为主，内部结构采用横向和纵向分割。横向分割常在前胸、后肩；纵向分割用于前片、后片和袖片。领型以翻领、立领为主。\n\n装饰设计：男士衬衫大方得体，装饰较少。装饰主要在领口、袖口、纽扣处，可用拼色、镶边等简洁手法。\n\n#### 四、西服设计\n\n**西服**——源于欧洲，是男士传统服装，现代西服具有外观挺括、线条流畅、穿着舒适、国际化程度高的特点。\n\n造型变化：西服由过去强调肩部的 T 型逐渐转向 H 型。T 型通过垫肩体现魁梧，下摆收紧；H 型肩部合体，下摆略放宽。\n\n结构要点：\n\n1. 衣身可三开身、四开身。\n2. 袖子弧线要适合手臂弯曲和运动量。\n3. 驳头位置可高可低、可宽可窄。\n4. 驳头高且窄偏休闲，驳头低且宽偏传统。\n5. 驳头高低会影响纽扣数量和整体风格。\n\n装饰与面料：传统西服多用含毛成分涤纶、薄呢，颜色偏暗，搭配衬衫领带；休闲西服可用棉麻、新型面料、浅色和中性色，可搭配 T 恤、牛仔裤、休闲裤。\n\n#### 五、夹克衫设计\n\n**夹克衫**——穿在衬衫外的外套，适合春秋和非正式场合，轻便、活泼、舒适。\n\n造型结构：夹克衫以 T 型为主，肩部宽松，下摆收紧。其显著特征是“三紧”：袖口收紧、领口收紧、下摆收紧。\n\n结构要点：\n\n1. 下摆收紧可用牛筋、拉链、纽扣、罗纹、搭襻等。\n2. 肩部结构较宽松，袖窿放深，可形成落肩袖，也可用插肩袖、上肩袖。\n3. 分割是夹克衫重要手法，可丰富款式并起装饰作用。\n4. 分割形式包括横向、纵向、斜向、曲线。\n\n装饰设计：夹克装饰主要在口袋、搭襻、分割线。口袋可明贴袋、暗缝袋、挖袋、立体袋、袋中袋；搭襻常在肩部、袖口、下摆两侧；分割线可加明线、多色拼镶、滚条。\n\n#### 六、裤子设计\n\n**裤子**——穿于下身、具有两条裤腿的服装，是男装设计重点。种类包括西裤、休闲裤、牛仔裤、灯笼裤、内裤等；按长度分为长裤、中裤、短裤。\n\n造型结构：\n\n1. **西裤 / H 型**——直筒，大方、简洁。\n2. **萝卜裤 / O 型**——上下收紧，中间膨出，飘逸、活泼。\n3. **牛仔裤 / 紧身型**——包住臀腿，面料略有弹性，塑造修长腿部。\n\n裤腰结构：\n\n1. **装腰**——腰头与裤片分开，宽窄可变，扣合方式可纽扣、拉链、牛筋、系带、搭襻。\n2. **连腰**——裤腰与裤片连为一体，一般以高腰为主，通过收省、收裥解决腰臀差。\n\n装饰设计：正统西裤装饰较少；休闲裤装饰较多，常在腰、口袋、侧缝处使用流苏、拉链、立体袋、滚边、明线、抽褶、系带、分割等。\n\n#### 七、大衣设计\n\n**大衣**——秋冬季穿在外套外面的较厚、较长服装，常用于正式场合。现代男式大衣趋向简洁、大方，以 H 型、X 型为主，面料多用羊毛混纺，色彩多为素色。\n\n造型结构：\n\n1. **H 型大衣**——适合中老年群体，直筒状，舒适、得体，长度可膝下、齐膝、膝上或短大衣。\n2. **X 型大衣**——适合中青年群体，收腰，常用腰带，显得年轻、有活力、时尚。\n\n部件设计：衣领可翻驳领、枪驳领、立领、青果领；门襟可单排扣、双排扣、拉链、暗门襟；衣袖可上肩袖或插肩袖。\n\n装饰设计：男式大衣装饰含蓄精致，常用搭襻、缉线、腰带、口袋，位置在肩部、前胸、袖口、腰部、门襟等。\n\n---\n\n### 主题四 童装设计\n\n#### 一、童装设计概述\n\n**童装**——0–16 周岁未成年人的日常服装。童装设计必须根据不同年龄阶段的生理、心理特征确定款式、结构、色彩、面料和装饰。\n\n童装设计关键词：舒适、安全、童趣、便于穿脱、适合运动、符合年龄心理。\n\n#### 二、儿童生理、心理特征\n\n**婴儿期（0–1 岁）**——以睡眠为主，皮肤娇嫩，生长快，需要成人照料。体态为头大、颈短且软、四肢短小、腹部隆起，逐渐出现坐、爬、立等动作。\n\n**幼儿期（1–5 岁）**——发育快，四肢开始粗壮，身高拉长，运动量增大，开始有自己的喜好和思想，性别差异逐渐明显。\n\n**学龄儿童期（6–12 岁）**——进入小学阶段，是智力和行为习惯发展的关键期。男孩更好动，身体结实；女孩逐渐安静、爱美，开始出现女性特征。\n\n**少年期（13–16 岁）**——进入发育过渡期，生理和心理变化明显，有自我意识和叛逆心理。男孩趋向成人体型，女孩体型更女性化。\n\n#### 三、童装设计要点\n\n**婴儿服装**——首要条件是舒适、安全、穿脱方便。结构多采用无领、前开或侧开的连体装；以宽松为主，无腰身；不宜用拉链，以免误食或划伤；面料以浅色、纯色、纯棉为主，不宜添加复杂装饰。\n\n**幼儿服装**——随着运动量增加，结构仍以宽松为主，造型多为 H 型、O 型、A 型。门襟要方便儿童自己穿脱，正前门襟配纽扣或拉链较合适。可适当加入动物、花朵、动漫卡通图案。口袋既要实用，也要符合儿童心理。\n\n**学龄儿童服装**——年龄跨度较大，设计以简洁、大方为主，适当加入个性装饰。男孩服装以 H 型为主，宽松便于运动，面料要耐磨，可在易磨损部位拼接加厚；色彩宜明快、和谐。女孩服装造型空间较大，可用 A 型、O 型、H 型、X 型，裙装是设计重点，可考虑配套服饰。\n\n**少年期服装**——少年希望表现成熟和个性，但仍为未成年人，设计要在成人化趋势和年龄身份之间取得平衡。男孩以休闲、运动系列为主，可配时尚服饰；女孩喜欢裙装，但裙长要控制，过短轻佻，过长拖沓。整体应简洁、大方，可加入蕾丝、花边、抽褶、图案等装饰，面料以棉麻等透气面料为主。\n\n#### 项目六训练清单\n\n1. 能否从性别、季节、年龄、功能、部位等角度给服装分类？\n2. 能否说明女装“美、新、异”如何体现在造型和结构中？\n3. 能否按少年期、青年期、中年期分析女性服装需求？\n4. 能否分别说明上衣、下装、连衣裙、职业套装的结构重点？\n5. 能否说明男装为何更强调品质和身份？\n6. 能否区分衬衫、西服、夹克、裤子、大衣的造型结构重点？\n7. 能否按婴儿期、幼儿期、学龄期、少年期提出童装设计方案？\n\n---"

      "body": "系列服装设计是全书最后的综合训练。它要求设计师把单件服装设计能力提升为群体设计能力：既要每套服装完整，又要让多套服装之间形成统一主题和视觉联系。\n\n### 主题一 系列服装设计的要素\n\n#### 一、系列服装概述\n\n**系列**——将某一事物按一定系统或联系排列起来。系列不是单个个体，而是有内在联系的群体。\n\n**系列服装**——具有某种联系因素，同时又有个性特征的服装群体。系列中的每套服装既要有共同元素，也要有独特变化。它不是几件衣服简单相加，而是共同主题、思想和视觉语言的整体表达。\n\n设计理解：系列服装中的共性让观众看到“这是一个系列”；个性让每一套服装都有存在价值。\n\n#### 二、系列服装设计要素\n\n系列服装有三个基本要素：数量、共性、个性。\n\n**数量**——一套是单套，两套系列感较弱，三套及以上才更接近真正系列。小系列一般 3–5 套，常用于设计比赛；中系列 6–8 套，可用于比赛或时装展示；大系列 9 套以上，常用于发布会和展览，并需要考虑舞台、灯光、服饰品配套。\n\n**共性**——系列服装的中心思想，包括主题、精神、情调、风格等，具体体现在共同造型、结构、面料、色彩、装饰手法等方面。共性不是完全相同，而是视觉和心理上能识别出联系。\n\n设计风险：初学者常只用同一面料或同一色彩制造共性，但缺少主题、情调、结构和风格层面的联系，这样系列感仍然不足。\n\n**个性**——每套服装之间的区别，体现在形态、款式、造型、结构、大小、位置、数量、长短、方向等方面。个性必须建立在共性基础上，不能脱离系列主题。\n\n设计判断：系列设计同时要求“单套完整”和“群体统一”。单套完整要符合形式美法则，群体统一要靠主题和共性因素组织。\n\n---\n\n### 主题二 系列服装设计的形式\n\n#### 一、系列服装分类\n\n系列服装可按多种方式分类：\n\n1. **按性别**——男装系列、女装系列、整体服装系列。\n2. **按年龄**——婴儿装系列、童装系列、少女装系列、中老年服装系列。\n3. **按场合**——礼服系列、职业装系列、休闲装系列、生活装系列。\n4. **按季节**——春秋装系列、夏装系列、冬装系列。\n5. **按面料**——花色面料系列、丝绸系列、棉麻系列、素色系列。\n6. **按主题**——花卉、宇宙、青春、梦幻等主题系列。\n\n#### 二、系列服装设计形式\n\n**单品系列**——以同一品类出现的系列，如休闲装系列、淑女系列、户外运动系列。它以品类一致建立共性。\n\n**造型系列**——以相同或相似外部廓型形成系列。外轮廓接近，但内部结构和细节可以变化。\n\n**结构系列**——以某种结构变化作为系列元素，如平驳领、方袋盖、嵌线袋等元素在每套服装中出现，但位置、大小、数量微调。\n\n**色彩系列**——以一种或一组色彩构成系列元素。色彩可在明度、纯度、冷暖、面积、位置上变化，形成共性与个性。\n\n**面料系列**——以面料特点作为系列元素，例如折叠、染色、渐变、拼镶、立体空间感等。教材提到三宅一生作品作为面料空间感与造型结合的代表。\n\n**工艺系列**——以工艺或装饰手法作为系列元素，如刺绣、拼贴、立体花型、钩针编织、剪切镂空、打磨、做旧、钉珠等。\n\n**图案系列**——以服装或服饰品图案作为系列元素。图案要与主题紧扣，可通过概括、意向、变形等方式强化亮点。\n\n设计应用：一个系列可以同时属于多种形式。例如一个“花卉主题女装系列”可以同时使用图案系列、色彩系列、面料系列和工艺系列。\n\n---\n\n### 主题三 系列服装设计的要点\n\n系列服装创作来自日常生活、历史文化、艺术领域、建筑、街头时尚、社会政治等多种灵感。设计师需要长期收集资源，再把资料整合、转化为主题、基型和系列。\n\n#### 一、主题的构思\n\n**主题**——服装设计的核心，可以是具体事物或事件，如花卉、动物、人物、社会热点；也可以是较抽象的概念，如宇宙、太空、幻想、青春。\n\n主题确定后，需要围绕主题收集资料，寻找色彩、面料、造型结构、工艺特点、图案造型、服饰配套等切入点，使各方面共同反映主题。\n\n主题构思方式：\n\n1. **先主题后构思**——先由自己或他人确定主题，再围绕主题进行系列设计，常见于比赛或命题作业。\n2. **先构思后主题**——设计师平时积累大量设计资源，再根据它们的共同特征归纳主题，具有偶发性和长期积累性。\n\n#### 二、基型的确立\n\n**基型**——根据主题思想构思出的第一套服装，是系列产生的基本款式造型，也是主题最具代表性的实物形象。\n\n基型包含：\n\n1. 款式特征。\n2. 面料使用。\n3. 色彩搭配。\n4. 工艺设计。\n5. 装饰手法。\n6. 与主题相连的设计切入点。\n\n设计过程：主题理解后，设计师要寻找一个切入点，可以是事物、景物、人物、一句话、文化或艺术内涵。然后围绕切入点收集资料、联想、归纳、分析，形成款式模型，再从多款中提炼最突出的一款作为基型。\n\n#### 三、系列整体的生成\n\n##### 1. 群体的生成\n\n基型确立后，要从基型中找到共性元素，形成系列群体。共性可以来自风格情调、造型表现、点线面构成、面料、色彩、装饰手法等。\n\n群体衍生方法：\n\n1. **特征相似法**——运用与基型相同或相似的特征进行群体设计。例如基型是 A 型，群体也采用 A 型；基型有渐变面料色彩，群体也延续渐变特征。变化可体现在位置、大小、色相、纯度、方向上。\n2. **内容加减法**——对基型的装饰、点线面、色彩等内容进行增加或减少。例如拉链数量增加或减少，扇形结构从袖口转移到领口、下摆并改变层次。\n3. **形态移位法**——把基型形态通过移位、旋转等方式转用到其他部位。例如领口 V 型转移到袖口、下摆或服饰品上。\n\n##### 2. 个体的完整\n\n**个体完整**——系列中每一套单独服装也要完整协调。它不仅包括服装本身，也包括服装与服饰品、外衣与内衣、妆容、鞋包等的配套。\n\n个体完整遵循统一与对比：\n\n1. **统一**——点、线、面、形态、色彩之间有整体感，不零碎、不杂乱。可通过相同形态、相同色彩或相似结构呼应。\n2. **对比**——形态、面料、色彩、装饰存在差异，使单套服装有变化和亮点。\n\n设计判断：没有对比会呆板，过度对比会破坏整体。优秀单套设计是在统一中有变化。\n\n##### 3. 整体的完善\n\n**整体完善**——在数量完成后，从群体效果上继续调整共性与个性。系列不是套数够了就完成，还要看整体质量和视觉一致性。\n\n如果共性过多，系列会呆板，需要增加变化。例如持续使用 A 型短裙，可把 A 型特征转移到裙口、上衣衣摆或长度变化上。\n\n如果个性过多，系列会散乱，需要加强统一。例如只有面料和色彩一致，但造型结构完全无关，就应增加共同款式形态、装饰或结构元素。\n\n#### 四、系列服饰品的配套设计\n\n**服饰品**——广义可指服装和服饰品，狭义指除服装外的鞋、帽、包、腰带、首饰等。系列服装中的服饰品不是附属品，而是整体效果的一部分。\n\n服饰品作用：\n\n1. **造型作用**——服饰品也由点、线、面构成，应与系列服装造型相同或相似。晚礼服应配精致小巧的手包，而不宜配过于宽大休闲的包。\n2. **色彩作用**——服饰品与服装同色，可形成延伸和统一；与服装对比，可增加丰富、生动效果。\n3. **风格作用**——服饰品风格直接影响整体。休闲运动系列应配运动帽、休闲包、运动鞋或休闲鞋。\n\n#### 五、服饰品来源\n\n系列服饰品来源有四种：\n\n1. **选购**——市场直接购买，快捷方便，但契合度和个性不足。\n2. **自制**——按主题和风格制作，创意和协调性强，但工艺质量和材料可能受限。\n3. **替代**——用非服饰品替代，效果新颖独特，但获取和功能属性可能受限制。\n4. **改制**——在选购或替代基础上改造，灵活性强，但技术难度和最终效果不稳定。\n\n#### 项目七训练清单\n\n1. 能否说明系列与系列服装的区别？\n2. 能否用数量、共性、个性判断一个系列是否成立？\n3. 能否区分单品系列、造型系列、结构系列、色彩系列、面料系列、工艺系列、图案系列？\n4. 能否从一个主题提炼基型？\n5. 能否用特征相似法、内容加减法、形态移位法各做一组系列草图？\n6. 能否为一个系列设计鞋、包、帽、首饰等配套服饰品？\n\n---"
    },

      "body": "- **服装**——广义包括衣服和服饰品，狭义主要指上装和下装。\n- **时装**——特定时期流行、具有时间性、流行性和新颖性的服装。\n- **服装设计**——把设计构思通过裁剪、工艺、造型等手段转化为服装形象的过程。\n- **造型**——创造立体形象的过程和结果。\n- **廓型**——服装外部轮廓，如 A 型、H 型、X 型、T 型。\n- **内造型 / 款式结构**——服装内部结构和细节，如分割线、省道、衣领、衣袖。\n- **色相**——颜色相貌。\n- **明度**——颜色明暗程度。\n- **纯度**——颜色鲜艳、纯净程度。\n- **面料再造**——对现成面料进行二次加工，使其产生新肌理和表现力。\n- **点**——服装中相对于整体较小的视觉元素，如纽扣、胸针、局部图案。\n- **线**——服装中的分割、装饰、轮廓和缝合方向。\n- **面**——服装中具有面积感的块面和裁片。\n- **形式美法则**——组织服装美感的规律，如对称、均衡、对比、节奏、分割、呼应、强调。\n- **结构线**——承担衣片连接和立体成型作用的线。\n- **装饰线**——丰富款式细节、增强视觉效果的线。\n- **省道**——收去平面衣料多余量，使衣片贴合人体曲面的结构手段。\n- **褶**——自然、不规则的褶皱。\n- **裥**——人为确定尺寸、方向和长短的规则褶皱。\n- **主色**——服装整体中面积最大、决定基调的色彩。\n- **搭配色**——辅助主色、丰富层次的色彩。\n- **点缀色**——面积最小、用于平衡和强调的色彩。\n- **流行色**——特定时间和区域内时兴的色彩。\n- **常用色**——适用面广、持续时间长、稳定性强的色彩。\n- **织造设计**——在面料生产阶段完成的面料设计。\n- **定制面料**——按具体款式和设计需求生产的面料。\n- **增型设计**——在面料上增加艺术形态的再造方式。\n- **减型设计**——通过镂空、破洞等削减结构的再造方式。\n- **立体型设计**——通过收褶、填充、堆积等制造立体肌理。\n- **系列服装**——具有共同联系因素且各有个性的服装群体。\n- **基型**——系列中最能代表主题的核心款式。\n- **特征相似法**——用相似特征从基型衍生系列款式。\n- **内容加减法**——增减基型中的装饰、结构、色彩等内容。\n- **形态移位法**——把基型特征转移到其他部位或服饰品上。\n\n---"

function renderSidebar(){const books=db.notes.filter(n=>level(n)==='book');let html='<div class="group"><h3 class="group-title">我的知识库</h3><button class="side-link" id="newNote">＋ 新建笔记</button></div>';for(const book of books){const chapters=db.notes.filter(n=>level(n)==='chapter'&&n.title.startsWith(book.title+' / '));const collapsed=collapsedBooks.has(book.id);html+='<div class="group"><button class="group-title book-toggle" data-book="'+book.id+'"><span>'+(collapsed?'▸':'▾')+'</span> '+esc(shortTitle(book))+'</button>';if(!collapsed){html+='<button class="side-link '+(current===book.id?'active ':'')+'" data-id="'+book.id+'">'+esc(shortTitle(book))+'</button>';for(const ch of chapters)html+='<button class="side-link child '+(current===ch.id?'active ':'')+'" data-id="'+ch.id+'">'+esc(shortTitle(ch))+'</button>'}html+='</div>'}html+='<div class="group"><h3 class="group-title">工具</h3><button class="side-link" id="import">⇧ 导入 Markdown</button><button class="side-link" id="export">⇩ 导出当前笔记</button></div>';$('#sidebar').innerHTML=html;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{current=b.dataset.id;render()});document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{const id=b.dataset.book;collapsedBooks.has(id)?collapsedBooks.delete(id):collapsedBooks.add(id);renderSidebar()});$('#newNote').onclick=()=>openForm();$('#import').onclick=()=>alert('下一步可接入 Markdown 文件导入');$('#export').onclick=exportNote}
function renderEmptySection(name){$('#sidebar').innerHTML='<div class="group"><h3 class="group-title">'+esc(name)+'</h3><button class="side-link" id="newNote">＋ 新建笔记</button></div><div class="group"><p style="color:var(--muted);line-height:1.7">这个栏目还没有笔记。你可以先创建第一篇，后续内容会保存在 GitHub 仓库。</p></div>';$('#article').innerHTML='<div class="crumb">入门　/　<span>'+esc(name)+'</span></div><h1>'+esc(name)+'</h1><p class="summary">这是你的 '+esc(name)+' 栏目。</p><div class="notice">这个栏目目前还没有内容。点击“新建笔记”开始添加，后续笔记会归入这里。</div><div class="tools"><button class="tool primary" id="emptyNew">＋ 新建笔记</button></div>';$('#tocLinks').innerHTML='';$('#sync').textContent='GitHub：未连接';$('#newNote').onclick=()=>openForm();$('#emptyNew').onclick=()=>openForm()}
function render(){if(activeSection!=='入门'){renderEmptySection(activeSection);return}let selected=db.notes.find(x=>x.id===current)||db.notes[0];const root=pageRoot(selected);if(!root)return;current=root.id;renderSidebar();const descendants=childrenOf(root);let article='<div class="crumb">入门　/　<span>'+esc(level(root)==='book'?'知识库':level(root)==='chapter'?'页面':'小节')+'</span></div><h1>'+esc(shortTitle(root))+'</h1><p class="summary">'+esc(root.title.includes('设计艺术学概论')?'记录设计理论、服饰设计与创作方法的系统知识。':'服装设计笔记与个人研究记录。')+'</p><div class="meta"><span class="version">'+esc(level(root).toUpperCase())+'</span><span>更新于 '+new Date(root.updatedAt||Date.now()).toLocaleDateString('zh-CN')+'</span></div><div class="tools"><button class="tool" id="copy">▣ 复制页面</button><button class="tool" id="edit">编辑笔记</button><button class="tool" id="delete">删除</button></div>';if(root.body)article+=highlight(renderMd(root.body));for(const n of descendants){const l=level(n);if(l==='chapter'||l==='section')article+='<h2>'+esc(shortTitle(n))+'</h2>';else article+='<h3>'+esc(shortTitle(n))+'</h3>';if(n.body)article+=highlight(renderMd(n.body))}$('#article').innerHTML=article;const hs=[...$('#article').querySelectorAll('h2,h3')];$('#tocLinks').innerHTML=hs.map((h,i)=>{h.id='section-'+i;return '<a class="level-'+(h.tagName==='H2'?1:2)+'" href="#section-'+i+'">'+esc(h.textContent)+'</a>'}).join('');document.querySelectorAll('#tocLinks a').forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth',block:'start'})});$('#copy').onclick=()=>navigator.clipboard?.writeText([root.body,...descendants.map(n=>n.title+'\n'+n.body)].join('\n\n'));$('#edit').onclick=()=>openForm(root);$('#delete').onclick=()=>remove(root)}
function openForm(n){editing=n||null;$('#formTitle').textContent=n?'编辑笔记':'新建笔记';$('#title').value=n?.title||'';$('#body').value=n?.body||'';$('#tags').value=n?.tags?.join(', ')||'';$('#modal').classList.add('open')}function closeForm(){$('#modal').classList.remove('open');editing=null}$('#cancel').onclick=closeForm;$('#form').onsubmit=async e=>{e.preventDefault();const n={id:editing?.id||crypto.randomUUID(),title:$('#title').value.trim(),body:$('#body').value,tags:$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean),updatedAt:new Date().toISOString()};const i=db.notes.findIndex(x=>x.id===n.id);i<0?db.notes.unshift(n):db.notes[i]=n;current=n.id;render();closeForm();if(github)await push()};function remove(n){if(confirm('确定删除这篇笔记吗？')){db.notes=db.notes.filter(x=>x.id!==n.id);current=db.notes[0]?.id;render();if(github)push()}}function exportNote(){const n=db.notes.find(x=>x.id===current),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['# '+n.title+'\n\n'+n.body],{type:'text/markdown'}));a.download=n.title+'.md';a.click()}$('#search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('[data-id]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q))};$('#mobileMenu').onclick=()=>$('#toc').classList.toggle('open');$('#tocToggle').onclick=()=>{if(window.innerWidth<=800)$('#toc').classList.remove('open');else window.scrollTo({top:0,behavior:'smooth'})};async function api(path,opt={}){const r=await fetch('https://api.github.com/repos/studio2002/fashion-design-notes/contents/'+path,{...opt,headers:{Authorization:'Bearer '+github.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});if(!r.ok)throw Error(await r.text());return r.json()}async function push(){try{let old=await api('data/notes.json');await api('data/notes.json',{method:'PUT',body:JSON.stringify({message:'更新服装设计笔记',content:btoa(unescape(encodeURIComponent(JSON.stringify(db,null,2)))),sha:old.sha})});$('#sync').textContent='GitHub：已同步'}catch(e){$('#sync').textContent='GitHub：同步失败'}}$('#connect').onclick=async()=>{const token=prompt('请输入 GitHub Token（只保存在当前页面内存）');if(!token)return;github={token};try{const x=await api('data/notes.json');db=JSON.parse(decodeURIComponent(escape(atob(x.content.replace(/\n/g,'')))));current=db.notes[0].id;render();$('#sync').textContent='GitHub：已连接'}catch(e){$('#sync').textContent='GitHub：连接失败'}};document.querySelectorAll('.global-nav button').forEach(b=>b.onclick=()=>{activeSection=b.textContent.trim();document.querySelectorAll('.global-nav button').forEach(x=>x.classList.toggle('active',x===b));render()});render();</script><style>.sidebar .book-toggle{display:flex;align-items:center;gap:5px;width:100%;border:0;background:none;text-align:left;color:#292622;padding:0;margin:0 0 15px;font:inherit;font-size:16px;font-weight:750}.sidebar .side-link{border:0!important;background:none!important;box-shadow:none!important;border-radius:0!important;text-align:left!important;color:#55534e!important;padding:9px 11px!important;margin:2px 0!important;font-size:15px!important}.sidebar .side-link:hover{background:#f0efeb!important}.sidebar .side-link.active{background:#e7e6e1!important;border-radius:13px!important;color:#1c1b19!important;font-weight:750}.sidebar .side-link.child{padding-left:25px!important;font-size:15px!important;border-radius:13px!important}.sidebar .book-toggle:hover{color:#292622}<style>.sidebar .side-link.child.active{background:#e7e6e1!important;border-radius:13px!important;color:#1c1b19!important;font-weight:750!important}</style></body></html>
