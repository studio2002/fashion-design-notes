const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db=window.NOTES_DATA||{notes:[]},current=db.notes[0]?.id||'',github=null,editing=null,activeSection='入门',collapsedBooks=new Set((db.notes.filter(n=>n.tags?.[0]==='book').slice(1)).map(n=>n.id));function renderMd(s,splitNumbered=false){let out=esc(s).replace(/^##### (.*)$/gm,'<h5>$1</h5>').replace(/^#### (.*)$/gm,'<h4>$1</h4>').replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^---$/gm,'<hr>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h2>$1</h2>').replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`(.*?)`/g,'<code>$1</code>').replace(/\n(?=\s*\d+\.\s)/g,splitNumbered?'</p><p class="numbered-item">':'<br><br>').replace(/\n\n/g,'</p><p>');return '<p>'+out+'</p>'}function highlight(html){return html.replace(/<p>([^<]{0,180}(?:概念|原则|核心|定义|特点|特征|作用|分类|方法|前提|含义|要点)[^<]*)<\/p>/g,'<div class=\"highlight\"><span class=\"highlight-text\">$1</span></div>')}function level(n){return n.tags?.[0]||'point'}
function shortTitle(n){return n.title.split(' / ').pop()}
function childrenOf(root){const prefix=root.title+' / ';return db.notes.filter(n=>n.title.startsWith(prefix))}
function pageRoot(n){if(level(n)!=='point')return n;const parts=n.title.split(' / ');return db.notes.find(x=>x.title===parts.slice(0,-1).join(' / '))||n}
function renderSidebar(){const books=db.notes.filter(n=>level(n)==='book');let html='<div class="group"><h3 class="group-title">我的知识库</h3><button class="side-link" id="newNote">＋ 新建笔记</button></div>';for(const book of books){const chapters=db.notes.filter(n=>level(n)==='chapter'&&n.title.startsWith(book.title+' / '));const collapsed=collapsedBooks.has(book.id);html+='<div class="group"><button class="group-title book-toggle" data-book="'+book.id+'"><span>'+(collapsed?'▸':'▾')+'</span> '+esc(shortTitle(book))+'</button>';if(!collapsed){html+='<button class="side-link '+(current===book.id?'active ':'')+'" data-id="'+book.id+'">'+esc(shortTitle(book))+'</button>';for(const ch of chapters)html+='<button class="side-link child '+(current===ch.id?'active ':'')+'" data-id="'+ch.id+'">'+esc(shortTitle(ch))+'</button>'}html+='</div>'}html+='<div class="group"><h3 class="group-title">工具</h3><button class="side-link" id="import">⇧ 导入 Markdown</button><button class="side-link" id="export">⇩ 导出当前笔记</button></div>';$('#sidebar').innerHTML=html;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{current=b.dataset.id;render()});document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{const id=b.dataset.book;collapsedBooks.has(id)?collapsedBooks.delete(id):collapsedBooks.add(id);renderSidebar()});$('#newNote').onclick=()=>openForm();$('#import').onclick=()=>alert('下一步可接入 Markdown 文件导入');$('#export').onclick=exportNote}
function renderEmptySection(name){$('#sidebar').innerHTML='<div class="group"><h3 class="group-title">'+esc(name)+'</h3><button class="side-link" id="newNote">＋ 新建笔记</button></div><div class="group"><p style="color:var(--muted);line-height:1.7">这个栏目还没有笔记。你可以先创建第一篇，后续内容会保存在 GitHub 仓库。</p></div>';$('#article').innerHTML='<div class="crumb">入门　/　<span>'+esc(name)+'</span></div><h1>'+esc(name)+'</h1><p class="summary">这是你的 '+esc(name)+' 栏目。</p><div class="notice">这个栏目目前还没有内容。点击“新建笔记”开始添加，后续笔记会归入这里。</div><div class="tools"><button class="tool primary" id="emptyNew">＋ 新建笔记</button></div>';$('#tocLinks').innerHTML='';$('#sync').textContent='GitHub：未连接';$('#newNote').onclick=()=>openForm();$('#emptyNew').onclick=()=>openForm()}
function render(){if(activeSection!=='入门'){renderEmptySection(activeSection);return}let selected=db.notes.find(x=>x.id===current)||db.notes[0];const root=pageRoot(selected);if(!root)return;current=root.id;renderSidebar();const compactBook5=root.id.startsWith('book5');$('#article').classList.toggle('book5-compact',compactBook5);const descendants=childrenOf(root);let article='<div class="crumb">入门　/　<span>'+esc(level(root)==='book'?'知识库':level(root)==='chapter'?'页面':'小节')+'</span></div><h1>'+esc(shortTitle(root))+'</h1><p class="summary">'+esc(root.title.includes('设计艺术学概论')?'记录设计理论、服饰设计与创作方法的系统知识。':'服装设计笔记与个人研究记录。')+'</p><div class="meta"><span class="version">'+esc(level(root).toUpperCase())+'</span><span>更新于 '+new Date(root.updatedAt||Date.now()).toLocaleDateString('zh-CN')+'</span></div><div class="tools"><button class="tool" id="copy">▣ 复制页面</button><button class="tool" id="edit">编辑笔记</button><button class="tool" id="delete">删除</button></div>';if(root.body)article+=highlight(renderMd(root.body,root.id==='pt1'||compactBook5));for(const n of descendants){const l=level(n);if(l==='chapter'||l==='section')article+='<h2>'+esc(shortTitle(n))+'</h2>';else article+='<h3>'+esc(shortTitle(n))+'</h3>';if(n.body)article+=highlight(renderMd(n.body,n.id==='pt1'||compactBook5))}$('#article').innerHTML=article;const hs=[...$('#article').querySelectorAll('h2,h3,h4,h5')];$('#tocLinks').innerHTML=hs.map((h,i)=>{h.id='section-'+i;const tocLevel=h.tagName==='H2'?1:h.tagName==='H3'?2:h.tagName==='H4'?3:4;return '<a class="level-'+tocLevel+'" href="#section-'+i+'">'+esc(h.textContent)+'</a>'}).join('');document.querySelectorAll('#tocLinks a').forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth',block:'start'})});$('#copy').onclick=()=>navigator.clipboard?.writeText([root.body,...descendants.map(n=>n.title+'\n'+n.body)].join('\n\n'));$('#edit').onclick=()=>openForm(root);$('#delete').onclick=()=>remove(root)}
function openForm(n){editing=n||null;$('#formTitle').textContent=n?'编辑笔记':'新建笔记';$('#title').value=n?.title||'';$('#body').value=n?.body||'';$('#tags').value=n?.tags?.join(', ')||'';$('#modal').classList.add('open')}function closeForm(){$('#modal').classList.remove('open');editing=null}$('#cancel').onclick=closeForm;$('#form').onsubmit=async e=>{e.preventDefault();const n={id:editing?.id||crypto.randomUUID(),title:$('#title').value.trim(),body:$('#body').value,tags:$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean),updatedAt:new Date().toISOString()};const i=db.notes.findIndex(x=>x.id===n.id);i<0?db.notes.unshift(n):db.notes[i]=n;current=n.id;render();closeForm();if(github)await push()};function remove(n){if(confirm('确定删除这篇笔记吗？')){db.notes=db.notes.filter(x=>x.id!==n.id);current=db.notes[0]?.id;render();if(github)push()}}function exportNote(){const n=db.notes.find(x=>x.id===current),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['# '+n.title+'\n\n'+n.body],{type:'text/markdown'}));a.download=n.title+'.md';a.click()}$('#search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('[data-id]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q))};$('#mobileMenu').onclick=()=>$('#toc').classList.toggle('open');$('#tocToggle').onclick=()=>{if(window.innerWidth<=800)$('#toc').classList.remove('open');else window.scrollTo({top:0,behavior:'smooth'})};async function api(path,opt={}){const r=await fetch('https://api.github.com/repos/studio2002/fashion-design-notes/contents/'+path,{...opt,headers:{Authorization:'Bearer '+github.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});if(!r.ok)throw Error(await r.text());return r.json()}async function push(){try{let old=await api('data/notes.json');await api('data/notes.json',{method:'PUT',body:JSON.stringify({message:'更新服装设计笔记',content:btoa(unescape(encodeURIComponent(JSON.stringify(db,null,2)))),sha:old.sha})});$('#sync').textContent='GitHub：已同步'}catch(e){$('#sync').textContent='GitHub：同步失败'}}$('#connect').onclick=async()=>{const token=prompt('请输入 GitHub Token（只保存在当前页面内存）');if(!token)return;github={token};try{const x=await api('data/notes.json');db=JSON.parse(decodeURIComponent(escape(atob(x.content.replace(/\n/g,'')))));current=db.notes[0].id;render();$('#sync').textContent='GitHub：已连接'}catch(e){$('#sync').textContent='GitHub：连接失败'}};document.querySelectorAll('.global-nav button').forEach(b=>b.onclick=()=>{activeSection=b.textContent.trim();document.querySelectorAll('.global-nav button').forEach(x=>x.classList.toggle('active',x===b));render()});render();</script><style>.sidebar .book-toggle{display:flex;align-items:center;gap:5px;width:100%;border:0;background:none;text-align:left;color:#292622;padding:0;margin:0 0 15px;font:inherit;font-size:16px;font-weight:750}.sidebar .side-link{border:0!important;background:none!important;box-shadow:none!important;border-radius:0!important;text-align:left!important;color:#55534e!important;padding:9px 11px!important;margin:2px 0!important;font-size:15px!important}.sidebar .side-link:hover{background:#f0efeb!important}.sidebar .side-link.active{background:#e7e6e1!important;border-radius:13px!important;color:#1c1b19!important;font-weight:750}.sidebar .side-link.child{padding-left:25px!important;font-size:15px!important;border-radius:13px!important}.sidebar .book-toggle:hover{color:#292622}<style>.sidebar .side-link.child.active{background:#e7e6e1!important;border-radius:13px!important;color:#1c1b19!important;font-weight:750!important}</style><script>(function(){const link=document.getElementById("connect");if(link){link.outerHTML="<a class=\"cta\" id=\"connect\" href=\"https://github.com/studio2002/fashion-design-notes\">查看 GitHub 仓库 ›</a>";}})();</script><style>.cta{text-decoration:none}</style><style>.content p:has(strong){line-height:2.5!important}</style><style>.content p.numbered-item{line-height:1.8!important;margin:7px 0!important}</style></body></html>
