<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服装设计笔记 · Fashion Design Notes</title>
  <style>
    :root{--bg:#fbfbf8;--ink:#24231f;--muted:#77756d;--line:#e7e5de;--blue:#315f9e;--blue-bg:#edf4ff;--orange:#d8744c;--sidebar:236px;--toc:230px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr) var(--toc)}.left{border-right:1px solid var(--line);padding:28px 20px;background:#fafaf6}.brand{display:flex;gap:10px;align-items:center;font-family:Georgia,serif;font-size:20px;font-weight:700;margin:0 0 34px}.mark{color:var(--orange);font-size:28px;line-height:0}.nav-title{font-size:12px;color:var(--muted);margin:24px 0 8px;text-transform:uppercase;letter-spacing:.08em}.tree button,.topnav button{border:0;background:transparent;color:var(--ink);cursor:pointer;text-align:left}.tree button{width:100%;padding:8px 10px;border-radius:6px;font-size:14px}.tree button:hover,.tree .active{background:#eeeee8}.tree .sub{padding-left:24px;color:#5c5a53}.main{min-width:0}.topbar{height:75px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 34px}.topnav{display:flex;gap:18px;align-items:center;white-space:nowrap}.topnav button{font-size:14px}.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:white;padding:10px 14px;width:min(290px,35vw)}.search input{border:0;outline:0;width:100%;background:transparent}.content{max-width:760px;margin:0 auto;padding:58px 48px 100px}.eyebrow{font-size:12px;color:var(--blue);letter-spacing:.1em;text-transform:uppercase}.content h1{font:700 42px/1.15 Georgia,"Noto Serif SC",serif;margin:10px 0 16px}.lead{font-size:18px;line-height:1.75;color:#5c5a53}.notice{margin:28px 0;padding:16px 18px;border:1px solid #c6dbfa;background:var(--blue-bg);border-radius:14px;color:#315f9e;line-height:1.7}.content h2{font:700 29px Georgia,"Noto Serif SC",serif;margin:46px 0 14px}.content h3{font-size:19px;margin:28px 0 8px}.content p,.content li{font-size:16px;line-height:1.9}.content blockquote{margin:20px 0;padding:12px 18px;border-left:3px solid var(--orange);background:#fff8f1;color:#62584d}.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#f1ead9;color:#8b672a;font-size:12px;margin-right:6px}.toc{border-left:1px solid var(--line);padding:95px 22px 20px;position:sticky;top:0;height:100vh}.toc h4{margin:0 0 14px;font-size:13px}.toc a{display:block;color:var(--muted);text-decoration:none;font-size:13px;padding:7px 0}.actions{display:flex;gap:8px;margin:28px 0}.btn{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 13px;cursor:pointer}.btn.primary{background:#24231f;color:white;border-color:#24231f}.status{font-size:12px;color:var(--muted);margin-left:auto}.modal{position:fixed;inset:0;background:#0004;display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{width:min(680px,100%);background:white;border-radius:16px;padding:24px;box-shadow:0 20px 70px #0002}.dialog h2{margin-top:0}.field{display:grid;gap:7px;margin:14px 0}.field input,.field textarea{border:1px solid var(--line);border-radius:8px;padding:10px}.field textarea{min-height:220px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.empty{color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:190px minmax(0,1fr)}.toc{display:none}.topbar{padding:0 20px}.content{padding:40px 28px}.topnav{display:none}}@media(max-width:620px){.app{display:block}.left{border:0;border-bottom:1px solid var(--line);padding:18px}.tree{display:flex;overflow:auto}.tree button{white-space:nowrap;width:auto}.topbar{height:62px}.search{width:100%;margin:0}.content h1{font-size:34px}.content{padding:30px 20px 70px}}
  </style>
</head>
<body>
<div class="app"><aside class="left"><div class="brand"><span class="mark">✳</span>服装设计笔记</div><div class="nav-title">知识库</div><div id="tree" class="tree"></div><div class="nav-title">管理</div><div class="tree"><button id="connectBtn">⚙ 连接 GitHub</button><button id="exportBtn">⇩ 导出当前笔记</button><button id="importBtn">⇧ 导入 Markdown</button><input id="fileInput" type="file" accept=".md,.markdown,.txt" hidden></div></aside><main class="main"><header class="topbar"><nav class="topnav"><button>入门</button><button>灵感</button><button>材料</button><button>工艺</button><button>作品</button></nav><label class="search">⌕<input id="search" placeholder="搜索笔记…" /></label><span id="status" class="status">未连接 GitHub</span></header><article id="article" class="content"></article></main><aside class="toc"><h4>本页</h4><div id="toc"></div></aside></div>
<div id="modal" class="modal"><form id="noteForm" class="dialog"><h2 id="modalTitle">新建笔记</h2><div class="field"><label>标题</label><input id="noteTitle" required /></div><div class="field"><label>正文（支持 Markdown）</label><textarea id="noteBody" placeholder="# 标题\n\n写下你的设计观察、面料记录或灵感。"></textarea></div><div class="field"><label>标签</label><input id="noteTags" placeholder="例如：廓形, 面料, 灵感" /></div><div class="dialog-actions"><button type="button" class="btn" id="cancelBtn">取消</button><button class="btn primary">保存到 GitHub</button></div></form></div>
<script>
const seed={version:1,updatedAt:new Date().toISOString(),notes:[{id:'intro',title:'服装设计笔记',tags:['开始'],body:'# 服装设计笔记\n\n记录关于服装、材料、工艺与视觉语言的长期观察。\n\n> 好的笔记不只是保存信息，也要保留当时的判断与感受。\n\n## 使用方式\n\n从左侧选择笔记，点击“新建笔记”添加内容。支持 Markdown 标题、引用、列表和标签。\n\n## 我的设计原则\n\n- 先观察，再命名。\n- 让材料参与设计，而不是只服从设计。\n- 每一次修改都留下原因。'}]};let db=seed,current='intro',github=null,editing=null;
const $=s=>document.querySelector(s);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(s){let h=esc(s).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`(.*?)`/g,'<code>$1</code>').replace(/\n\n/g,'</p><p>');return '<p>'+h+'</p>'}
function render(){const n=db.notes.find(x=>x.id===current)||db.notes[0];current=n.id;$('#tree').innerHTML=db.notes.map(x=>`<button class="${x.id===current?'active':''}" data-id="${x.id}">${esc(x.title)}</button>`).join('')+'<button id="newBtn" class="sub">＋ 新建笔记</button>';$('#article').innerHTML=`<div class="eyebrow">NOTE · ${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><h1>${esc(n.title)}</h1><div class="lead">记录于 ${new Date(n.updatedAt||Date.now()).toLocaleDateString('zh-CN')}</div><div class="actions"><button class="btn primary" id="editBtn">编辑笔记</button><button class="btn" id="deleteBtn">删除</button></div><div class="notice">✦ 内容会保存为仓库中的 <code>data/notes.json</code>，提交到 GitHub 后即可在不同设备继续使用。</div>${md(n.body)}`;$('#toc').innerHTML=[...$('#article').querySelectorAll('h1,h2,h3')].map((e,i)=>{e.id='h'+i;return `<a href="#h${i}">${esc(e.textContent)}</a>`}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{current=b.dataset.id;render()});$('#newBtn').onclick=()=>openForm();$('#editBtn').onclick=()=>openForm(n);$('#deleteBtn').onclick=()=>remove(n);}
function openForm(n){editing=n||null;$('#modalTitle').textContent=n?'编辑笔记':'新建笔记';$('#noteTitle').value=n?.title||'';$('#noteBody').value=n?.body||'';$('#noteTags').value=n?.tags?.join(', ')||'';$('#modal').classList.add('open')}
function closeForm(){$('#modal').classList.remove('open');editing=null}function saveLocal(n){const i=db.notes.findIndex(x=>x.id===n.id);if(i<0)db.notes.unshift(n);else db.notes[i]=n;current=n.id;render()}
$('#noteForm').onsubmit=async e=>{e.preventDefault();const n={id:editing?.id||crypto.randomUUID(),title:$('#noteTitle').value.trim(),body:$('#noteBody').value,tags:$('#noteTags').value.split(',').map(x=>x.trim()).filter(Boolean),updatedAt:new Date().toISOString()};saveLocal(n);closeForm();if(github)await pushNotes()};$('#cancelBtn').onclick=closeForm;
function remove(n){if(db.notes.length===1)return alert('至少保留一篇笔记');if(confirm('确定删除这篇笔记吗？')){db.notes=db.notes.filter(x=>x.id!==n.id);current=db.notes[0].id;render();if(github)pushNotes()}}
$('#search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#tree [data-id]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q))};$('#exportBtn').onclick=()=>{const n=db.notes.find(x=>x.id===current);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([`# ${n.title}\n\n${n.body}`],{type:'text/markdown'}));a.download=n.title+'.md';a.click()};$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;const text=await f.text();openForm({title:f.name.replace(/\.(md|markdown|txt)$/i,''),body:text,tags:['导入']})};
async function gh(path,opts={}){const r=await fetch('https://api.github.com/repos/'+github.owner+'/'+github.repo+'/contents/'+path,{...opts,headers:{Authorization:'Bearer '+github.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});if(!r.ok)throw new Error(await r.text());return r.json()}
async function pushNotes(){if(!github)return;try{let old;try{old=await gh('data/notes.json')}catch(e){}const content=btoa(unescape(encodeURIComponent(JSON.stringify(db,null,2))));await gh('data/notes.json',{method:'PUT',body:JSON.stringify({message:'更新服装设计笔记',content,sha:old?.sha})});$('#status').textContent='已同步 GitHub'}catch(e){$('#status').textContent='同步失败';alert('GitHub 保存失败：'+e.message)}}
$('#connectBtn').onclick=async()=>{const owner=prompt('GitHub 用户名或组织名');if(!owner)return;const repo=prompt('仓库名');if(!repo)return;const token=prompt('GitHub Token（需要 repo 内容读写权限，仅保存在当前页面内存）');if(!token)return;github={owner,repo,token};try{const x=await gh('data/notes.json');db=JSON.parse(decodeURIComponent(escape(atob(x.content.replace(/\n/g,'')))));render();$('#status').textContent='已连接 GitHub'}catch(e){$('#status').textContent='已连接，尚未读取到笔记';await pushNotes()}};
fetch('data/notes.json').then(r=>r.ok?r.json():Promise.reject()).then(x=>{if(x.notes?.length){db=x;current=x.notes[0].id;render()}}).catch(()=>render());
</script></body></html>
