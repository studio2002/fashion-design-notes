<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服装设计笔记 · Fashion Design Notes</title><style>
:root{--paper:#fbfbf8;--ink:#242321;--muted:#706e68;--line:#e7e5de;--soft:#efeee9;--accent:#d97854;--blue:#315f9e;--side:265px;--right:255px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}.site-header{border-bottom:1px solid var(--line);background:#fcfcf9;position:sticky;top:0;z-index:5}.utility{height:76px;display:flex;align-items:center;gap:26px;padding:0 48px}.logo{display:flex;align-items:center;gap:11px;font:700 25px Georgia,serif;white-space:nowrap}.logo-mark{color:var(--accent);font-size:37px;line-height:0}.language{border:0;background:none;font-weight:600;color:#373632}.search{margin-left:auto;width:min(330px,30vw);height:44px;border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;color:var(--muted)}.search input{border:0;outline:0;background:transparent;width:100%;font-size:15px}.ask{border:1px solid var(--line);border-radius:13px;background:#fff;padding:11px 16px;color:#56544e}.platform{margin-left:auto;color:#55524c}.cta{border:0;border-radius:12px;background:#1f1f1d;color:#fff;padding:12px 18px;font-weight:700}.global-nav{display:flex;gap:30px;height:54px;align-items:end;padding:0 48px}.global-nav button{border:0;background:none;height:54px;padding:0 0 17px;color:#55534e;font-weight:600;position:relative}.global-nav button.active{color:var(--ink)}.global-nav button.active:after{content:"";position:absolute;height:2px;background:var(--ink);bottom:0;left:0;right:0}.layout{display:grid;grid-template-columns:var(--side) minmax(0,1fr) var(--right);max-width:1500px;margin:0 auto}.sidebar{padding:65px 28px 60px 48px}.group{margin:0 0 34px}.group-title{font-size:16px;font-weight:750;margin:0 0 15px}.side-link{display:block;width:100%;border:0;background:none;text-align:left;color:#55534e;padding:9px 11px;border-radius:13px;margin:2px 0;font-size:15px}.side-link:hover{background:#f0efeb}.side-link.active{background:#e7e6e1;color:#1c1b19;font-weight:750}.side-link.child{padding-left:25px;font-size:14px}.main{min-width:0;padding:66px 72px 120px;max-width:900px}.crumb{font-size:14px;color:var(--muted);margin-bottom:22px}.crumb span{color:var(--ink)}h1{font:700 clamp(38px,4vw,64px)/1.05 Georgia,"Noto Serif SC",serif;letter-spacing:-.03em;margin:0 0 20px}.summary{font-size:20px;line-height:1.65;color:#56534e;margin:0 0 34px}.meta{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:14px;margin:0 0 32px}.version{background:#e7e6e1;color:#34332f;border-radius:10px;padding:7px 11px;font-weight:700}.tools{display:flex;gap:10px;margin-bottom:34px}.tool{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;color:#45433f}.primary{background:#242321;color:#fff;border-color:#242321}.notice{border:1px solid #c6dbfa;background:#eef5ff;color:#315f9e;border-radius:14px;padding:16px 18px;line-height:1.7;margin:28px 0 38px}.content h2{font:700 31px/1.25 Georgia,"Noto Serif SC",serif;margin:52px 0 16px;border-top:1px solid var(--line);padding-top:25px}.content h3{font-size:20px;margin:30px 0 10px}.content p,.content li{font-size:17px;line-height:1.65;color:#373532}.content p{margin:13px 0}.content li{margin:2px 0}.highlight{margin:18px 0;padding:14px 18px;border:1px solid #c6dbfa;background:#eef5ff;border-radius:12px;color:#d06b45;font-weight:650;line-height:1.65}.content ul{padding-left:25px}.content li{margin:5px 0}.content blockquote{margin:24px 0;padding:15px 20px;border-left:3px solid var(--accent);background:#fff8f1;color:#5d5249}.content code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:#f0efeb;border-radius:6px;padding:3px 6px}.content a{color:#1e4c88;text-decoration:underline;text-underline-offset:3px}.toc{border-left:1px solid var(--line);padding:85px 28px 30px 25px;position:sticky;top:130px;height:calc(100vh - 130px);overflow:auto}.toc-title{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:15px}.toc-toggle{border:1px solid var(--line);background:#fff;border-radius:50%;width:34px;height:34px}.toc a{display:block;text-decoration:none;color:#68655e;font-size:14px;padding:8px 0;line-height:1.35}.toc a.level-1{color:var(--ink);font-weight:700}.sync{font-size:12px;color:var(--muted);margin-top:30px}.modal{display:none;position:fixed;inset:0;background:#0004;place-items:center;padding:20px;z-index:10}.modal.open{display:grid}.dialog{width:min(700px,100%);background:#fff;border-radius:18px;padding:25px;box-shadow:0 20px 70px #0003}.dialog h2{margin-top:0}.field{display:grid;gap:7px;margin:15px 0}.field input,.field textarea{border:1px solid var(--line);border-radius:9px;padding:11px}.field textarea{min-height:240px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px}.mobile-menu{display:none}@media(max-width:1100px){:root{--side:220px;--right:210px}.utility{padding:0 25px}.global-nav{padding:0 25px}.sidebar{padding-left:25px}.main{padding-left:42px;padding-right:42px}}@media(max-width:800px){.utility{height:65px;padding:0 18px}.logo{font-size:20px}.language,.ask,.platform,.cta{display:none}.search{width:100%;margin-left:auto}.global-nav{overflow:auto;padding:0 18px;gap:23px}.layout{display:block}.sidebar{display:none}.main{padding:40px 22px 80px}.toc{position:fixed;display:none;right:0;top:65px;height:calc(100vh - 65px);width:270px;background:var(--paper);z-index:4;box-shadow:-10px 0 30px #0001}.toc.open{display:block}.mobile-menu{display:block;position:fixed;right:18px;bottom:18px;z-index:6;border:0;background:#242321;color:#fff;border-radius:50%;width:48px;height:48px}.content h2{font-size:27px}}
</style></head><body><header class="site-header"><div class="utility"><div class="logo"><span class="logo-mark">✳</span>服装设计笔记</div><button class="language">中文⌄</button><label class="search">⌕<input id="search" placeholder="搜索笔记…"></label><button class="ask">✦ 询问助手</button><span class="platform">Fashion Design Notes</span><button class="cta" id="connect">连接 GitHub ›</button></div><nav class="global-nav"><button class="active">入门</button><button>设计基础</button><button>服装设计</button><button>材料与工艺</button><button>灵感资料</button><button>作品记录</button><button>资源</button></nav></header><div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="main"><div id="article" class="content"></div></main><aside class="toc" id="toc"><div class="toc-title"><button class="toc-toggle" id="tocToggle">‹</button><strong>本页</strong></div><div id="tocLinks"></div><div class="sync" id="sync">GitHub：未连接</div></aside></div><button class="mobile-menu" id="mobileMenu">☰</button><div class="modal" id="modal"><form class="dialog" id="form"><h2 id="formTitle">新建笔记</h2><div class="field"><label>标题</label><input id="title" required></div><div class="field"><label>正文（Markdown）</label><textarea id="body"></textarea></div><div class="field"><label>标签</label><input id="tags" placeholder="设计, 面料, 灵感"></div><div class="dialog-actions"><button type="button" class="tool" id="cancel">取消</button><button class="tool primary">保存到 GitHub</button></div></form></div><script src="data/notes.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db=window.NOTES_DATA||{notes:[]},current=db.notes[0]?.id||'',github=null,editing=null;function renderMd(s){let out=esc(s).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h2>$1</h2>').replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`(.*?)`/g,'<code>$1</code>').replace(/\n\n/g,'</p><p>');return '<p>'+out+'</p>'}function level(n){return n.tags?.[0]||'point'}
function shortTitle(n){return n.title.split(' / ').pop()}
function childrenOf(root){const prefix=root.title+' / ';return db.notes.filter(n=>n.title.startsWith(prefix))}
function pageRoot(n){if(level(n)!=='point')return n;const parts=n.title.split(' / ');return db.notes.find(x=>x.title===parts.slice(0,-1).join(' / '))||n}
function renderSidebar(){const book=db.notes.find(n=>level(n)==='book')||db.notes[0];const chapters=db.notes.filter(n=>level(n)==='chapter');let html='<div class="group"><h3 class="group-title">我的知识库</h3><button class="side-link" id="newNote">＋ 新建笔记</button></div>';if(book){html+='<div class="group"><h3 class="group-title">'+esc(shortTitle(book))+'</h3><button class="side-link '+(current===book.id?'active ':'')+'" data-id="'+book.id+'">'+esc(shortTitle(book))+'</button>';for(const ch of chapters){html+='<button class="side-link child '+(current===ch.id?'active ':'')+'" data-id="'+ch.id+'">'+esc(shortTitle(ch))+'</button>';}html+='</div>'}html+='<div class="group"><h3 class="group-title">工具</h3><button class="side-link" id="import">⇧ 导入 Markdown</button><button class="side-link" id="export">⇩ 导出当前笔记</button></div>';$('#sidebar').innerHTML=html;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{current=b.dataset.id;render()});$('#newNote').onclick=()=>openForm();$('#import').onclick=()=>alert('下一步可接入 Markdown 文件导入');$('#export').onclick=exportNote}
function render(){let selected=db.notes.find(x=>x.id===current)||db.notes[0];const root=pageRoot(selected);if(!root)return;current=root.id;renderSidebar();const descendants=childrenOf(root);let article='<div class="crumb">入门　/　<span>'+esc(level(root)==='book'?'知识库':level(root)==='chapter'?'页面':'小节')+'</span></div><h1>'+esc(shortTitle(root))+'</h1><p class="summary">'+esc(root.title.includes('设计艺术学概论')?'记录设计理论、服饰设计与创作方法的系统知识。':'服装设计笔记与个人研究记录。')+'</p><div class="meta"><span class="version">'+esc(level(root).toUpperCase())+'</span><span>更新于 '+new Date(root.updatedAt||Date.now()).toLocaleDateString('zh-CN')+'</span></div><div class="tools"><button class="tool" id="copy">▣ 复制页面</button><button class="tool" id="edit">编辑笔记</button><button class="tool" id="delete">删除</button></div>';if(root.body)article+=highlight(renderMd(root.body));for(const n of descendants){const l=level(n);if(l==='chapter'||l==='section')article+='<h2>'+esc(shortTitle(n))+'</h2>';else article+='<h3>'+esc(shortTitle(n))+'</h3>';if(n.body)article+=highlight(renderMd(n.body))}$('#article').innerHTML=article;const hs=[...$('#article').querySelectorAll('h2,h3')];$('#tocLinks').innerHTML=hs.map((h,i)=>{h.id='section-'+i;return '<a class="level-'+(h.tagName==='H2'?1:2)+'" href="#section-'+i+'">'+esc(h.textContent)+'</a>'}).join('');document.querySelectorAll('#tocLinks a').forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth',block:'start'})});$('#copy').onclick=()=>navigator.clipboard?.writeText([root.body,...descendants.map(n=>n.title+'\n'+n.body)].join('\n\n'));$('#edit').onclick=()=>openForm(root);$('#delete').onclick=()=>remove(root)}
function openForm(n){editing=n||null;$('#formTitle').textContent=n?'编辑笔记':'新建笔记';$('#title').value=n?.title||'';$('#body').value=n?.body||'';$('#tags').value=n?.tags?.join(', ')||'';$('#modal').classList.add('open')}function closeForm(){$('#modal').classList.remove('open');editing=null}$('#cancel').onclick=closeForm;$('#form').onsubmit=async e=>{e.preventDefault();const n={id:editing?.id||crypto.randomUUID(),title:$('#title').value.trim(),body:$('#body').value,tags:$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean),updatedAt:new Date().toISOString()};const i=db.notes.findIndex(x=>x.id===n.id);i<0?db.notes.unshift(n):db.notes[i]=n;current=n.id;render();closeForm();if(github)await push()};function remove(n){if(confirm('确定删除这篇笔记吗？')){db.notes=db.notes.filter(x=>x.id!==n.id);current=db.notes[0]?.id;render();if(github)push()}}function exportNote(){const n=db.notes.find(x=>x.id===current),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['# '+n.title+'\n\n'+n.body],{type:'text/markdown'}));a.download=n.title+'.md';a.click()}$('#search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('[data-id]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q))};$('#mobileMenu').onclick=()=>$('#toc').classList.toggle('open');$('#tocToggle').onclick=()=>{if(window.innerWidth<=800)$('#toc').classList.remove('open');else window.scrollTo({top:0,behavior:'smooth'})};async function api(path,opt={}){const r=await fetch('https://api.github.com/repos/studio2002/fashion-design-notes/contents/'+path,{...opt,headers:{Authorization:'Bearer '+github.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});if(!r.ok)throw Error(await r.text());return r.json()}async function push(){try{let old=await api('data/notes.json');await api('data/notes.json',{method:'PUT',body:JSON.stringify({message:'更新服装设计笔记',content:btoa(unescape(encodeURIComponent(JSON.stringify(db,null,2)))),sha:old.sha})});$('#sync').textContent='GitHub：已同步'}catch(e){$('#sync').textContent='GitHub：同步失败'}}$('#connect').onclick=async()=>{const token=prompt('请输入 GitHub Token（只保存在当前页面内存）');if(!token)return;github={token};try{const x=await api('data/notes.json');db=JSON.parse(decodeURIComponent(escape(atob(x.content.replace(/\n/g,'')))));current=db.notes[0].id;render();$('#sync').textContent='GitHub：已连接'}catch(e){$('#sync').textContent='GitHub：连接失败'}};render();</script></body></html>
