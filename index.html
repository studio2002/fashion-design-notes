    {

    {
      "id": "pt1",
      "title": "设计艺术学概论 / 第一章 导论 / 第一节 设计艺术的基本概念 / 一、设计艺术的含义",
      "tags": [
        "point"
      ],
      "body": "- \"设计\"(design)在不同学科含义不同:哲学中是\"从现存事实转向未来可能的想象跃进\";心理学是\"针对问题的求解活动\";经济学是\"面临不确定性情形下,失误代价极高的决策\";文化学中是一种社会文化活动,兼具创造性(类艺术)与理性(类逻辑科学)双重属性。\n- \"艺术\"含义追溯:艺术是人类按照美的规律创造世界、也按照美的规律创造自身实践活动的目的性活动;古希腊文与英文中\"艺术\"也含\"技巧、手段\"之意;中国古汉语\"艺\"亦有技巧才能之意(如\"六艺\":礼、乐、射、御、书、数)。\n- 设计艺术的概念可概括为三层含义:\n  1. **前期设想/发明/计划**——造物活动前的构思、设计规划(与\"设计学概论\"中\"设计即运筹、计划\"观点一致);\n  2. **抽象设计的具象化实现**——按计划将造物的结构、材料、技术等构成因素落实为具体人造物;\n  3. **艺术化的设计**——以\"艺术\"限定\"设计\"的活动,强调视觉效果与审美价值,要求设计师具备较高的艺术训练。\n- 中国\"设计\"相关术语流变:\"图案\"一词1904年由日本传入并首次在中国出版使用;20-30年代\"图案\"\"工艺图案\"流行;1956年中央工艺美院成立后\"工艺美术\"成为主流称谓;1998年国务院学位委员会将\"工艺美术\"调整为\"艺术设计\";当前\"艺术设计\"与\"设计艺术\"两词并用,称谓变化反映了学科现实需要与发展方向的变化。"
    },
    {
      "id": "pt2",
      "title": "设计艺术学概论 / 第一章 导论 / 第一节 设计艺术的基本概念 / 二、设计艺术的前提条件",
      "tags": [
        "point"
      ],
      "body": "(一)设计艺术与材料\n- 材料是设计艺术发展的物质基础,材料史与工艺美术史(石器、陶器、青铜器、铁器、木材等)相伴而行,材料的可加工性直接决定造物形态。\n- 20世纪合成材料、塑料、玻璃钢、纤维材料等新材料的出现,推动包豪斯等现代设计运动及现代主义设计风格的形成。\n- 材料革命对设计的影响可概括三方面:①改变人类文化生产方式;②促使社会结构发生变化;③催生新的材料审美意识(如极简外观、\"包豪斯\"式风格与材料工艺表现直接相关)。\n\n(二)设计艺术与技术\n- 艺术偏重审美表达,技术偏重实用与效率,设计艺术是艺术与技术相结合的产物,技术是设计得以实现的手段和物质基础。\n- 技术发展史带动设计发展史:手工艺时代→工业革命(蒸汽机、机械化生产)→电气化时代→数字化/计算机辅助设计(CAD)时代,每次技术革命都催生相应的新设计形式与生产方式。\n- 现代设计与\"消费社会\"的关系:产品价值逐渐从单纯功能性转向符号/象征价值,设计成为刺激消费、参与社会文化传播的重要手段。"
    },
    {
      "id": "sec2",
      "title": "设计艺术学概论 / 第一章 导论 / 第二节 设计艺术学的研究内容",
      "tags": [
        "section"
      ],
      "body": "设计艺术学是关于人类设计创作规律及设计物化过程中身体与心理感受的综合性学科,主要包括五方面研究内容:"
    },
    {
      "id": "pt3",
      "title": "设计艺术学概论 / 第一章 导论 / 第二节 设计艺术学的研究内容 / 一、设计艺术理论研究",
      "tags": [
        "point"
      ],
      "body": "设计艺术的基本概念、范畴、原理与方法论研究,是学科建设的理论基础,包括对设计艺术本质、评价体系的探讨。"
    },
    {
      "id": "pt4",
      "title": "设计艺术学概论 / 第一章 导论 / 第二节 设计艺术学的研究内容 / 二、设计艺术相关学科研究",
      "tags": [
        "point"
      ],
      "body": "设计艺术是交叉性学科,与美学、心理学、社会学、经济学、材料学、人类学、传播学等学科关系密切,需要多学科视角综合研究。"
    },
    {
      "id": "pt5",
      "title": "设计艺术学概论 / 第一章 导论 / 第二节 设计艺术学的研究内容 / 三、设计艺术发展史研究",
      "tags": [
        "point"
      ],
      "body": "研究设计艺术历史演进脉络,包括中外设计通史及专题史(如设计史、CI发展史等),把握不同历史时期、不同地域文化、材料科技水平对设计风格的影响。"
    },
    {
      "id": "pt6",
      "title": "设计艺术学概论 / 第一章 导论 / 第二节 设计艺术学的研究内容 / 四、设计批评研究",
      "tags": [
        "point"
      ],
      "body": "设计批评是艺术批评的分支,是对设计作品在深层次上的价值判断,具备\"标尺\"作用(借用\"krinein\"希腊语词源,意为\"区别、判断\"),科学地对设计作品进行鉴赏和评价。"
    },
    {
      "id": "pt7",
      "title": "设计艺术学概论 / 第一章 导论 / 第二节 设计艺术学的研究内容 / 五、设计艺术教育研究",
      "tags": [
        "point"
      ],
      "body": "研究设计人才培养的教育理念、教育方法、学科体系建设,教育质量直接关系设计艺术行业未来发展水平。"
    },
    {
      "id": "ch2",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类",
      "tags": [
        "chapter"
      ],
      "body": "本章按主要设计门类分为六节:平面设计、工业产品设计、环境设计、服饰设计、数字与传媒设计、手工艺设计。"
    },
    {
      "id": "sec3",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第一节 平面设计",
      "tags": [
        "section"
      ],
      "body": "广义的平面设计是指通过文字、标志、图形等视觉符号在二维空间的组合传达信息、观念或情感的设计活动。主要领域:\n- **文字设计**——文字是信息传达最基本的视觉元素,兼具识别性与审美性,通过字体、字号、字距、编排等设计传达信息与情感。\n- **标志设计**——标志是企业/组织/活动理念的高度浓缩符号,要求高度概括、易识别、易记忆,分为图形标志、字体标志和组合标志等。\n- **插图设计**——以绘画等手段配合文字表达内容,增强传达效果与感染力。\n- **版面设计**——对文字、图片等视觉要素进行编排组织,遵循统一性、注意力焦点、可读性等原则。\n- **书籍装帧设计**——包括封面、扉页、版式、装订形式等的整体设计,需兼顾内容表达与美感呈现。\n- **广告设计**——通过媒介传播商业或公益信息,历经报纸、招贴到现代数字广告的发展,核心是准确、鲜明地传达特定诉求。\n- **包装设计**——具有保护、便利运输/销售和促进产品销售三大功能,涉及容器结构、视觉传达设计等。"
    },
    {
      "id": "sec4",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第二节 工业产品设计",
      "tags": [
        "section"
      ],
      "body": ""
    },
    {
      "id": "pt8",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第二节 工业产品设计 / 一、概念",
      "tags": [
        "point"
      ],
      "body": "工业产品设计是指以人机工程学、市场经济学、工艺技术等为基础,对批量生产的产品进行功能、形态、结构等系统设计,追求“适用”(功能合理)与“美观”(形式美)的统一。"
    },
    {
      "id": "pt9",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第二节 工业产品设计 / 二、分类",
      "tags": [
        "point"
      ],
      "body": "按产品种类可分为:交通工具设计、家用产品设计、家具设计、文教用品设计、医疗器械设计、体育用品设计、工业装备设计等。"
    },
    {
      "id": "sec5",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第三节 环境设计",
      "tags": [
        "section"
      ],
      "body": "环境设计是研究人与环境关系,以人的生存与生活质量为核心的应用性艺术,可分为综合性设计(城市与区域规划设计)与专项设计。\n- **(一)城市与区域规划设计**——涉及城市空间结构、功能分区与可持续发展规划。\n- **(二)建筑设计**——研究建筑的结构、空间、功能及造型等要素的综合设计,兼具实用性与艺术性。\n- **(三)室内设计**——对建筑内部空间的功能布局、界面处理、家具陈设等进行的设计,直接影响人的生理与心理感受。\n- **(四)景观设计**——对建筑外部公共空间(园林、广场、道路、绿地等)的设计,分为自然要素与人工要素两部分。\n- **(五)公共艺术设计**——将艺术作品置于公共空间的设计,兼具审美性与公共参与性,常承载城市文化记忆与精神表达功能。"
    },
    {
      "id": "sec6",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第四节 服饰设计",
      "tags": [
        "section"
      ],
      "body": ""
    },
    {
      "id": "pt10",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第四节 服饰设计 / 一、服装设计",
      "tags": [
        "point"
      ],
      "body": "以人体为对象的实用艺术,按功能可分为日常服装、职业服装、礼仪服装、演出服装等;需考虑款式、材料、色彩、工艺等设计要素及人体工学与文化心理因素。"
    },
    {
      "id": "pt11",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第四节 服饰设计 / 二、首饰设计",
      "tags": [
        "point"
      ],
      "body": "佩戴于人体的装饰品设计,按佩戴部位可分为头饰、颈饰、胸饰、手饰、脚饰等;兼具材质美、造型美与文化象征意义。"
    },
    {
      "id": "sec7",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第五节 数字与传媒设计",
      "tags": [
        "section"
      ],
      "body": ""
    },
    {
      "id": "pt12",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第五节 数字与传媒设计 / 一、数字技术与传媒设计的发展",
      "tags": [
        "point"
      ],
      "body": "计算机与网络技术的发展催生\"新媒体艺术\",数字技术使信息传播实现\"0\"或\"1\"的二进制编码,信息采集、处理、存储、传输高度融合。"
    },
    {
      "id": "pt13",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第五节 数字与传媒设计 / 二、领域",
      "tags": [
        "point"
      ],
      "body": "- **多媒体艺术设计**——融合文字、图形、图像、动画、音视频等多种媒介元素的综合性艺术设计。\n- **动漫设计**——包括动画和漫画,是运用连续画面表现故事情节的视听艺术形式,涉及角色、场景、分镜等设计环节。\n- **数字影视设计**——运用数字技术进行影视内容的制作与后期处理,如特效合成、剪辑包装等。"
    },
    {
      "id": "sec8",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第六节 手工艺设计",
      "tags": [
        "section"
      ],
      "body": ""
    },
    {
      "id": "pt14",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第六节 手工艺设计 / 一、传统手工艺设计",
      "tags": [
        "point"
      ],
      "body": "历史悠久,以手工劳动为主要生产方式,体现材料、技艺与地域文化特色,面临现代工业化冲击下的传承与创新问题。"
    },
    {
      "id": "pt15",
      "title": "设计艺术学概论 / 第二章 设计艺术的分类 / 第六节 手工艺设计 / 二、现代手工艺设计",
      "tags": [
        "point"
      ],
      "body": "相对传统手工艺,现代手工艺设计更强调与现代生活方式结合,创作主体从传统匠人扩展到艺术专业工作者、工艺设计师、工艺美术院校师生,在造型、色彩、构成方式上体现出较强的现代性。"
    },
    {
      "id": "ch3",
      "title": "设计艺术学概论 / 第三章 设计艺术的特征与原则",
      "tags": [
        "chapter"
      ],
      "body": ""
    },
    {
      "id": "sec9",
      "title": "设计艺术学概论 / 第三章 设计艺术的特征与原则 / 第一节 设计艺术的本质特征",
      "tags": [
        "section"
      ],
      "body": ""
    },
    {
      "id": "pt16",
      "title": "设计艺术学概论 / 第三章 设计艺术的特征与原则 / 第一节 设计艺术的本质特征 / 一、人类特有的创造性活动",
      "tags": [
        "point"
      ],
      "body": "设计艺术是人类独有的创造性活动,以人的需要为原动力(区别于原始本能应激的动物\"造物\"如蜘蛛结网、蜜蜂筑巢);其创造性体现在对既有事物\"再创造\"以满足新需要,是艺术活动、创造活动与探索活动的融合。"
    },
    {
      "id": "pt17",
      "title": "设计艺术学概论 / 第三章 设计艺术的特征与原则 / 第一节 设计艺术的本质特征 / 二、不断适应并引导人类生活方式的活动",
      "tags": [
        "point"
      ],
      "body": "设计艺术与人们的生活方式紧密联系并相互影响;设计既受生活方式制约(适应),又通过新的设计成果反过来改变、引导人类新的生活方式的形成。"
    },
    {
      "id": "pt18",
      "title": "设计艺术学概论 / 第三章 设计艺术的特征与原则 / 第一节 设计艺术的本质特征 / 三、\"制约性\"艺术",
      "tags": [
        "point"
      ],
      "body": "设计艺术不同于纯艺术的最显著特征是\"制约性\"。有人称\"个人语言的艺术\"来形容纯艺术,而设计艺术却须以两方面来看待制约:\n1. 承认设计艺术是特殊的艺术活动,从古至今设计师总是在不断地遵循艺术的语言范式;\n2. 设计艺术受经济、政治、文化、市场需求等多重制约,反映时代精神与社会生活的诸多面向。"
    },
    {
      "id": "pt19",
      "title": "设计艺术学概论 / 第三章 设计艺术的特征与原则 / 第一节 设计艺术的本质特征 / 四、设计艺术是\"用\"与\"美\"统一的艺术",
      "tags": [
        "point"
      ],
      "body": "引用《造物的艺术论》\"实生、安适、美目、怡神\"四个方面阐述设计艺术的双重属性:\"用\"(实用功能)是设计艺术存在的根本前提;\"美\"(审美形式)是设计艺术区别于一般产品制造的关键所在。合理的设计艺术应达到\"用\"与\"美\"的有机统一,而非二者对立。"
    },
    {
      "id": "sec10",
      "title": "设计艺术学概论 / 第三章 设计艺术的特征与原则 / 第二节 设计艺术的原则",
      "tags": [
        "section"
      ],
      "body": ""
    },
    {
      "id": "pt20",
      "title": "设计艺术学概论 / 第三章 设计艺术的特征与原则 / 第二节 设计艺术的原则 / 一、功能原则",
      "tags": [
        "point"
      ],
      "body": "设计的目的是实现设计的功能以满足人们生活中的某一问题,只有实现设计功能才能实现设计目的、体现设计价值。功能可分为:\n- (一)**物质功能**——满足人们生理需要与实际使用需求的功能,是设计物存在的首要前提(参考文献引用[美]伊利诺理工设计学院对产品功能的经典分析框架)。\n- (二)**精神功能**——设计的色彩、材质、造型等要素传达出的认知功能、象征功能与审美功能,如国家重大建筑(人民大会堂、中国美术馆等)运用红色、黄色等传统色彩象征庄重与文化内涵。"
    },
    {
      "id": "pt21",
      "title": "设计艺术学概论 / 第三章 设计艺术的特征与原则 / 第二节 设计艺术的原则 / 二、艺术原则",
      "tags": [
        "point"
      ],
      "body": "艺术是设计得以体现审美价值、区别于一般产品的关键要素,主要体现在:\n- (一)**设计艺术的艺术性表现**——设计的艺术性通过形式美(造型、色彩、材质、结构、比例等)呈现,体现设计师的审美追求与艺术素养。\n- (二)**设计艺术的艺术性与实用功能相关**——设计的艺术性并非孤立存在,须与产品的实用功能、结构工艺相协调,做到审美形式与功能内容的和谐统一,不能脱离功能空谈形式。"
    },
    {
      "id": "pt22",
      "title": "设计艺术学概论 / 第三章 设计艺术的特征与原则 / 第二节 设计艺术的原则 / 三、创新原则",
      "tags": [
        "point"
      ],
      "body": "创新是设计艺术的生命力所在,包括三个层面:\n1. **观念创新**——设计思想、设计理念的突破;\n2. **语言创新**——造型语言、表现形式的创新;\n3. **技术创新**——新材料新工艺带来的创新可能性(如IBM等企业将现代科技与人性化设计相结合的案例)。"
    },
    {
      "id": "pt23",
      "title": "设计艺术学概论 / 第三章 设计艺术的特征与原则 / 第二节 设计艺术的原则 / 四、经济原则",
      "tags": [
        "point"
      ],
      "body": "设计艺术是市场经济活动的产物,须考虑成本、生产效益与消费者购买力,做到\"物美价廉\"。合理定价、控制成本、提高附加值是设计艺术产业化的重要基础(如阿玛尼公司多品牌梯度定价策略案例)。"
    },
    {
      "id": "pt24",
      "title": "设计艺术学概论 / 第三章 设计艺术的特征与原则 / 第二节 设计艺术的原则 / 五、信息原则",
      "tags": [
        "point"
      ],
      "body": "现代设计需充分利用信息技术进行市场调研、用户分析与信息反馈,使设计更精准对接受众需求。信息原则体现在三方面:\n1. **功能复合化**——如集打字、储存、复印为一体的多功能设备;\n2. **小型轻薄化**——通过材料与结构改进减小体积重量;\n3. **智能化**——利用信息技术使产品具备智能感知与自动化功能(如智能建筑的\"3A\"通信自动化CA、办公自动化OA、消防自动化FA或\"5A\"体系)。\n\n设计艺术诸原则在实践中并非孤立存在,当各原则出现冲突时,需要设计师根据具体情境合理取舍与协调,以达到设计的最佳整体效果。"
    },
    {
      "id": "ch4",
      "title": "设计艺术学概论 / 第四章 设计文化与设计风格",
      "tags": [
        "chapter"
      ],
      "body": ""
    },
    {
      "id": "sec11",
      "title": "设计艺术学概论 / 第四章 设计文化与设计风格 / 第一节 设计文化",
      "tags": [
        "section"
      ],
      "body": "人类创造了文化,文化也不断影响着人类造物的观念。设计文化是人类造物设计观念形态与知识形态的整体反映,一方面研究设计艺术的产生、发展及内在演变规律,另一方面研究设计物的创作意图、文化意蕴。"
    },
    {
      "id": "pt25",
      "title": "设计艺术学概论 / 第四章 设计文化与设计风格 / 第一节 设计文化 / 一、设计文化的类型",
      "tags": [
        "point"
      ],
      "body": "按精神与物质文化角度可分为:\n- **物质文化**——指设计物本身的物质形态所承载的文化信息;\n- **制度文化**——指设计活动所遵循的社会制度、行业规范等;\n- **精神文化**——指设计活动所蕴含的价值观念、审美理想、宗教信仰等深层文化内涵。\n三者相互渗透,共同构成设计文化的完整体系,并随人类生活方式演变而发展。"
    },
    {
      "id": "pt26",
      "title": "设计艺术学概论 / 第四章 设计文化与设计风格 / 第一节 设计文化 / 二、设计文化的民族性",
      "tags": [
        "point"
      ],
      "body": "不同民族因其地理环境、历史传统、宗教信仰不同而形成各具特色的设计文化(如各民族传统建筑、器物、图腾纹样等所体现的民族性设计语言)。设计文化的民族性是设计艺术保持自身特色、避免趋同的重要基础。"
    },
    {
      "id": "pt27",
      "title": "设计艺术学概论 / 第四章 设计文化与设计风格 / 第一节 设计文化 / 三、设计文化的时代性",
      "tags": [
        "point"
      ],
      "body": "设计文化随社会生产力发展与时代精神变化而不断演变,不同历史时期的设计风格具有鲜明的时代烙印(如书中所举唐宋茶文化、\"斗茶\"风尚,及21世纪奥运会开闭幕式设计等案例,反映特定时代的科技水平、审美观念和社会心理)。"
    },
    {
      "id": "pt28",
      "title": "设计艺术学概论 / 第四章 设计文化与设计风格 / 第一节 设计文化 / 四、设计文化建设的必要性",
      "tags": [
        "point"
      ],
      "body": "不同国家、不同民族应根据自身文化传统探索适合本国现代生活需求的设计道路,不能盲目照搬西方现代设计观念,应实现设计文化与时代精神、民族特色、地域环境的和谐统一(如北京奥运会会徽\"舞动的北京\"将中国传统书法/篆刻艺术与体育运动特征结合的经典设计文化案例)。"
    },
    {
      "id": "sec12",
      "title": "设计艺术学概论 / 第四章 设计文化与设计风格 / 第二节 设计风格",
      "tags": [
        "section"
      ],
      "body": "风格是艺术学中的重要术语,指由艺术家独特的创作个性与作品鲜明特色所形成的艺术格调,体现为整体一贯的、成熟的特色。"
    },
    {
      "id": "pt29",
      "title": "设计艺术学概论 / 第四章 设计文化与设计风格 / 第二节 设计风格 / 一、设计艺术的时代风格",
      "tags": [
        "point"
      ],
      "body": "同一历史时期设计作品所呈现的共同性形式特征,受当时代主导的设计理念和技术水平所决定。如包豪斯时期\"经济实用\"思想影响下,主张工艺技术与产品结合,反对过度装饰;20世纪60年代波普风格追求活泼多元色彩样式;各时代家具、建筑等设计的时代特征均反映了当时的社会思潮与生产力水平。"
    },
    {
      "id": "pt30",
      "title": "设计艺术学概论 / 第四章 设计文化与设计风格 / 第二节 设计风格 / 二、设计艺术的民族风格",
      "tags": [
        "point"
      ],
      "body": "不同民族由于地理环境、宗教信仰、文化传统的差异而形成各具特色的设计民族风格。中国传统家具(如明式家具\"简、厚、精、雅\"的风格特征)体现了中国传统造物哲学中材美工巧、天人合一等理念。"
    },
    {
      "id": "pt31",
      "title": "设计艺术学概论 / 第四章 设计文化与设计风格 / 第二节 设计风格 / 三、设计艺术的个人风格",
      "tags": [
        "point"
      ],
      "body": "设计师个人在长期创作实践中形成的独特艺术语言与个性化表现方式,是设计师艺术素养、审美取向、思维方式的综合体现(如书中所举建筑师及产品设计师的个人风格案例)。个人风格的形成通常经历模仿借鉴、探索融合到成熟独立的发展过程。"
    },
    {
      "id": "ch5",
      "title": "设计艺术学概论 / 第五章 设计心理与设计思维",
      "tags": [
        "chapter"
      ],
      "body": ""
    },
    {
      "id": "sec13",
      "title": "设计艺术学概论 / 第五章 设计心理与设计思维 / 第一节 设计心理",
      "tags": [
        "section"
      ],
      "body": ""
    },
    {
      "id": "pt32",
      "title": "设计艺术学概论 / 第五章 设计心理与设计思维 / 第一节 设计心理 / 一、设计心理学的概念",
      "tags": [
        "point"
      ],
      "body": "设计心理学是20世纪90年代新兴的交叉学科,研究人们在设计活动实践中(包括设计者和使用者)的心理活动与行为规律,应用于人机界面、产品设计、环境艺术等领域,为设计方法与决策提供心理学依据。"
    },
    {
      "id": "pt33",
      "title": "设计艺术学概论 / 第五章 设计心理与设计思维 / 第一节 设计心理 / 二、设计心理学的研究方法",
      "tags": [
        "point"
      ],
      "body": "包括观察法、实验法、调查法(问卷法、访谈法)等。观察法用于自然情境下研究用户行为;实验法通过控制变量研究特定心理现象;调查法通过问卷/访谈收集用户对产品的主观评价与需求信息。"
    },
    {
      "id": "pt34",
      "title": "设计艺术学概论 / 第五章 设计心理与设计思维 / 第一节 设计心理 / 三、需要心理及其在设计艺术中的应用",
      "tags": [
        "point"
      ],
      "body": "引用马斯洛(Maslow)需求层次理论,说明消费者的需要心理从生理需要、安全需要到社会需要、尊重需要、自我实现需要逐级递升,设计需针对目标人群的具体需要层次进行有针对性的设计。同时介绍日本狩野纪昭(Noriaki Kano)博士提出的**KANO模型**,将产品质量特性分为基本型、期望型、魅力型等类型,用于分析用户需求的优先级与满意度提升空间。"
    },
    {
      "id": "pt35",
      "title": "设计艺术学概论 / 第五章 设计心理与设计思维 / 第一节 设计心理 / 四、动机、行为理论及其在设计艺术中的应用",
      "tags": [
        "point"
      ],
      "body": "动机是个体内部驱使其产生行为以满足需要的内在动力。设计需了解用户消费行为背后的动机类型(如生理性动机、心理性动机、社会性动机),并通过设计语言(色彩、造型、广告宣传等)进行合理的引导与唤醒。"
    },
    {
      "id": "pt36",
      "title": "设计艺术学概论 / 第五章 设计心理与设计思维 / 第一节 设计心理 / 五、知觉理论及其在设计艺术中的应用",
      "tags": [
        "point"
      ],
      "body": "知觉是人脑对客观事物整体属性的综合反映,涉及形知觉(如格式塔理论中的\"完形\"倾向)、色彩知觉、空间知觉、质地知觉等,这些知觉规律直接影响用户对设计作品的感受与评价,是产品外观、包装、界面设计的重要理论依据。"
    },
    {
      "id": "pt37",
      "title": "设计艺术学概论 / 第五章 设计心理与设计思维 / 第一节 设计心理 / 六、操作行为与设计艺术",
      "tags": [
        "point"
      ],
      "body": "从人机工程学角度探讨用户操作产品过程中的心理与行为规律,包括:\n- (一)**人的操作能力与角度**——涉及人体尺寸、动作范围、力量等生理限度对操作舒适性的影响;\n- (二)**产品操作的心理过程**——从感知、认知判断到操作执行的心理链条;\n- (三)**操作失误心理**——分析操作失误产生的原因(信息误导、疲劳、习惯干扰等)及减少失误的设计对策;\n- (四)**特殊人群操作心理**——针对儿童、老年人、残障人士等特殊群体,设计需考虑其生理心理特点(如儿童的好奇探索心理、老年人的认知记忆衰退、肢体障碍人士的可及性需求),体现设计的人文关怀。"
    },
    {
      "id": "sec14",
      "title": "设计艺术学概论 / 第五章 设计心理与设计思维 / 第二节 设计思维与设计方法",
      "tags": [
        "section"
      ],
      "body": ""
    },
    {
      "id": "pt38",
      "title": "设计艺术学概论 / 第五章 设计心理与设计思维 / 第二节 设计思维与设计方法 / 一、设计思维的形式",
      "tags": [
        "point"
      ],
      "body": "设计思维是设计主体在头脑中对客观事物本质规律的把握过程,主要形式包括:\n- **抽象思维**——运用概念、判断、推理进行逻辑分析的思维形式;\n- **形象思维**——以直观形象(意象、想象)为主的思维形式,常贯穿设计构思全过程;\n- **灵感思维**——创造性思维活动中突发的、非逻辑的顿悟式思维状态。"
    },
    {
      "id": "pt39",
      "title": "设计艺术学概论 / 第五章 设计心理与设计思维 / 第二节 设计思维与设计方法 / 二、设计思维的类型",
      "tags": [
        "point"
      ],
      "body": "1. **发散思维**——又称求异思维,从一点出发向多方向扩展寻求多种可能的解决方案,是创造性思维的重要基础;\n2. **收敛思维**——又称求同思维,将发散思维产生的多种方案进行归纳整合、优选出最佳方案;\n3. **逆向思维**——反常规角度思考问题,突破思维定式;\n4. **联想思维**——以已知事物为参照展开的想象性思维;\n5. **模糊思维**——不追求精确界定,注重整体把握的思维方式;\n6. **创造性思维**——设计师特有的综合性思维能力,是设计活动的核心驱动力,创造想象的方法包括重组要素、夸张变形、异质同构等。"
    },
    {
      "id": "pt40",
      "title": "设计艺术学概论 / 第五章 设计心理与设计思维 / 第二节 设计思维与设计方法 / 三、设计思维的方法",
      "tags": [
        "point"
      ],
      "body": "1. **头脑风暴法**(Brain Storming/BS法)——由美国A.F.奥斯本20世纪30年代提出的激发集体创造性设想的会议法,通过自由发言、延迟评判、以量求质、结合改善等原则,鼓励参会者踊跃提出设想,后期再进行整理评价,包含前期准备、明确问题、畅谈、综合评价等步骤。\n2. **交合分合法**(Synectics)——由W.J.戈登1944年提出,通过类比、隐喻等方式将熟悉事物与不熟悉问题联系起来寻找创新解法。\n3. **六W检问法**——围绕why(为什么)、what(是什么)、who(何人)、when(何时)、where(何地)、how(如何)六个疑问词逐一检问产品各要素,系统发现改进方向。\n4. **仿生模拟法**——师法自然界生物的形态、结构、功能等原理进行设计创新的方法,是现代设计常用的创新途径之一。\n5. **扩展利用法**——通过发散联想扩大设计对象的应用范围或改变其原有功能属性以获得新设计。\n6. **组合改变法**——将两种或以上原有元素/功能重新组合形成新产品(如\"瓦西里椅\"等经典案例)。\n7. **新旧更替法**——以新材料、新技术、新观念取代旧有设计要素以实现产品更新换代,推动设计风格演变(如摩登主义家具对传统家具形式的更替)。\n8. **属性列举法**——由罗伯特·克劳福德(Robert Crawford)教授1954年提出,将产品的属性(名词性、形容词性、动词性属性)逐一列举分析,寻求各属性维度的改进可能。\n\n设计思维方法之间并非孤立割裂,实际设计过程中往往需要综合运用多种思维方法与技巧,结合具体设计对象和现有资源条件,选择最有效的创新路径。"
    },
    {
      "id": "ch6",
      "title": "设计艺术学概论 / 第六章 设计师",

    {
      "id": "sec15",
      "title": "设计艺术学概论 / 第六章 设计师 / 第一节 设计师的特征",
      "tags": [
        "section"
      ],
      "body": ""
    },
    {
      "id": "pt41",
      "title": "设计艺术学概论 / 第六章 设计师 / 第一节 设计师的特征 / 一、设计师的本质属性",
      "tags": [
        "point"
      ],
      "body": "设计师是设计活动的主体,是设计活动的核心。无论古代各行业工匠还是现代设计师,都以其社会分工方式与创造能力从事造物设计活动。设计师职业地位随社会分工发展而逐渐从依附型的手艺人向独立化、专业化的职业角色转变(如1907年德国AEG公司聘请彼得·贝伦斯为艺术顾问,被视为现代第一位\"工业设计师\")。"
    },
    {
      "id": "pt42",
      "title": "设计艺术学概论 / 第六章 设计师 / 第一节 设计师的特征 / 二、现代设计师的工作性质与任务",
      "tags": [
        "point"
      ],
      "body": "现代设计师工作已不限于单纯的产品外观设计,而是涵盖市场调研、方案策划、结构工艺、生产管理、品牌形象等系统性工作,需要综合协调企业内多个部门(生产、财务、销售、管理等)的诉求。设计师的工作任务因所在企业规模、行业领域不同而有所差异,涵盖从个体独立设计师到大型设计公司团队协作等多种工作模式。"
    },
    {
      "id": "pt43",
      "title": "设计艺术学概论 / 第六章 设计师 / 第一节 设计师的特征 / 三、设计师的类型",
      "tags": [
        "point"
      ],
      "body": "随着设计领域不断细分,设计师专业分工也日益细化,大体可按所属专业领域分为:平面设计师、工业产品设计师、环境设计师(建筑设计师、室内设计师、景观设计师)、服装设计师、数字与传媒设计师、包装设计师、广告设计师、展示设计师、CI设计师等,也有跨领域、复合型设计师。设计师还可按工作机构性质分为自由设计师、企业专职设计师、设计公司设计师、独立设计工作室等类型。"
    },
    {
      "id": "sec16",
      "title": "设计艺术学概论 / 第六章 设计师 / 第二节 设计师的素质与技能",
      "tags": [
        "section"
      ],
      "body": ""
    },
    {
      "id": "pt44",
      "title": "设计艺术学概论 / 第六章 设计师 / 第二节 设计师的素质与技能 / 一、设计师的基本素质",
      "tags": [
        "point"
      ],
      "body": "现代设计不是单一学科技艺,需要设计师具有综合素养,主要包括:\n1. **敏感性**——对市场趋势、用户需求、社会文化变化具有敏锐感知力;\n2. **智力**——涉及观察、记忆、思维、想象等认知能力的综合运用;\n3. **好奇心**——对新事物、新知识保持强烈探究兴趣,是创新灵感的重要来源;\n4. **创造力**——将已有知识经验转化为新颖独特设计方案的核心能力;\n5. **专业献身精神**——对设计事业的执着热爱与持续投入(以书中所举高迪、赖特等建筑师的从业经历为例);\n6. **持之以恒的精神**——设计创作往往需要长期积累与反复推敲打磨,方能形成成熟风格与经典作品(以罗维等设计师的职业历程为例)。"
    },
    {
      "id": "pt45",
      "title": "设计艺术学概论 / 第六章 设计师 / 第二节 设计师的素质与技能 / 二、设计师的专业知识结构",
      "tags": [
        "point"
      ],
      "body": "设计艺术是跨学科的综合性学科,设计师的专业知识结构应包括:\n- (一)**专业理论知识**——设计艺术基础理论及诸多相关学科理论知识(美学、艺术史、设计史、材料学、社会学、市场学等),是指导设计实践的理论基础;\n- (二)**专业基础知识**——包括设计造型基础(素描、色彩、构成等)、专业技能基础(手绘表达、软件应用等),是开展设计实践的基本功;\n- (三)**专业设计技能**——针对所属专业领域(如产品、平面、环境等)的专门设计知识与技法,是设计师安身立命的核心竞争力;\n- (四)**设计实践能力**——将理论知识与专业技能转化为实际项目成果的综合运用能力,包含团队协作、项目管理、跨领域沟通等能力。"
    },
    {
      "id": "pt46",
      "title": "设计艺术学概论 / 第六章 设计师 / 第二节 设计师的素质与技能 / 三、设计师的人文素质修养",
      "tags": [
        "point"
      ],
      "body": "优秀设计师需具备广博的人文视野与文化底蕴,包括文学、历史、哲学、艺术等多学科知识积累,培养全面的审美判断力与文化理解力,才能创作出兼具时代精神与文化内涵的优秀设计作品(书中以贝聿铭、伊姆斯等设计师的跨学科修养为例)。"
    },
    {
      "id": "pt47",
      "title": "设计艺术学概论 / 第六章 设计师 / 第二节 设计师的素质与技能 / 四、设计师的团队协作能力和管理能力",
      "tags": [
        "point"
      ],
      "body": "现代设计项目日趋复杂庞大,单靠个人力量难以完成,设计师需具备良好的团队协作精神与项目管理能力,包括与不同专业背景团队成员(工程师、市场人员、生产管理者等)的有效沟通协调能力,以及对设计项目进度、资源、预算等的统筹管理能力。"
    },
    {
      "id": "pt48",
      "title": "设计艺术学概论 / 第六章 设计师 / 第二节 设计师的素质与技能 / 五、设计师的职业道德素养",
      "tags": [
        "point"
      ],
      "body": "设计师作为公众利益的重要影响者,应恪守职业道德规范,主要体现在:\n1. **诚信为本**——对客户、雇主及消费者负责,不夸大虚假宣传设计效果;\n2. **服务大众**——设计应从满足人的真实需求出发,而非单纯追逐利益或个人表现;\n3. **社会责任感**——关注设计对环境、资源、社会公共利益的影响,倡导可持续、负责任的设计理念,避免因单纯追求商业利益或猎奇效果而损害公众利益与社会风尚。"
    },
    {

    },
    {
      "id": "sec17",
      "title": "设计艺术学概论 / 第七章 设计批评 / 第一节 设计批评的基本概念",
      "tags": [
        "section"
      ],
      "body": ""
    },
    {
      "id": "pt49",
      "title": "设计艺术学概论 / 第七章 设计批评 / 第一节 设计批评的基本概念 / 一、设计批评的含义及发展现状",
      "tags": [
        "point"
      ],
      "body": "设计批评是依据一定的设计标准或原则,运用一定的方法,对设计艺术的美丑、优劣、成败等进行分析、评价和判断的活动,是设计创作实践与理论研究之间的中介环节。设计批评既包括抽象层面的设计思想批评,也包括对具体作品在个案层面的形式、内容评析。\n我国设计批评的现状:相较发达国家,我国设计批评整体发展仍相对滞后,存在批评标准模糊、批评人才匮乏、精神独立性不足等问题,批评界受商业利益、人情关系等因素影响,尚缺乏系统科学的批评方法与评价体系,亟须从理论建设、方法探索、批评家培养等方面全面加强。"
    },
    {
      "id": "pt50",
      "title": "设计艺术学概论 / 第七章 设计批评 / 第一节 设计批评的基本概念 / 二、设计批评的意义",
      "tags": [
        "point"
      ],
      "body": "引用相关学者观点,阐明设计批评对设计艺术实践与理论建设的重要意义:一方面对设计创作进行价值判断与舆论引导,督促设计者提升创作水准;另一方面通过总结反思推动设计理论体系的建构与完善,是设计艺术学科走向成熟的重要标志。"
    },
    {
      "id": "pt51",
      "title": "设计艺术学概论 / 第七章 设计批评 / 第一节 设计批评的基本概念 / 三、设计批评的主客体及特点",
      "tags": [
        "point"
      ],
      "body": "- **设计批评的主体**——泛指参与设计评论的个人或群体,可以是专业设计理论家、评论家,也可以是普通消费者、媒体、行业协会等,呈现多元化、大众化趋势。\n- **设计批评的客体**——即设计批评的对象,主要包括具体设计作品、设计现象、设计思潮、设计师个体创作特色等。\n- **设计批评的特点**——① 兼具评论高度专业性与广泛社会性的双重特征;② 具有很强的时代性,与所处历史阶段的社会文化背景密切相关;③ 具有价值导向作用,对社会审美取向及产业发展方向具有一定引领功能。"
    },
    {
      "id": "sec18",
      "title": "设计艺术学概论 / 第七章 设计批评 / 第二节 设计批评的角度",
      "tags": [
        "section"
      ],
      "body": ""
    },
    {
      "id": "pt52",
      "title": "设计艺术学概论 / 第七章 设计批评 / 第二节 设计批评的角度 / 一、中国古代主要的设计批评角度",
      "tags": [
        "point"
      ],
      "body": "中国传统造物思想中蕴含丰富的设计批评理念,主要来自诸子百家学说:\n1. **儒家\"功能与节用\"批评视角**——强调\"文质彬彬\"(《论语》)的形式与内容统一观,及\"节用\"、\"礼制\"对造物等级规范的制约,反对过度装饰浮华。\n2. **道家\"物我不物于物\"批评视角**——出自《庄子》\"物物而不物于物\"思想,强调造物应顺应自然、返璞归真,反对人为造物对本真自然的过度雕琢,追求\"大巧若拙\"的审美境界。"
    },
    {
      "id": "pt53",
      "title": "设计艺术学概论 / 第七章 设计批评 / 第二节 设计批评的角度 / 二、现代设计批评的主要角度",
      "tags": [
        "point"
      ],
      "body": "1. **功能主义批评角度**——以\"形式追随功能\"(Form Follows Function)为核心理念,强调设计应以满足实用功能为首要标准,批评脱离功能的纯装饰性设计,兴盛于20世纪初期现代主义设计运动。\n2. **人性化批评角度**——以\"以人为本\"为核心的批评视角,关注设计对使用者生理、心理及情感需求的满足程度,包括人体工程学(ergonomics/\"人机工学\")等相关研究支撑,重视老年人、儿童、残障人士等特殊群体的适用性设计。\n3. **可持续绿色批评角度**——关注设计物对生态环境资源的影响,倡导环保材料使用、可回收利用设计、节能设计等,批评过度消耗资源、造成环境负担的设计取向,是当代设计伦理的重要维度。\n\n设计批评的角度并非孤立单一,现代设计批评往往需要综合考虑功能、审美、人性化、可持续发展等多重维度进行系统评价,才能对设计作品做出全面、客观、公正的评判。"
    },

      "id": "sec19",
      "title": "设计艺术学概论 / 第八章 设计艺术教育 / 第一节 中国设计教育的发展历程",
      "tags": [

      "body": "作者:Sue Jenkyn Jones | Laurence King Publishing, 第三版 (2011)\n来源机构:Central Saint Martins College of Art & Design（中央圣马丁艺术设计学院）"

    {
      "id": "book2-ch1",
      "title": "Fashion Design（服装设计）中英对照笔记 / 引言 Introduction",
      "tags": [
        "chapter"
      ],
      "body": "### 本书定位与写作目的\n本书兼具\"教材\"与\"职业指南\"双重性质(both a manual and a career guide),不提供标准答案式的操作流程,而是通过大量在校生、毕业生和从业者的真实经验分享,帮助读者理解服装设计教育与行业的全貌。全书共7章,可不按顺序、按需查阅。正文中的**粗体词**对应书末术语表(glossary)和打版缝纫术语表(pattern-drafting and sewing terms)的解释条目。\n\n自1980年代末起,欧美服装制造业逐渐转移到东亚、北非和南美(East Asia, North Africa, South American states),西方时尚业转型为以创意和服务为核心的产业(a service industry),背景是多元审美、全球贸易与技术复杂性并存。本书聚焦这一背景下设计师和买手/商品企划(merchandiser)如何将创意转化为可市场化的产品,但不涉及打版、裁缝、市场营销等技术性极强、必须动手实践才能掌握的内容。\n\n### 你是否具备从业素质?（Have you got what it takes?）\n书中提供了一份从A到W的**个人素质与技能自查表**(可打1-5分自评),核心条目包括(节选,中英对照):\n- **Ambition 志向**——务实、观念和财务上都有强烈的成就欲\n- **Artistic 2D/3D skills 二维/三维艺术能力**——平面绘画能力;用多种材料构建立体作品的能力\n- **Business acumen 商业头脑**——具备数感,能识别机会与成本效益,逻辑清晰\n- **Color sense 色彩感**——对系列企划、印花、童装、针织尤为重要\n- **Communication skills 沟通能力**——能授权、解释、倾听、谈判,能面向团队发言\n- **Creativity 创造力**——天然的原创性,能产生新想法并乐于动手实践\n- **Curiosity 好奇心**——对社会、人、历史、设计、功能与形式有广泛了解\n- **Imagination 想象力**——抽象构思能力,并能精准契合任务需求\n- **Independence 独立性**——思想上独立,能不受监督或以自由职业方式工作\n- **Initiative 主动性**——主动开始、主动解决问题\n- **Leadership 领导力**——具备作为发言人或顾问的权威或地位\n- **Literacy 读写能力**——书面与口头表达清晰,电话沟通能力好\n- **Organizational skills 组织能力**——时间规划、信息与素材协调、按时完成任务\n- **Passion for fashion 对时尚的热情**——能以想法和服装感染他人\n- **Perception 洞察力**——敏锐的观察力、图形能力、问题排查与分析能力\n- **Punctuality 守时**——守时被高度重视\n- **Resourcefulness 应变力**——随机应变、变通解决问题的能力\n- **Risk-taking 冒险精神**——胆识、前瞻力、预测力与创业精神\n- **Talent 天赋**——尤其在速写或造型上的超常能力,以及推销能力(salesmanship)\n- **Team player 团队合作**——乐于分享、参与集体活动,清楚自己在大局中的角色\n- **Versatility 多面性**——能胜任不同类型任务,不惧挑战\n\n作者强调:对时尚设计的天赋并不等同于绘画天赋或缝纫技巧(虽然两者都包含在内),真正核心是**研究、吸收并整合信息与技能的能力**,以及为\"给身体穿衣\"这一古老问题不断提出令人耳目一新的解决方案的创造力。\n\n### 选校与申请（Which college? / Which course?）\n- 选校要点:不能只看招生简章或口碑,务必实地参观校园开放日(open days),实地考察地理位置、氛围与硬件设施;导师通常期待申请者面试前已到访过校园(除非申请者来自海外)。\n- 课程差异很大:有的院校偏重技术设备,有的偏重师资水平的创意指导;有全日制/兼读制、\"三明治课程\"(sandwich course,含实习学期)、国际学分互认项目等多种形式。\n- 美国学位体系:AAS(应用科学副学士)、BFA(艺术学士)、BS(理学学士);GPA是录取关键指标;海外申请者通常需要TOEFL成绩。\n- 大型院校通常能提供更细分的专业方向,如男装设计、印花/针织/刺绣工艺纺织设计、时尚营销与零售、童装、鞋履配饰、内衣、运动装,以及时尚新闻、造型、影视妆发等关联专业。\n\n### 面试准备（Preparing for interview）\n面试作品集(portfolio)应包含:\n1. 生活写生(life drawing studies),含线条与色彩\n2. 时装设计速写与插画习作\n3. 色彩、纺织图案设计、实验性面料与拼贴作品\n4. 展示调研思路与三维设计发展过程的课题作业\n5. 展示正反面视图的完整设计稿\n6. 成衣或制作过程的照片\n7. 设计报告、专业写作作品范例\n\n面试建议:作品集按\"项目系列\"或\"效果强弱\"排序而非严格按时间顺序;不需要过度装裱(会显得刻意);素描本(sketchbook)体现调研过程和实验痕迹同样重要;**绝不能抄袭已发表的照片或他人插画**;面试官此阶段关注的是原始潜力(raw potential)而非\"面面俱到\"的成熟表现;着装建议自然放松,不必\"盛装打扮\"(don't \"dress to impress\")。\n\n### 典型课程大纲（The college syllabus）\n一份完整的服装设计教学大纲通常涵盖:历史与当代时尚认知、视觉媒体与文化素养、调研方法、绘画与插画技能、设计开发技能、面料认知(类型/性能/采购)、设计原则(廓形、比例、色彩、细节)、基础打版与立裁原理、基础缝纫与服装构造、技术规格与排料核价、小型系列的产品线搭建(range-building)、CAD/CAM计算机辅助设计技术、作品集与口头表达技巧、独立学习、团队协作、市场营销与品牌意识、行业社会伦理议题、写作能力、个人职业发展。学制通常四年(也有二/三/五年制)。\n\n- **第一年**:课题短小多样,重在拓宽调研与信息吸收能力,逐步积累作品集。\n- **第二年**:自主性提高,课题周期延长(4-6周),常以小组/结对形式完成,监督逐渐减少。\n- **实习(internship)**:通常在第二、三学年之间安排,多数不带薪但能提供宝贵实操经验;大型品牌有成熟的实习生招募流程;海外实习需关注签证、语言(如IELTS/TOEFL)等要求。\n- **认证体系(accreditation)**:美国没有统一的中央教育部门管理高校,采取院校自愿接受同行评估的认证制度。\n\n\n---"

      "body": "### 为什么设计师需要\"语境\"知识\n若不了解所处历史、地理、经济与社会语境,很难成为真正有效的设计师、造型师或时尚记者。社会经济状况和市场环境处于持续变动中(in a constant state of flux),消费动机也会在设计师职业生涯中反复变化。**时尚设计师不能仅凭直觉工作**——敏锐的研究能力和读懂变化信号的能力,才是一切设计与商业决策的起点。\n\n### 服装的用途（The uses of clothing）\n学者对服装功能的经典分析框架,共8项:\n1. **Utility 实用性**——防护身体、适应环境(如渔民防水、消防员防火、矿工防毒气);19世纪美国妇女参政先驱Amelia Bloomer曾提倡女式\"灯笼裤\"(bloomers)以取代不实用的裙撑(crinoline)。\n2. **Modesty 端庄/遮蔽**——遮蔽身体、维护体面,常与\"节俭法\"(sumptuary law)相关;不同文化对\"得体暴露程度\"标准差异极大。\n3. **Immodesty 性吸引力**——通过面料、款式突显身体魅力。弗洛伊德门徒J.C. Flugel约1930年提出\"游移的性感带\"(shifting erogenous zone)理论,认为时尚通过不断转移身体的关注焦点来维持性张力。\n4. **Adornment 装饰**——通过文身、首饰、发型、化妆乃至缠足、束腰等方式强化身体吸引力或彰显身份/群体归属,有时甚至以牺牲舒适、健康为代价。\n5. **Symbolic differentiation 身份区分**——用服装标示职业、宗教、社会地位(如律师袍、修女服);奢侈品标识常经历\"从身份象征到大众化、失去区分效力\"的下渗过程(trickle down)。\n6. **Social affiliation 群体归属**——通过穿着趋同表达群体认同;反之,朋克(punk)通过撕裂衣物、安全别针、夸张发型表达对主流时尚的反叛,该风格由英国设计师Vivienne Westwood在1970年代中期确立。\n7. **Psychological self-enhancement 心理自我强化**——即使购买同款服装,消费者仍会通过妆发配饰凸显个人独特性。\n8. **Modernism 现代性表达**——在信息发达的都市环境中,\"看起来紧跟潮流\"能带来职场竞争优势。\n\n> \"所有时尚都是服装,但并非所有服装都是时尚……我们需要的是时尚而非单纯的衣物,用来包裹自尊,而不只是包裹裸体。\"——Colin McDowell (1995)\n\n### 消费者购买的实际考量（Practical criteria）\n设计师须理解消费者选择服装时的隐性驱动力,即使是最前卫的设计师也无法忽视:\n- **Price 价格**——多数消费者最看重的因素;设计师品牌因产量小、面料贵而成本高于中端与大众市场(可批量降低成本)。\n- **Quality 品质**——与价格及耐久度评估紧密相关;工时增加导致人们对易打理面料需求上升;针织衫在低价位常\"裁剪缝制\"、高价位则\"全成型编织\"(fully fashioned)。\n- **Fit 版型**——版型是可售性的核心要素,却难以量化(因人对\"合身松量\"的偏好各异);国际上没有统一的服装尺码标准,各国正推动本地平均体型研究以提高版型准确度;设计师应参考真实版型模特而非理想化身材。\n- **Comfort 舒适度**——面料科技(轻量化、弹力面料、无缝制造)持续推动舒适度提升;消费者也日益要求\"情感层面的舒适\"——即品牌供应链符合伦理与可持续标准(参考Naomi Klein《No Logo》一书对血汗工厂的揭露)。\n- **Relevance 适配性/相关性**——服装须契合消费者的生活方式、场合;\"设计师主导潮流\"的旧观念已过时,快速反应生产(Quick Response, QR)结合电子销售点数据分析(EPOS)让零售商能按区域差异快速调配货品。\n- **Brand 品牌**——品牌通过长期稳定的品质承诺积累忠诚度(如Burberry的英伦经典感、Versace的浮华性感);零售商自有品牌(private label)、名人联名系列日益普遍。\n- **Convenience and service 便利与服务**——消费者时间耐心有限,网购和退换货文化(buy-try-return culture)兴起;缺乏\"衣架吸引力\"(hanger appeal)的商品常被买手回避;高端品牌通过限量分销维持稀缺性。\n\n### 生态与伦理议题（Eco and ethical issues）\n时尚业长期在伦理生产上口碑不佳(剥削劳工、皮草养殖、棉花种植不可持续等)。改变只能靠消费者选择驱动。英国Mintel 2009年报告显示,英国伦理服装总销售额仅约1.75亿英镑,规模甚至小于婚纱市场,反映公众对\"生态时尚\"(eco-chic)的响应仍然有限(价格偏高、部分品牌虚假宣传)。\n\n未来最受关注的领域:\n- 减少碳排放、应对全球变暖\n- 石油资源枯竭与可再生能源\n- 劳工伦理待遇\n- 环保方式生产纤维(含有机种植)\n- 资源可持续性与回收利用\n- 无动物成分/素食时尚\n- 旧衣改造再利用(customizing and repurposing)\n- 保护传统手工艺技艺\n- 打击盗版与假货\n\n**能源消耗**:时尚纺织业在加工、洗涤、染色、运输环节能耗极高,且大量废弃服装最终填埋或焚烧;欧盟承诺到2020年降低20%能耗,但这是全球性问题。\n\n**劳工伦理**:据Oxfam估计,全球约4000万人从事服装纺织业(其中三分之二为基础生产岗位),多为低薪年轻女性,常面临职场霸凌与性骚扰;中国约1500万从业者;孟加拉国、印尼因制造成本最低,劳动条件被认为最差。相关监督/认证机构包括:ISO行为准则标准、Asian Floor Wage(亚洲最低生活工资联盟)、FLO(Fairtrade)、IFAT、TransFair、Labour Behind the Label(消费者伦理购物指南)。\n\n**纤维环保生产**:天然纤维(棉、麻等)未必比合成纤维\"天然环保\"——世界卫生组织(WHO)估计全球每年使用价值近20亿美元的农药(其中约8.19亿美元被列为有毒),对农民健康(震颤、恶心、癫痫、呼吸问题乃至死亡)及土壤生态危害巨大。**有机棉(organic cotton)**在种植中不使用合成杀虫剂/除草剂/化肥;Patagonia等品牌已全面转向有机棉,借此实现品牌差异化。\n\n**智能材料与纳米技术(SMART & nanomaterials)**——SMART指\"可持续制造与再利用/回收技术\"(Sustainable Manufacturing And Reuse/Recycling Technologies);纳米技术可从牛奶酪蛋白(milk casein)、宝特瓶聚合物等再生材料中创造新纤维;\"素皮革/vegetan\"用亚马逊橡胶等植物材料替代动物皮革。\n\n**皮草与动物福利**——1975年《濒危物种国际贸易公约》(CITES)监管3万种动植物贸易,1989年成功全球禁售象牙。1994年PETA名模联名广告\"宁愿裸体也不穿皮草\"曾使皮草一度成为时尚禁忌,但近年销量回升11%。85%以上的时尚用皮草来自人工养殖(丹麦、芬兰、荷兰、挪威、美国、中国为主要出口国);伦敦是全球皮草交易中心(年交易额约5亿英镑)。真皮草生产能耗是仿皮草的20倍,但仿皮草(不可降解尼龙材质)本身也有环保争议。\n\n**社会责任设计(Socially responsible design)**——伦理时尚品牌(如英国Folk、People Tree,丹麦Knowledge Cotton Apparel等)市场份额增长;大企业(如M&S)也开始将企业社会责任(CSR)理念纳入品牌宣传。Dr Kate Fletcher提出**慢时尚(slow fashion)**理念(呼应1986年意大利Carlo Petrini发起的慢食运动),主张从\"追求数量\"转向\"追求质量\",重视企业、工人、供应商间的可持续合作关系,支持本地技艺(如花边编织、刺绣)传承与\"衣物养护/维修/溯源\"文化。\n\n### 经济语境（Economic context）\n消费支出取决于**可支配收入(discretionary income)**;经济不景气时消费趋于保守,商品颜色款式减少;汇率波动直接影响进出口成本与买手预算(欧元诞生简化了欧洲内部交易)。原材料如同大宗商品在全球市场交易(羊毛产自澳大利亚、丝绸和羊绒产自中国、棉花是美国主要纤维),气候/政治因素可能引发原料短缺(如1999年靛蓝染料歉收导致牛仔裤产业危机)。\n\n**多种纤维协定(Multi Fibre Arrangement)**——1974年在关贸总协定(GATT)框架下由世界贸易组织(WTO)建立的临时贸易协定,约30国通过配额限制不公平贸易;该协定自1995年起逐步取消,2005年1月起步入自由市场时代,加剧了全球制造业竞争,导致英国/欧洲本土制造业衰退。\n\n### 时尚的语言（The language of fashion）\n服装是一种**非语言沟通系统(nonverbal communication)**,如同语言一样可以被\"学习\"。法国批评家Roland Barthes在《The Fashion System》(1967)中系统论述了服装的符号语言;研究此类信号系统的学科称为**符号学(semiotics)**。人们借助穿着组合(有意或无意地)传达或掩饰关于自己的年龄、性取向、体型、经济地位、婚姻状况、职业、宗教信仰、自尊等信息。戏剧影视中的服装设计师常利用这种\"刻板印象\"编码塑造角色。\n\n传统西方服装信息编码对照表(节选):\n- **阳刚(Masculinity)**——长裤、领带、宽肩、粗重面料、户外装\n- **阴柔(Femininity)**——裙装、低领口、收腰、精致面料\n- **性成熟(Sexual maturity)**——紧身、透明或光泽面料、高跟鞋\n- **支配感(Dominance)**——制服、不适面料、垫肩、深色、皮革、金属纽扣\n- **顺从感(Submissiveness)**——不实用的面料与花边、浅色、装饰性鞋履\n- **叛逆(Rebellion)**——夸张服装与发型、纹身、穿孔、异形鞋或赤足\n- **财富(Wealth)**——金饰珠宝、崭新合身、可辨识的时尚标签、皮草、香水\n\n设计师常故意打破这些编码(oversizing、撞色、无视身形、性别模糊、粗粝或裸露的做工)来制造前卫的表达张力。\n\n### 全球语境与时尚之都（Global context / Fashion cities）\n时尚已是全球化产业:跨国企业集团在全球范围低成本采购原料并分散制造,劳工/仓储成本低且监管宽松的地区成为生产基地;全球连锁品牌(Zara、H&M、Gap等)的标志已成为跨越地域的通用时尚符号。约80-85%的设计师仍集中在少数\"时尚之都\"工作,因其提供了灵感来源、买手网络和分销便利。\n\n**各国行业管理机构**:\n- 法国:法国高级定制与成衣联合会(La Fédération Française de la Couture...),下设三个分支机构分管高定、成衣、男装\n- 英国:英国时尚协会(The British Fashion Council),主办伦敦时装周\n- 美国:美国时装设计师协会(CFDA)\n- 意大利:Camera Nazionale della Moda Italiana、Fiera di Milano\n\n**巴黎(Paris)**——1858年英国人Charles Frederick Worth(公认首位\"高级定制设计师\"couturier)在巴黎创立设计工作室,为保护设计免遭仿冒,于1868年创立\"巴黎裁缝联合会\",即今日法国高定与成衣联合会的前身。加入\"高定创作者\"(Créateurs de la Mode)需满足严格条件:在巴黎设有工作室或展厅、雇佣至少20名全职员工、每年春秋两季各展示至少75套作品。法式设计风格特征:廓形清晰但剪裁复杂,合身贴体略带圆润感,偏好传统内衬结构裁缝工艺,精细做工(滚边扣眼、贝壳边),刺绣、蕾丝、珠饰是高定系列常见元素。法国政府长期扶持针线行业(needle trades),对使用90%以上法国面料的高定设计师提供补贴。\n\n*(注:本章后续还详述了伦敦、米兰、纽约等其他时尚之都的产业特征、风格标签及\"时尚年历\"time and timing / the fashion year、媒体 Media、互联网 The Internet 等主题,鉴于篇幅本笔记不逐一展开,建议结合原书Chapter 1后半部分继续查阅。)*\n\n### 高级定制与成衣（Haute couture / Prêt-à-porter）\n**高级定制(Haute couture)**——市场顶端,建立在为富裕客户提供量身定制、手工缝制单品的声望之上,代表品牌包括Valentino、Chanel、Dior、Givenchy等。1947年Christian Dior革命性的\"新风貌\"(New Look)之后,高定逐渐从\"以顾客为中心\"转向\"以设计师个人愿景主导\"。今日高定核心客户估计仅约2000人(多为富有的美国老年女性或中东石油富豪),许多高定品牌隶属于LVMH等奢侈品集团,高定系列更多承担品牌形象广告功能(带动化妆品、香水、副线、授权商品销售)。1991年YSL首席执行官Pierre Bergé曾断言高定将在十年内消亡,但近年品牌启用年轻设计师\"整改\"形象,催生了如Versus(Versace)、Miu Miu(Prada)等平价支线(demi-couture/diffusion line)。\n\n**成衣(Prêt-à-porter,法语\"准备好穿\")**——面向百货公司与精品店的中端批发市场,已成为时装贸易展的主流形式,巴黎成衣展每年2月/9月两季举办,约1200家参展商、4.3万买手参加。1959年Pierre Cardin成为首位展示成衣系列的高定设计师;YSL在左岸Saint-Germain开设的Rive Gauche是首家独立精品店,开启\"精品店购物\"革命。\n\n### 伦敦（London）\n英国传统出口优势在针织、雨衣、户外装(Jaeger、Aquascutum、Burberry),Savile Row仍是定制西装圣地。1980年代戴安娜王妃带动英国高定裁缝声誉;英国更以\"叛逆前卫\"风格著称——从1960年代Mary Quant、Biba到Vivienne Westwood、Alexander McQueen,再到当代Hussein Chalayan、Gareth Pugh等观念派设计师,伦敦一直是青年文化与街头时尚的策源地。**伦敦时装周(London Fashion Week)**由英国时尚协会(British Fashion Council,1983年创立)组织,兼顾扶持新锐设计师;但英国设计师常\"墙内开花墙外香\"(appreciated abroad but not at home)——本土企业界对创意重视不足,导致人才流向法意美时尚产业,即所谓\"人才流失\"(brain drain)。\n\n### 纽约（New York）\n服装业是纽约州/市第一大产业,美国第四大产业,巅峰时期年销售额近2000亿美元,拥有逾7000家服装制造企业;起源于19世纪末曼哈顿下东区移民劳工聚居区,缝纫机与纸样(paper pattern)的发明将裁缝手艺转化为规模化产业。与西欧类似,如今也面临制造外包的产业空心化趋势。\n\n### 城市考察建议（City study visits）\n在校期间应尽量把握机会参加时尚之都的实地考察(尤其时装周期间);建议随身携带素描本、相机、常用语手册、通讯录和地图,准备好正装及适合久站久走的平底鞋;未经许可不得在秀场/店内拍照;即使以\"娱乐\"面貌呈现,时装秀本质是严肃的商业活动,需保持职业尊重。\n\n### 米兰（Milan）\n时尚是意大利第二大产业(仅次于食品),是全球最大的纺织服装出口国,尤以鞋履、皮具、针织及男装成衣(moda pronta)见长。米兰是产业神经中枢,毗邻科莫湖丝绸印染业与皮埃蒙特羊毛加工业。**意大利风格**较法国更微妙(subtlety of coloring and texture),偏爱柔软厚重的羊毛与垂坠针织面料;乔治·阿玛尼(Giorgio Armani)开创\"无结构西装\"(unstructured suit),兼具舒适与松弛优雅感,深受美国市场欢迎。知名品牌包括Armani、Versace、Fendi、Dolce & Gabbana、Gucci、Prada、Salvatore Ferragamo等。米兰时装展称为\"Milanovedemoda\",在Fiera di Milano展馆举行。\n\n### 东京与其他时尚城市（Tokyo / Other fashion cities）\n1980年代日本设计师(三宅一生Issey Miyake、川久保玲Rei Kawakubo of Comme des Garçons、山本耀司Yohji Yamamoto)横空出世,以宽松、雕塑感廓形、深色系、毛边、破洞等彻底颠覆西方审美范式,被称为\"可穿戴的艺术\"(wearable art),对比利时设计师学派影响尤深。东京被称为\"第五大时尚之都\"。**比利时\"安特卫普六君子\"**(Ann Demeulemeester、Martin Margiela、Dries Van Noten等)以先锋、极简黑色美学闻名,先在伦敦、后转战巴黎成名。此外,西班牙巴塞罗那(Gaudí Mujer时装展)、德国杜塞尔多夫(Hugo Boss、Jil Sander)、香港/台湾、澳大利亚等也各有区域性时尚产业地位。\n\n**全球化企业运作案例**:Pierre Cardin在90多个国家有制造授权;LVMH集团旗下囊括Stella McCartney、YSL、Gucci、Céline等品牌;日本Onward Kashiyama公司在日本代工生产多个欧美品牌服装——反映当代时尚产业\"设计地\"与\"制造地\"\"品牌归属地\"常常三者分离的全球化格局。\n\n### 时间与时机（Time and timing / The fashion year）\n时尚产品与其他行业产品最大的区别在于**上市速度与货架寿命(speed to market and shelf life)**——时尚具有\"内置的过时性\"(built-in obsolescence)。传统零售按两季编列预算(春夏/秋冬),各自搭配清仓折扣季以回笼资金;但如今连锁店的补货周期已缩短至每6-8周一轮,与设计师品牌的传统\"两季历\"并存,形成复杂的**时尚周期(fashion cycle)**。\n\n**时尚日历(The fashion calendar)简表**(节选):\n- 1月:米兰男装秋冬发布 / 巴黎女装春夏及男装秋冬发布;设计师同步完成春夏成品交付、开始秋冬打样\n- 2月:纽约男装秋冬 / 佛罗伦萨Pitti Filati纱线展 / 巴黎Première Vision面料展\n- 3月:米兰/伦敦/巴黎女装秋冬发布及成衣展;纽约女装市场周\n- 6月:伦敦毕业生时装周(Graduate Fashion Week)——雇主借此物色新人\n- 9月:米兰/巴黎女装春夏发布;巴黎Première Vision面料展(次年方向)\n- 各大时装周整体顺序传统上是伦敦→米兰→巴黎→纽约,历时约四周;男装日历通常比女装提前约8周。\n\n时装周的场地与排期竞争激烈——**越早发布,越能优先安排生产、提前交货占据市场优势**。设计师需要在保持\"个人手法延续性\"(continuity of handwriting)的同时,让每季设计在色彩面料上有足够辨识度以刺激购买欲和媒体关注。伦敦时装周近年也向公众开放购票观秀,使时装秀本身具有更强的大众娱乐属性。\n\n### 文化语境与潮流演变（Cultural context / How current fashions evolve）\n借助现代通信技术,风格创意能瞬间传遍全球,溯源变得困难。21世纪的时尚演变已不再主要依赖传统的\"**涓滴理论(trickle-down theory)**\"(模仿上层阶级穿着),而更多依靠\"**上涌理论(bubble-up theory)**\"——即街头文化(如hip-hop)与青年群体率先带动风潮。市场日益碎片化,消费者可按不同场合混搭多种风格(而非单一从属于一种\"部落\"标签,如趋势分析师爱用的Ladettes、DINKYs、Silver Surfers、Tweens等标签)。人们对新潮流的接受速度不同,可分为**早期采用者(early adopters)、传播者(sneezers)、后知后觉者(laggards)**——参考Malcolm Gladwell《引爆点》(The Tipping Point)对流行如何\"引爆\"主流的论述。\n\n**时尚预测(Fashion forecasting)**——专业市场调研机构收费为品牌提供面料、色彩、细节流行趋势的统计分析报告,部分公司雇佣\"潮流猎人\"(cool-hunters)专门捕捉萌芽期趋势。头部预测公司雇佣的设计师人数甚至超过许多服装公司本身。\n\n### 媒体（Media）\n时装秀曾是小圈子邀请制的私密活动,信息经严格筛选的记者过滤后数月才外泄;如今时装秀已变成主要为吸引媒体关注而精心设计的\"马戏团式\"表演。**主编权力**极大(如Vogue主编Anna Wintour),能左右设计师与模特经纪公司的资源分配。**行业贸易刊物(trade publications)**(如美国《Women's Wear Daily》、英国《Drapers》)对设计师而言比时尚生活类\"光面杂志\"(glossies)更重要,因后者内容往往滞后。\n\n### 互联网与调研方法（The Internet / Internet research）\n互联网重塑了时尚产业的信息获取、寻源与需求预测方式。学生调研的关键主题包括:产品类型与创意风格调研、价格比较、消费者画像、市场规模与细分、推广物料、供应链问题。\n\n**版权与学术诚信**——网络图片不因\"免费可见\"就意味着可以随意复制编辑;英国版权法\"教育例外\"条款允许考试/课程作业中使用受版权保护材料(须完整标注来源),但不适用于表演类音乐;允许的\"合理使用\"范围包括:期刊/报纸单篇文章一份、书籍单章或不超过全书5%、插图照片配合正文使用等。高校普遍使用Turnitin等软件查重,抄袭将受到严厉处罚。研究中需区分**一手资料(primary sources,如实物、访谈、问卷)**与**二手资料(secondary sources,如学术期刊评论分析)**,并遵循统一的引用规范(如哈佛引注体系Harvard Referencing System)标注网址与访问日期。\n\n---\n*(第一章至此结束。全书还有第二至七章:从生产到市场 From manufacture to market、人体与插画 The body and illustration、色彩与面料 Color and fabric、工作室实践 In the studio、课题与评估 Assignments and assessments、毕业设计与职业发展 The final collection—and beyond。将在下一批继续整理。)*"

      "body": "### 历史背景（Historical background）\n1829年缝纫机发明使服装规模化生产成为可能;1850年Levi Strauss开始为淘金者制作牛仔工装裤。早期采用\"外发计件\"(送到工人家中制作),后为控制质量、节省运输成本逐渐集中到工厂,1859年Isaac Singer发明脚踏式缝纫机后,缝纫机在家庭和工厂全面普及。工厂\"**计件工/分段工(piecework/section work)**\"制(一人只负责一道工序)至今仍是最主流的生产组织方式。1921年电动缝纫机问世大幅提升女装产能,\"homemade(自制)\"一词首次带上\"不够精致\"的贬义色彩。二战期间欧洲工厂被征用于军需生产,战后英国留下大批适合\"大批量中等品质\"生产的工厂,而受战争破坏更严重的意大利、法国因获得美国及\"共同市场\"资助,反而发展出以家庭作坊为基础的高品质小单位生产网络。\n\n### 当代制造（Manufacture today）\n新技术使一套标准尺码西装裁剪缝制仅需约90分钟(定制西装手工工序多达200道,需三天);计算机辅助设计(CAD)可实现激光裁剪与个人尺寸定制;日本工程师研发的电脑\"整体针织\"技术可在45分钟内织出含领口口袋的完整毛衣。全自动生产线在袜类、运动服领域较普及,但机器人处理柔软面料仍容易出错。\n\n**准时制生产(Just In Time, JIT manufacturing)**——通过加快各环节响应速度实现快速补货;1990年代美国大型供应商与零售集团合作建立电子销售点系统(EPOS),配合通用产品条码(UPC)追踪销售、快速调货。零售商日益倾向于不压货,偏好能\"随卖随供\"或接受\"售罄退货\"(sale or return)条款的供应商。中端市场从下单到到货周期约10周,若面料现货充足且工厂分批交货(而非等全部做完一次性发货),周期可大幅缩短。\n\n### 商品细分（Merchandise segmentation）\n服装业传统上分为三大板块:**女装、男装、童装**。设计师品牌约占服装公司总数的30%,但仅占总销售额不到10%。\n- **女装(Womenswear)**——最大细分市场,占约57%市场份额,75%的设计师公司专注此领域;竞争最激烈,款式更新最快,对JIT快速反应的要求最高。\n- **男装(Menswear)**——约占24%市场份额且持续扩张;上世纪西装占男装购买量一半,如今男性个人服装支出占比虽降低(转向数码产品、运动、度假),但购买频次更高、偏好休闲舒适;欧洲男装设计更具冒险精神,美式设计则擅长打破正装与休闲装的界限。男装廓形与面料变化相对缓慢,更依赖logo品牌辨识度与细节做工取胜。\n- **童装(Childrenswear)**——最小细分市场,按年龄/尺码划分;休闲化趋势明显,正装校服类需求下降;家长最看重安全性、耐用性与多用途;儿童品牌意识低龄化趋势显著(研究显示4岁儿童已能识别Nike、Tommy Hilfiger等品牌);Gap旗下BabyGap/GapKids等主流品牌纷纷布局童装市场。\n\n**市场细分层级(欧美对比)**——欧洲市场按价格/品质/目标客群划分为:高定/设计师级/中端/大众/预算级；美国市场划分更细,女装从Missy(经典)到Junior(少女)、Moderate(中档)、Budget(预算)、Private label(自有品牌)、Mass market(大众)多层并存;男装则更多按\"生活方式\"而非纯价格分层(定制Bespoke/设计师/街头/运动/休闲各成体系)。\n\n### 生产者类型（Types of producer）\n时尚产业三大生产者类型:\n1. **制造商(Manufacturers,又称垂直生产商vertical producers)**——包揽买布、设计、制作、销售交付全流程,质量管控强、品牌独立性高,但管理成本也高;高级定制屋和量身定制裁缝(bespoke tailoring)属此类,常\"前店后厂\"经营。\n2. **批发商(Wholesalers)**——负责设计、采购面料、规划裁剪销售交付,但**不实际生产**,而是外包给CMT(裁剪-制作-镶边,Cut Make and Trim)代工厂,灵活但对品质、价格、抄版控制力较弱(美国以外地区称wholesaler为\"jobber\")。\n3. **承包商(Contractors)**——规模不一,从大型代工厂(\"the big boys\")到中型CMT工坊乃至个体外发工(outworker)。大型代工厂承担从打版到包装交付全流程,常为多个零售商贴牌代工(美国称**私有品牌private label**);CMT工坊多为30人以下家庭作坊,不负责设计/销售风险;外发工多为在家工作的熟练女工,常见于订单量太小无法交给CMT的独立设计师。\n\n**离岸生产(Offshore production)**——因东亚等地区人工成本低,1990年代Calvin Klein率先将生产整体迁往东亚,此后众多品牌跟进,大企业通过代理/经纪机构监督海外生产质量与进度。\n\n**术语补充**:\"docket\"(生产订单/交货批次单)——按打(dozen)计量,12打为一\"gross\"(通常是最小起订量);过去样衣确认后会用金属封条固定防止调包(\"sealing sample\")。\n\n### 供应链与电商（Supply chain / E-commerce）\n互联网通过电子数据交换(EDI)和库存单元(SKU)条码系统实现供应链实时同步,这种\"敏捷(agile)\"供应链管理模式催生了**快速反应时尚(Quick Response, QR)**——即根据销售数据迅速补单相似畅销款。供应链方向甚至出现\"逆转\"(reverse supply chain):零售商可反向要求供应商按其需求定制面料款式,即\"推(push) vs 拉(pull)\"模式的转变,Zara所属的西班牙Inditex集团正是这一模式的代表,能将新品交付周期压缩到一周。\n\n**电商(E-commerce)**分为B2B(企业对企业)和B2C(企业对消费者)两条线,配合ERP(企业资源计划)和PLM(产品生命周期管理)系统打通设计、生产、库存、销售、物流各环节数据。\n\n**大规模定制(Mass-customization)**——通过预设\"核心组件菜单\"(不同颜色/材质/标签组合)实现规模化的个性化生产,在变化较慢的男装领域(如Bivolino定制衬衫)应用较成熟,并逐渐拓展到女装。更进阶的**协同设计(co-design)**允许消费者通过线上配置工具、3D人体扫描数据参与设计定制,数据可直接传输至激光裁床自动裁剪面料——即\"电子定制(e-tailoring)\"。\n\n### 零售商类型（Types of retailer）\n- **独立店(Independents)**——门店少于10家,美国称\"夫妻店(mom and pop stores)\";房租成本压力大,常靠\"设计独家性\"取胜。\n- **连锁店(Multiples)**——如Primark、Gap,占据核心地段,可批量采购或贴牌生产,靠品牌形象、会员卡、促销吸引中端消费者。\n- **百货商店(Department stores)**——19世纪末兴起,以恢弘建筑与优越地段著称,时装通常占其商品比例约70%;年轻消费者对其\"老气\"形象接受度降低。\n- **专柜/委托销售(Concessions)**——商场将场地租给品牌自行经营(自带员工/陈列),商场收取固定比例分成,规避库存风险,是新锐设计师低成本试水零售的常见方式。\n- **特许经营(Franchises)**——加盟商购买区域经营权,统一价格与形象,总部无需承担当地用工管理压力。\n- **超市时尚(Supermarket fashion)**——2005年WTO关税调整后,沃尔玛、家乐福等大举进入服装零售,英国Asda旗下George系列一度超越Marks & Spencer成为英国最大服装零售商;超市在童装领域份额尤高(约占学生校服/鞋类销量三分之一)。\n- **折扣店(Discounters)**——低价收购代工厂剩余面料(cabbage)、取消订单库存,通常会拆除原品牌标签。\n- **工厂店(Factory shops)**——源自工厂将残次品/库存优惠内部员工的传统,1980年代经济衰退催生大量工厂直销村(outlet village)。\n- **市集(Markets)**——常出售\"二等品\"(seconds),交易多为现金、消费者保障较弱;跳蚤市场(如伦敦Portobello Road、纽约Hell's Kitchen)是学生寻找古着灵感与二手面料的宝库。\n- **邮购(Mail order)**——历史悠久(如Sears Roebuck服务美国拓荒者),衍生出\"杂志型商品目录\"(magalogs)。\n- **网络购物(Online shopping)**——2000年线上零售仅占总零售额0.1%,如今已超5%;2007年服装已成网购第四大品类;ASOS、Net-à-Porter是早期成功的线上时尚零售代表;RFID射频识别标签、AI推荐系统、虚拟试衣镜等技术正推动线下门店数字化(\"one-to-one marketing\"一对一精准营销)。\n\n### 价格档位与价格周期（Price points / The price cycle）\n> \"富人的太太穿Armani,他的情妇穿Versace。\"——时尚谚语(生动说明同一价格区间内不同品牌的市场定位差异)\n\n设计师需清楚了解本品牌所处的价格带(price band)以及竞品的定价策略,才能做出恰当的产品设计与成本控制决策。价格周期(price cycle)描述从新品上市高价、到中期调价促销、再到季末清仓折扣的完整生命周期规律。\n\n**价格周期完整链路**:新款上季初以最高预期价格进入自营店或独家供应商(制造稀缺感)→随后扩大供货、成本更低面料复刻、价格下调→数周内相似款/仿款涌入商场竞价销售→最终廉价劣质仿品出现在市集摊位,原价难以为继→过季/滞销商品降价处理或流入折扣店、仓库特卖乃至回收。设计师品牌必须不断以早于市场的新品驱动消费兴趣。\n\n### 企业标识与品牌（Company identity and branding）\n品牌、商标、Logo需付费注册以获得排他使用权(可国际注册);部分品牌甚至注册特定设计细节(如Chanel的绗缝链条包、Levi's牛仔裤后袋双线迹)。Nike以35美元向设计学生Caroline Davidson买下\"对勾\"Logo,如今每年为保护和推广该标志投入数百万美元。\n\n**版权(Copyright)**——服装设计中很难界定\"原创起源\",许多经典款式(男衬衫、六片裙、喇叭裤)已进入公有领域(public domain)不受保护;但材料/裁剪工艺上真正的创新可申请版权或专利保护,归属期通常为作者终身+70年。设计师只能为**设计图稿**申请版权(而非成品服装本身),需签名、盖邮戳日期、标注版权符号并交存银行或律师处存档。授权费(license/royalty)行业惯例为批发价的3%-8%;Pierre Cardin是授权经营的代表人物,1970年代其品牌授权商多达800余家,涵盖从服装配饰到罐装沙丁鱼等各类商品(过度授权也曾稀释其品牌形象)。\n\n**仿冒(Counterfeiting)**——版权保护存在国界限制(美国版权仅在美国境内有效);东亚(尤其印尼、菲律宾、台湾地区曾被指知识产权保护薄弱)是主要仿冒源头;美国历史上长期存在\"进口后迅速仿制高定礼服\"的传统。\n\n**对学生的启示**——须清楚区分\"受启发/致敬(influence, homage)\"与\"抄袭(plagiarism)\"的界限:借鉴他人元素时必须明确标注来源,并在此基础上构建自己的创作主张;高校对抄袭行为(包括请人代写论文)采取零容忍态度。多数院校规定在校作业成果归学生本人知识产权所有,但若由企业赞助或获奖,应事先书面约定权属与作品保存/处置方式。"
    },
    {
      "id": "book2-ch4",
      "title": "Fashion Design（服装设计）中英对照笔记 / 第三章 The body and illustration（人体与插画）",
      "tags": [
        "chapter"
      ],
      "body": "### 灵感之源:人体（Inspiring bodies）\n服装设计师需理解解剖学基础——肌肉如何附着于骨骼、如何随运动联动——这决定了面料如何贴合或悬垂于身体。人体正面轮廓呈对称三角形(头部为顶点)。女性人体轮廓各维度更浑圆,经典化后常被夸张为\"沙漏型\"(hourglass);男性则呈\"倒三角\"宽肩轮廓。**女性身体历史上长期承受束腰、缠足等痛苦改造以迎合审美标准**。\n\n**\"完美身体\"的媒体建构**——现今时装模特体重比平均人群低约23%(20年前这一差距仅为8%),导致大众对\"正常\"身材产生错误认知;广告普遍使用数字技术修图(拉长腿、磨皮、瘦腰)制造不可能达到的\"完美\"标准。1960年代Twiggy式\"未发育感\"消瘦造型与近年\"丰满特例走秀\"(如2010年Mark Fast秀场大码模特)反映了审美标准的历史摆动。\n\n**情绪与姿态(Emotion and gesture)**——时装摄影(不同于传统架上绘画的静态摆姿)发展出一套独特的\"姿态语言\"(从Cecil Beaton到Corinne Day等摄影师),模特需学习通过步态、摇摆、噘嘴等非语言方式传达特定情绪。**设计师的\"理想模特\"选择**因系列而异:如Vivienne Westwood 1997年选择丰满的Sophie Dahl突显女性曲线;Alexander McQueen 1998年启用运动员/双腿截肢者Aimée Mullins,为她定制手工雕刻假腿走秀,极具突破性地拓展了\"美\"的定义边界。\n\n### 绘画与插画技法（Drawing and illustration）\n时装绘画有别于传统写生,分为两大方向:**自由插画(free illustration)**与**结构性/示意图绘制(schematic drawing)**。速写(croquis,发音\"crow-kee\")是快速捕捉设计意图与氛围的核心工具,不追求写实肖似而追求\"神韵\"(mood/look)。\n\n**时装人体比例的夸张惯例**——真实成年女性头身比约为1:7.5,时装画则拉长到1:8.5-1:10(主要拉长腿部而非躯干),目的是为服装细节(口袋、接缝线)留出更多展示空间,同时强化优雅感;男性时装画腿部拉长幅度通常小于女性,上半身占主导、姿态张力(attitude)弱于女性画法。\n\n**速写基本步骤指引**(节选):\n1. 先在脑中(或轻轻打稿)确定头骨骼与整体姿态\n2. 快速勾勒头顶水平线、下巴水平线,沿脊柱画一条线至胯部(全身中点)\n3. 想象一条重心线,从头部中心垂直落到两脚间中点,注意肩线与骨盆线常朝相反方向倾斜以体现\"姿态感\"(attitude)\n4. 加三条水平参考线:肩线、腰线、腿根线,标示身体倾角\n5. 膝盖应位于胯到脚长度的正中点,不能画得过低;双脚不能画得过小(应与头部同长)\n6. 腰部比真实收窄以强调女性化曲线;手臂通常画得远离身体而非贴身遮挡轮廓\n7. 先用淡线定位所有肢体曲线与平衡关系,再用较重的线条流畅地连接,尽量保持曲线感、避免直角\n8. 最后在人体基础上叠加服装细节,阴影处理需呼应姿态动势与面料垂坠方向\n\n时装速写的原则是**简化(simplification)**——阴影仅用于表现体积和重量感,不需通体渲染面料质感,纽扣拉链等关键细节需保留;常省略背景/地面,仅用一条水平线暗示\"落地感\"避免人物看起来\"漂浮\"。绘制速度本身即传达设计的自信与灵动感,因此课堂上会鼓励\"快速造型\"练习,以摄影/杂志姿势为参考,或同学互相摆拍作为速写素材。\n\n### 计算机辅助设计（Using computers）\n计算机处理视觉信息主要有两种方式:\n- **矢量图(Vectors)**——基于数学运算(如Adobe PostScript语言),缩放不失真、文件体积小,适合技术图、规格图,便于全球范围内准确传输;常用软件Adobe Illustrator、CorelDRAW;男装行业尤其依赖矢量图规格文件与Logo制作。\n- **位图/栅格图(Bitmaps)**——由像素构成,适合照片等写实图像,但**分辨率依赖**(放大易模糊、缩小易丢失细节);适合处理扫描的手绘稿、面料小样、纽扣配件贴图等。\n\n### 数字化设计与电子作品集（Digital designing and e-portfolios）\n如今设计师普遍需具备制作数字作品集(e-portfolio)、PPT演示及在线学习平台(VLE)展示能力,电子作品集比传统纸质作品集更灵活便携。\n\n**CAD/CAM打版系统**——Pattern Design System(PDS)可将手绘/传统打版数字化(通常存为.DXF矢量格式),建立可复用的**版型库(pattern library)**,大幅提升系列产品线开发效率;PLM(产品生命周期管理)系统支持跨地域团队协同,减少沟通误差与等待时间。**3D虚拟样衣技术**(如Lectra U4ia、Browzwear V-Stitcher)可在正式裁剪面料前预览版型合身度与面料垂坠效果(通过\"热力图\"heatmap显示面料过紧区域),大幅降低试错成本;结合人体扫描与虚拟数字人(avatar)技术,\"虚拟秀场\"正逐渐成为现实,CAD/CAM技能已成为衔接创意与技术生产的高薪岗位核心能力。"

      "body": "### 色彩基础（Color basics）\n消费者选购服装时的**首要反应是色彩**,其次才是设计款式与手感,最后是价格考量——因此色彩是系列企划最早需要决定的元素之一。色彩具有强烈的生理与心理效应:蓝绿色(天空/草地色)可降低血压,红色等高强度色可加速心率;白色使人感觉寒冷,黄色阳光友善,灰色显得干练或压抑。小黑裙象征精致优雅,小红裙象征趣味性感。**色彩含义存在强烈文化差异**:西方多数地区认为绿色不吉利,印度传统婚礼用绯红而非白色,中国传统丧服用白色而非黑色。\n\n**色彩科学定义**——1666年牛顿(Isaac Newton)首次用棱镜将光分解为七色光谱(红橙黄绿蓝靛紫),并构建六色色环;1730年Jacques-Christophe Le Blon发现三原色(红黄蓝)两两混合得三间色(橙绿紫),三原色全混得棕色/灰色系(称三次色)。色彩三属性:\n- **色相(Hue)**——基本颜色类别,如红、蓝、绿\n- **明度(Value)**——颜色明暗程度,浅色称tint、深色称shade\n- **纯度/强度(Intensity)**——色彩的鲜艳/浑浊程度,加水稀释颜料会降低纯度\n\n行业标准配色系统:**PANTONE专业色彩系统**与**SCOTDIC(国际纺织品色卡标准)**是时尚纺织业最广泛使用的商业色彩匹配体系。\n\n### 建立色彩系列（Creating a color palette）\n一套时尚色彩系列(gamme)通常包含4-10种颜色,部分作为基础主打色、部分作为点缀色或印花用色。选色需考虑目标市场消费者的肤色/发色/瞳色适配度(黄绿色调易反射到皮肤上,不适合多数肤色,常仅用作点缀色);浅中色调组合营造沉稳内敛效果,强对比色调则更引人注目。\n\n### 色彩预测（Color forecasting）\n色彩预测已成为庞大产业(不仅影响服装,也影响化妆品、家居、汽车业)。染料公司需提前1-2年备货应对流行色需求,预测机构收集全球销售数据与市场动态,每年两次(欧美)开会总结趋势。主要权威机构:CAUS(美国色彩协会)、British Textile Color Group、ICA(国际色彩权威机构)、CMG(色彩营销集团)。**色彩周期规律**:经济繁荣期偏好明快跳脱的色彩,萧条期偏好保守深色;暖色调与冷色调之间约存在7年循环周期,鲜艳多彩与低饱和中性色之间存在15-25年长周期;女装色彩迭代通常快于男装;奥运年常带动运动风原色进入休闲装市场;黑色是冬季永恒流行色,白色是夏季标配色。从选色到成品上架的**交货周期(lead-time)**通常需6-18个月。Benetton凭借针织品快速供色能力打造\"United Colors of Benetton\"品牌形象,并出版Colors杂志呼应色彩与文化议题。\n\n### 纤维种类（Fiber types）\n纤维/纱线是面料的原材料,分三大类:**动物性(animal,如毛发)、植物性(vegetable,纤维素纤维)、矿物性(mineral,合成纤维)**。纤维长度(称为staple,短纤长度)、纺纱方式、纱线直径共同决定面料特性;混纺可改良主纤维的固有属性(如棉麻吸湿但易皱,混聚酯后干得快、更易熨烫平整)。\n\n**常见纤维速查表(中英对照,节选)**:\n- **Cotton 棉**——原料为棉花种子头,成本低、分布广、易染易护理\n- **Linen 亚麻**——取自亚麻茎秆,凉爽耐用吸湿,但极易起皱\n- **Silk 丝**——蚕蛹吐出的连续长丝,光泽好、最高端奢华面料\n- **Wool细分**——Merino美利奴羊毛(西班牙原产,顶级羊毛)、Cashmere羊绒(亚洲山羊幼年绒毛,奢华用)、Mohair马海毛(安哥拉山羊毛,针织/西装用)、Angora安哥拉兔毛、Alpaca羊驼毛、Lambswool一岁内羔羊毛\n- **Nylon 尼龙**——1934年发明,首个完全合成纤维,由杜邦(DuPont)开发上市,强韧多用\n- **Polyester 聚酯**——1941年ICI与杜邦合作开发的廉价易护理石化纤维,可回收再造成抓绒(polar fleece)\n- **Lycra/Spandex 莱卡/氨纶**——杜邦首创的合成弹性纤维(美国称Spandex)\n- **Viscose 粘胶纤维**——木浆与烧碱制成的有光泽半合成多用途纤维\n- **Tencel 天丝**——环保人造纤维,强度高于棉,垂坠感近似丝绸\n\n### 面料选择与国际洗涤标识（Choosing fabrics / Textile Care Labeling Code）\n面料之于服装设计师,如同颜料之于画家,是创作表达的核心媒介。选择面料需综合考虑重量手感、价格、货源、性能、品质与交期,设计师必须对面料的实际表现有合理预期——**不能强行把不适配的面料塑造成不兼容的款式**(无论从工艺还是视觉效果上)。\n\n法律规定所有商业成衣必须标注纤维成分含量标签(按含量从高到低排列,占比≤7%的装饰性材料可豁免标注);欧洲GINETEX标签体系(即**国际纺织品护理标签代码**)被主要生产国广泛采用,与家用洗衣机/烘干机图标体系一致。**面料仿冒**是行业一大问题,建议购买正品面料时索要产地信息卡(header/swatch)并注明成分与克重;设计师John Galliano据说会用玻璃罐收藏他用过的每一种面料小样。\n\n### 面料构造（Fabric construction）\n纤维制成面料的两大主要方式是**机织(weaving)**和**针织(knitting)**;其他方式(毡制felt、网眼net、蕾丝lace、粘合bonded)统称**非织造布(nonwovens)**。\n\n**机织(Woven)**——经纱(warp,纵向)与纬纱(weft,横向)垂直交织而成;布边(selvage)通常织得更紧密以稳定结构;因经纱预拉伸,机织物纵向稳定性好,裁剪时通常使衣身走向平行于布边(经向),横向的额外延展性有助于臀部、膝盖、肘部等部位活动。常见组织:\n- **平纹(Plain weave)**——最常见、最结实,如泡泡纱、府绸、法兰绒、格子布、雪纺\n- **斜纹(Twill weave)**——纬线至少跨过两根经线形成对角纹理,如华达呢、斜纹布,人字纹(herringbone)是其变体\n- **缎纹(Satin/sateen weave)**——光滑有光泽、垂坠感强\n- **绒面(Pile weave)**——灯芯绒、天鹅绒、仿毛皮等\n- **提花(Jacquard weave)**——提花机按穿孔卡片程序控制每根线的起落,可织出锦缎、织锦缎(brocade/damask)等复杂图案,多用于晚装\n\n**针织(Knitted)**——横向为**横列(courses)**、纵向为**纵行(wales)**,双向延展性好、垂坠抗皱,但也容易变形走样;结构透气,适合内衣、运动装;细密针织因贴身效果常用于晚装。机织针织尺寸单位为**支数/针距(gauge, \"gg\")**,指每英寸/厘米针数。常见针织类型:单面平针(Single jersey)、双面平针/罗纹互锁(Double jersey/Interlock)、罗纹(Ribbing)、费尔岛提花(Fair Isle)、提花针织(Jacquard)、嵌花(Intarsia)、经编(Warp knitting,多用于泳装/运动/内衣,不会脱散抽丝)。\n\n### 面料研发与产业周期（Fabric development / The fashion-design cycle）\n纺织业持续研发新型合成材料(如Tencel、Tactel、Sympatex、Coolmax等),并通过后整理工艺(finishes)提升机能性(防水防火抗皱)或装饰性(磨毛、钉珠、刺绣)。面料印花是最常见的装饰手法(扎染batik、热转印sublistatic、丝网印刷screen-printing等)。**纱线/面料研发提前期极长**:纱线设计师通常提前约18个月向欧洲市场展示产品线,面料商/贸易商提前3-12个月展示系列,设计师必须理解并适应这种漫长的研发验证周期。\n\n**设计周期(The fashion-design cycle)**——高端时尚业遵循经典两季制:3-9月完成设计/排产/打样,9月发售春夏系列;10月-次年2月完成设计/排产/打样,2月发售秋冬系列;但连锁店/百货商店为满足消费者对\"常换常新\"的期待,不断要求更频密的\"到货批次\"(drops),侵蚀了传统两季节奏;美国市场进一步细分出两个\"过渡季\"及假期专属销售窗口(如泳装在元旦后即上市对应\"游轮季\"cruise period);法语称九月开学季为\"la rentrée\"(回归),对应传统欧洲长假后补货职业装的销售高峰。设计师因此常常需要同时筹划长达三个季度的产品线。"

      "body": "### 设计的元素与原则（The elements and principles of design）\n设计的本质是把已知元素以新颖有趣的方式重新组合。**服装设计三大元素**:\n- **廓形(Silhouette)**——服装整体外轮廓,是观者首先感知到的视觉印象(远观时先于细节被察觉),一套系列不宜有过多廓形变化(会稀释整体印象);历史上廓形常带有强烈时代烙印(如15世纪高腰蓬裙暗示\"孕感\"以象征生育力;1720年代裙撑pannier/farthingale宽大到难以过门;1947年Dior\"新风貌\"收腰大摆裙震惊战后世界)。\n- **线条(Line)**——引导视线走向,竖线显瘦拉长、横线显宽,斜裁线条(bias cutting)营造流动感;曲线增添丰满女性化气质。\n- **比例(Proportion)**——各部分与整体的视觉关系,可通过移动接缝/细节位置制造身形错觉;设计师需明确目标顾客的真实体型(而非只服务\"完美身材\"的时装精英)。\n- **质感(Texture)**——面料本身的视觉与触觉属性,许多设计师习惯先被面料手感启发再画设计稿,而非先画图再找面料。\n\n**设计八大原则(The principles of design)**:\n1. **重复(Repetition)**——设计元素多次出现以统一整体(如均匀分布的纽扣);打破重复(不对称设计)则制造突兀吸睛效果\n2. **韵律(Rhythm)**——如音乐般通过规律性元素或印花图案制造节奏感\n3. **渐变(Gradation)**——元素尺寸/密度渐次变化(如亮片从裙摆向上逐渐稀疏),引导视线转移或掩饰身形特征\n4. **辐射(Radiation)**——设计线条从一个中心点向外发散(如太阳褶裙)\n5. **对比(Contrast)**——制造视觉焦点转换(如粗花呢外套配丝绸衬衫),需谨慎安排位置以免喧宾夺主\n6. **和谐(Harmony)**——强调相似而非差异,柔软圆润的材质更易营造和谐感;意大利时尚以此见长\n7. **平衡(Balance)**——人体垂直轴对称,视觉天然追求平衡;不对称设计需用其他部位的细节呼应制衡,日本/比利时后现代风格则刻意打破这一原则以表达\"无序美学\"\n8. **身体感知(Bodily sensation)**——服装不仅是视觉体验,更是触觉体验;面料质感差异(如皮草、丝绸、皮革)能唤起特定情绪与感官联想\n\n### 测量与人台（Taking measurements / The dress form）\n人体几乎从不完全对称(肩膀、胸部两侧常有高低差),精确打版/量体需注意分别测量左右两侧数据。关键测量点(节选,含中英文对照):Neckline颈围、Bust/chest胸围、Shoulder point肩点、Waistline腰围(常需用松紧带找到真实腰线位置)、Armhole scye袖窿弧、Hips臀围(最宽处可能在腰下1-30厘米不等)、Rise裆长、Center front/back前后中心长。\n\n### 打版工具与平面打版（Pattern-drafting tools / Flat pattern-drafting）\n基础打版工具:铅笔与橡皮、红黑记号笔、卷尺、滚轮(tracing wheel)、裁纸剪(paper shears)、剪口钳(pattern notchers)、锥子(awl)、打孔器、大头针、黑色缝份带。**基础纸样(Blocks)**是无缝份的基本人体版型,是所有款式变化开发的起点;通过在基础纸样上做**省道转移(dart manipulation)**、切展等操作发展出新款式版型。开发出的纸样先制作**白坯样衣(muslin/toile)**试穿调整,确认无误后再用正式面料裁剪成样(sample)。\n\n### 立体裁剪（Draping on the stand）\n立裁(draping,英式称modeling)是将面料直接覆于人台之上,通过大头针固定、拉扯塑形来直接\"雕塑\"出立体造型的技法,尤其适合处理不对称、斜裁或高定级别的复杂造型(相较平面打版更直观地呈现面料在人体上的实际悬垂效果)。需注意**面料丝缕方向(fabric grain)**——直丝缕(经向)通常对齐人体中心线以保证稳定性,**斜裁(the bias)**(布料45度角方向)则赋予面料更强的延展垂坠性,是许多晚装与合身连衣裙的核心技法。\n\n### 缝纫基础（Sewing / Seams and zippers）\n本章后续详述了基础缝制工艺:各类接缝形式(seams)、拉链安装工艺(zippers)等内容,属于强动手实操性技能,建议结合实物练习掌握,本笔记仅作提纲式提示,具体针法与工序请参考原书图解及课堂实践。\n\n### 里料、针线与定制工艺补充（Supporting fabrics / Tailoring / Notions）\n辅助面料(**衬布interfacing、里布lining**等)用于塑形、加固、防止变形;不同面料(雪纺、乔其纱、真丝电力纺 vs. 棉坯布、里布、华达呢等厚重面料)需搭配不同规格的针与线。**定制工艺(Tailoring)**指西装外套等结构性服装的精细内部构造技法(如胸衬、垫肩)。**辅料统称Notions**,涵盖纽扣(buttons)、各类门襟/前门襟开合方式(front fastenings)、口袋(pockets)等功能与装饰细节。最后需重视**试穿与成衣呈现(fit and garment presentation)**——即成衣完成后的整烫、悬挂、展示效果,直接影响作品的专业观感。章节结尾附有延伸阅读书目与行业资讯网站资源(Book Moda、Collezione、Gap Press等国际潮流资讯刊物)。"

      "body": "### 什么是课题作业？（What is an assignment?）\n课题式教学(又称project/unit/module)是服装设计教育中最主流、最有效的教学方式,通常持续2-10周,融合调研与实操技能。**设计课题的六个典型步骤**:①调研与灵感采集(Research and inspiration)②设计与筛选(Design and edit)③打版(Cut patterns)④面料打样与制作白坯样衣(Sample fabrics and create muslins)⑤制作原型样衣与修正(Make prototypes and refinements)⑥成果展示与文档记录(Finished presentation and documentation)。\n\n**课题类型(Types of project)**:\n- **个人课题(Individual project)**——由专职或客座导师布置,考察个人化的独立应对能力\n- **赞助课题(Sponsored project)**——由企业(常为面料/服装公司)出题,由校方与企业共同评分;需注意**学术评价标准与商业评价标准可能存在分歧**\n- **竞赛课题(Competition project)**——企业或外部机构面向全国高校发起,奖品常包括游学资助或实习offer;提交的原稿常不予退还,**务必自留复印件存档**\n- **团队课题(Team project)**——需与(可能互不相识的)同学协作,常涉及市场营销、标签、成本核算等综合内容,压力较大,有时还需互评或自评贡献度\n\n**学习成果考核标准(Learning outcomes)通常包括**:创造性独立研究与应用能力、设计问题分析与解决能力、创意冒险精神、技法/材料/图像/色彩的探索能力、个人风格综合能力、对行业角色与方法论的理解、独立/团队协作能力、视觉/口头/书面呈现能力、时间管理与自我评估能力。\n\n### 课题设定的常见维度（Occasion / Muse / Target market / Materials）\n- **场合与季节(Occasion and season)**——需明确设计针对的时段/场合/季节;**时尚设计师必须创造并确认潮流,而非追随潮流**\n- **缪斯或目标顾客(Muse or customer)**——想象为特定顾客画像(体型/年龄/性别/背景/生活方式/消费力)设计,选择一个能让设计效果最大化的具体人物原型\n- **目标市场(Target market)**——需清楚不同细分市场特点(参见第二章),部分设计师钟情中端市场的设计挑战,部分专精于经典品类经营多季的品牌忠诚度,少数则专攻运动装/内衣/晚装等细分领域\n- **材料与面料选择(Choice of material and fabric)**——课题常限定或引导面料选用方向,是训练\"命题创作\"能力的重要环节\n\n### 成本核算（Costing）\n零售价主要由面料成本+制作成本+零售商利润率构成;设计师价位段常见**加价倍率(markup)**约为120%,零售商在此基础上再加价至少160%。面料宽幅仅几厘米的差异就可能大幅影响整体核价,需要相应调整版型;辅料/装饰(trimmings)成本可能层层加价至零售端翻两番,导致定价失去市场竞争力。校内课题虽不强制严格核算成本,但**巧用预算面料做出富有创意的设计,往往比用昂贵面料做平庸设计更受青睐**——旧物改造、慈善商店淘货、跳蚤市场寻宝都是学生常用的巧思手段。\n\n### 灵感来源（Inspiration）\n时尚是时代精神(zeitgeist)的镜像,设计师需保持感官全开:逛展览、逛店、泡吧、看电影、读书读报、参加派对、听音乐,尤其要**善于观察人群、捕捉社会审美的细微渐变**。灵感调研的常见起点包括:博物馆/美术馆/服装收藏与图书馆(历史与民俗服饰尤其富矿)、手工艺与民间艺术、亚文化社会思潮(音乐/电影/文学/戏剧/舞蹈)、生活方式主题(建筑/室内设计/社交场景)、成衣与高定秀场及潮流预测资料。\n\n### 个人创造力与风格（Personal creativity and style / Tapping creativity）\n心理学将创造性思维分为两种:\n- **聚合思维(Convergent thinking)**——聚焦已知信息,依靠技巧、组织与流程把问题收敛到可控范围\n- **发散思维(Divergent thinking)**——放松聚焦、调用潜意识与意象传达想法,需要\"敢于探索未知路径\"的勇气,即便暂时不明白为何某个方向会通向解决方案\n\n**\"代入他人视角\"练习**——课题有时要求模仿特定设计师风格或历史时期/裁剪手法进行设计,这种\"戴着别人的鞋走路\"练习有助于习得成熟技法并从中提炼自己的洞察,但须警惕过度依恋自己已有风格、保持学习的灵活性。**\"品味(good taste)\"是流动的概念**,部分靠直觉、部分靠习得的基本准则,顶尖设计师有时刻意挑战既有品味标准来制造冲击或幽默效果(如已故设计师Alexander McQueen)。\n\n> \"麦昆在校时,大家都在批评Galliano;轮到我在校时,大家都在批评麦昪;去年我回学校,发现大家在批评我。\"——设计师Andrew Groves\n\n### 呈现方式（Presentation: Sketchbooks / Tear sheets / Mood boards / Storyboards）\n- **素描本(Sketchbooks)**——服装学生必备工具,应长期随身携带并配合相机使用,记录灵感碎片、人物姿态、服装细节、色彩与环境印象;建议同时备多本不同尺寸/纸质的素描本(小本随身速记,大本用于深入写生或复杂构思),半透明**拷贝纸本(layout pad)**便于快速转描人体姿态与轮廓。\n- **剪报/参考图(Tear sheets/swipes)**——从杂志报纸等剪下的启发性图片,用于确立情绪基调,**但不能直接照抄**;二手书店常是独特素材的富矿;需警惕过度依赖复印图片导致作品呈现\"二手灰暗感\"。\n- **情绪板(Mood boards)**——收集素材后,将概念与意图以类似杂志排版的方式正式整理呈现,常用大头针固定在泡沫板(polyboard/foam core)上便于携带、直立展示、与导师讨论。\n- **设计草图(Design sketches)**——项目初期需在素描本或拷贝纸上快速画出大量\"粗稿\"(roughs),不满意的稿子也不要扔掉——也许一周后回看会有新发现。\n- **故事板(Storyboards)**——将情绪板、最终效果图、配套面料辅料及简要文字说明(主题/色彩/市场)整合为完整的\"设计故事\"呈现页,通常构成作品集的核心内容。\n\n### 评图环节（The crit）\n\"Crit\"(critique/评图)是导师评估课题成果的正式环节(部分院校避免使用\"critique\"一词,因隐含\"批评\"意味,改称\"final review\"或\"evaluation\")。形式多样:可能是小范围面对面评估,也可能是模特走秀式的迷你时装展示。评委关注的不仅是问题解决程度,还包括**平衡感、和谐度、原创性、面料辅料选择**及设计/实操能力的成长轨迹。\n\n> \"评图过程中学生需要认真倾听,学会从个人观点中提炼出真正有用的信息……评图现场具备团体治疗般的动态特质——通常积极正面,但偶尔也会有袒露心声和眼泪。我们都从中学习成长。\"——二年级时尚导师 Sally Calendar\n\n### 评分与评估（Marking and assessment）\n评估分两大类:\n- **形成性评估(Formative assessment)**——通过持续反馈与建议促进学习过程(如邮件沟通、非正式对话)\n- **总结性评估(Summative assessment)**——正式评级/打分,用于确认学习成果是否达标,常在课题结束时进行\n\n多数正式评估由多位教师共同评分并经**外部考官(external examiner)**复核校准,部分作业采用\"盲评\"(仅以学号提交)。英国教育体系相对更看重**学习过程**而非仅看最终成品/系列本身。评估的目的是帮助学生认清进步空间,**不建议过度关注分数或与同学攀比**,应聚焦自身成长轨迹。\n\n### 保持积极心态（Stay positive）\n批评与评判是进步的必经之路,但**不应把作品批评等同于人身攻击**;设计不能强加于人,只能被人接受,\"从失望中快速恢复的韧性\"和绘画缝纫技巧一样,都是创作者必备的核心素质。不要过度用力——长时间高强度专注加上睡眠营养不足反而会扼杀创造力流动;时装设计师Hussein Chalayan 1993年毕业设计大胆采用纸张、金属、磁铁材料制作服装并埋入土中半年任其锈蚀腐烂,秀场跑道下方电磁铁令面料出人意料地震颤摆动——是\"敢于冒险\"精神的经典案例。"

      "body": "### 毕业系列（The final collection）\n毕业设计系列(final collection)是整个学习阶段个人成就的集大成呈现,也是迈向职业世界的敲门砖;通常需要撰写设计理念说明(rationale),连同画稿、面料选样一并提交给校内外考官评审,该系列也常作为**面向媒体、潜在雇主或买手的公关材料**使用。到此阶段,学生应已明确目标市场与顾客画像,建立起个人设计辨识度。设计需兼具**方向性强的亮点单品**与**相对平实的基础单品**搭配,评图通过后进入打版制作阶段,过程中难免反复调整。\n\n> \"系列成品的最终样貌常和你最初的设想大不相同。它很难被完全掌控,仿佛有自己的生命,会脱离你的掌心。直到秀场当天一切组合完成,你看着它才惊觉:这是怎么发生的?\"——设计师Suzanne Clements\n\n### 校园时装秀（The college fashion show）\n校园时装秀的受众主体是教职工、同学、家长以及少数前来挖掘新人的赞助商/制造商代表,与专业设计师面向买手与媒体的商业秀性质不同,但许多院校仍认为**模拟真实秀场经验**对学生极具教育意义。并非所有院校都采用T台走秀形式展示学生作品,但所有院校都强调**专业作品集的重要性远高于秀场一瞬的效果**;年终作品展(exhibition)和数字视频/网络传播也是常见的自我推广渠道。\n\n**校园秀造型贴士(节选)**:\n- 保持概念简洁清晰,避免造型花招或选用差异过大的模特模糊了廓形/色彩/设计主旨\n- 提前与导师沟通展示形式(单人/成组、走秀节奏、是否有脱穿动作等),临场发挥花招会被扣分\n- 非职业模特可能因走位失误、姿态不自然或互相抢镜影响呈现效果,需要提前沟通并保持灵活(如临时更换服装搭配)\n- 复杂配饰(丝袜、腰带、首饰)耗时,需精确核对换装时间,并提前彩排排除意外\n- 提前给每套造型编号并附图示说明穿搭顺序,便于后台服装师协作,复杂扣件需现场演示\n- 发型/妆容常需在多名学生间统一协调；鞋履需提前联系供应商试穿合脚,并用胶带包裹鞋底防止磨损退货\n- 音乐选择需提前至少一个月开始筛选并\"跟走\"测试节奏,避免过长/过短或过于聒噪前卫\n- 特效(干冰、水花、撒花瓣等)需提前核实健康安全规定,避免呛咳或弄脏事故;谢幕环节使用效果最佳,避免弄脏T台影响后续环节\n\n### 出售作品与作品集技巧（Selling your collection / Your portfolio）\n公开展示作品时应备好名片(含姓名、院校、电话、邮箱)与留言簿以便跟进联系;若买家现场提出购买意向,不必当场报价——设计单品凝聚了大量心血,很难用客观价格衡量,建议先记录联系方式、与导师商议再决定(需留意院校作品版权归属规定,以及是否涉及批量生产订单/知识产权条款)。\n\n**作品集(Portfolio)制作要点**:\n- 建议准备两本:日常携带一本、面试专用一本;常见尺寸A1(适合大幅作品)、A2、A3(便携性最佳)\n- 数码作品集(光盘/U盘)在应聘要求CAD技能的岗位时尤为重要\n- 页面排布:按\"最佳/次佳/待定\"分类整理,像杂志排版般把最抓人眼球的作品放在开头,结尾用一个\"有话题性的收尾作品\"\n- 保持页面朝向统一(避免翻阅时频繁转头/转本);背景色以中性色为佳,避免频繁换色或过多黑色显得压抑\n- 作品仅四角固定(方便日后重新调整位置),标题另写在单独纸片上(不要直接写在画稿上,拼写错误会很尴尬)\n- 电脑打印标题比手写更显专业;**不建议标注日期**(容易显得过时)\n- 应聘特定岗位时,需针对性调整作品集顺序,并提前研究目标公司近几季作品与营销定位\n\n### 实习与工作实践（Work placement and internships）\n实习(placement/internship)通常薪资微薄,多从\"工作室初级打杂\"做起(试样、缝纽扣钉标签、接电话、跑腿买咖啡),但能积累的经验极具价值。**准时、条理性、勤奋与礼貌**是实习期间备受重视的素质;实习积累的人脉常常成为未来求职推荐信或资助的来源,不少学生因表现出色而在毕业后获邀回岗成为初级设计师。多数院校要求实习后提交评估报告(记录公司结构、产品特性与个人任务),建议实习期间坚持记工作日记积累素材。\n\n### 深造与研究（Postgraduate study and research）\n本科毕业后可选择留学深造或专精细分领域(市场营销、运动装、CAD等本科阶段较少深入教授的方向);申请前建议先联系目标院校了解具体要求,并实地参观毕业展/开放日。艺术类(尤其时尚类)研究型学位相对科学人文学科较少见,但不少大学的商科/纺织技术院系也接受时尚研究方向的申请课题。\n\n### 求职与就业前景（Networking / Employment prospects / Wages）\n时尚圈高度依赖**人脉与推荐(networking)**,许多顶级岗位从不公开招聘,而是靠导师推荐、猎头或行业口碑;熟练使用Word/Excel/PowerPoint被视为基本功。**就业形势严峻**:西方时尚纺织业管理与生产类岗位2000年后已萎缩约20%,预计到2012年再萎缩69%(受价格通缩、外包及2008年信贷危机影响),但中国、俄罗斯、巴西、土耳其、罗马尼亚、印度、柬埔寨、南非、墨西哥等新兴市场就业岗位在增长。**成为国际知名设计师的概率约为16万分之一**;设计专业毕业生中仅约1%最终成为真正意义上的\"设计师\",约70%在生产、零售、行政等相关领域找到令人满意的工作;近50%的毕业生因发展不及预期在5年内离开时尚行业。\n\n**薪资水平(以美国/英国为例,数据反映原书出版时期行情)**:设计师起薪偏低(美国约3.2万美元,英国约1.2-1.4万英镑),5年内可涨至约5万美元(英国约3万英镑),此后每年约再增1万美元;2008年美国四分之一设计师年收入低于4.2万美元,行业中位数约7.78万美元;纽约、巴黎等生活成本高地薪资水平通常更高。**全职受雇设计师收入通常比自由职业者更稳定**,但极少数最成功的自雇设计师收入可能数倍于顶尖受雇设计师。\n\n### 真实工作条件与自雇（Real working conditions / Self-employment）\n时装行业工时弹性大,旺季/秀前常需加班;美国以大型企业集团、工厂化生产为主,欧洲则以中小企业为主导。除专业技能外,雇主还看重**准时、谨慎、忠诚度、行业人脉、社交能力、记忆力与得体的自我形象管理**等\"软素质\"。美国/英国约四成设计师为**自雇(self-employed)**,新媒体催生了大量数字/CAD制作、时尚写作、网站运营等适合居家或兼职的新兴岗位;但自雇需自行承担投资、找活源、记账报税等全部经营责任,创业初期普遍面临亏损或低利润。\n\n### 职业路径总览（Career paths）\n时尚行业存在诸多不切实际的\"光鲜想象\",实际入行往往需从基层做起、循序渐进;**宁可选择薪资较低但培训完善、机会更广的知名企业,也不要贪图短期高薪但发展受限的岗位**——第一份工作的履历与推荐信含金量至关重要。设计师之外,时尚行业还有大量技术型、统计物流型、公关媒体型等多元职业路径可供选择。\n\n### 主要职业方向速览（Career paths overview,中英对照)\n- **女装设计(Womenswear)**——极少数天赋者能直接以设计师身份起步,多数从设计助理做起;需理解品牌DNA与预算,平衡经典款与新品搭配;自由职业(freelance)需求增长,独立品牌创业风险高但回报也可能极为丰厚。\n- **男装设计(Menswear)**——潮流演变比女装慢,变化更多体现在细节而非廓形/色彩,因此管理/生产/销售类岗位比设计岗位更多;正装定制与休闲/运动风格分野明显,需要设计师专精其一;15-35岁年龄段休闲风市场正在复苏。\n- **针织设计(Knitwear)**——比裁剪缝制类女装岗位更稳定(交期更长、沟通连续性要求更高);无需会手工编织(现代针织高度机械化),但需精通纤维/针法/工艺术语与CAD制版能力;分**全自动化生产(无缝针织,更省料环保)与劳动密集型手摇机生产**两条路径,中国、孟加拉国近年在此领域投入巨大。\n- **生产制造管理(Manufacturing and production management)**——需要懂印花/织造/针织技术的复合型人才,许多设计师从助理版师、生产助理、样衣工起步进入行业,起薪相对不错且历练价值高。\n- **买手与零售(Buying and retail)**——分**集中采购(centralized buying,连锁店间调货议价)与部门采购(departmental buying,更本地化)**两种模式;买手需要在创意直觉与商业务实间找平衡,年出差2-18次,需具备成熟专业形象、数字敏感度与协调能力。\n- **商品企划(Merchandising)**——负责买手背后的财务统筹(核准折扣、调配库存分布、店铺陈列布局),需要极强的组织能力与数字/表格处理能力。\n- **时尚公关(Fashion PR)**——负责为品牌制造媒体话题度、对接杂志/电视/电台,需要极佳的沟通能力、亲和力与\"派对社交\"能力,常需晚间应酬与出差,多语言能力是加分项。\n\n- **时尚新闻(Fashion journalism)**——媒体曝光是设计师成名最有效途径,顶级时尚记者(如Suzy Menkes、Anna Wintour)拥有巨大行业话语权;记者需兼顾自身专业判断与读者/广告主利益,秀场淡季还需策划选题维持公众关注度;桌面排版(DTP)与电子交稿已是基本职业要求。\n- **时尚造型师(Fashion stylist)**——与设计师不同,造型师负责为拍摄\"诠释\"整体look,并非越年轻越吃香(品味需要长期积累);多数造型师非科班出身,靠给杂志/摄影师做助理的漫长低薪学徒期磨练出来,是时尚媒体中最\"隐形\"却影响力巨大的幕后角色。\n- **时尚摄影师(Fashion photography)**——高竞争、高压力、多为自由职业,前期设备/工作室/差旅投入大且未必能快速回本;核心能力不仅是技术,更是审美眼光、光影理解与持续肾上腺素状态下的抗压力。\n- **趋势预测机构(Prediction and forecasting)**——为大型企业提供中立客观的趋势报告,提前18个月至2年布局,大型机构配备专职插画师;客户经理需频繁出差、对接创意人才、撰写统计分析报告,入行可从\"潮流猎人(trendspotter/cool-hunter)\"做起。\n- **时尚插画师(Fashion illustration)**——插画师未必是最擅长\"设计\"本身的人,更侧重构图、艺术表达与氛围捕捉;多为自由职业,媒体更偏爱摄影而非插画,但秀场速写在部分报纸仍有传统市场;需熟练掌握Photoshop/Illustrator及排版印刷知识,CAD技术规格类插画与三维可视化需求正在增长;插画师工作比设计师更为孤独,需要极强自律与日常练习。\n\n*(本章末尾还附有\"时尚与纺织业其他职业方向清单\"Additional jobs in fashion and textiles,列举了从学术研究、行政支持、经纪人、档案管理、财会、CAD/CAM技术员、面料工艺师、配色师、服装技师等数十种细分岗位的简要说明,鉴于篇幅本笔记不逐一列出,建议查阅原书该部分详细内容。全书正文至此结束,书末另有术语表 Glossary、打版缝纫术语表、院校名录及索引等参考资料。)*\n\n---"
    },

      "body": "*(节选自原书术语表 Glossary,按字母顺序排列,供快速查阅)*\n\n- **Apparel 服装**——美式英语中\"服装\"的常用说法\n- **Atelier 设计工作室**——法语词,巴黎的atelier分为flou(女装/礼服类)和tailleur(西装外套类)两种\n- **Avant-garde 前卫**——超前于时代的风格或理念\n- **Bespoke 定制西装**——男装个人量身定制服务\n- **Blocks 基础纸样/原型版**——无缝份的标准人体版型,是款式开发的起点(又称slopers)\n- **Boutique 精品店**——法语词,指有独特风格与氛围的小型独立店铺\n- **Bridge fashion 桥梁市场/中间市场**——介于设计师品牌与大众市场之间的价格带\n- **CAD/CAM 计算机辅助设计与制造**\n- **Cabbage 余料/边角料**——生产富余面料裁剪剩下的部分\n- **Classic 经典款**——历久不衰、细节变化很小的款式(如男衬衫、牛仔裤)\n- **Collection 系列**——一组风格相关或同季发布的高品质时装,\"The Collections\"常特指巴黎时装秀\n- **Fad 一时的流行/昙花一现的时尚**\n- **Fashion cycle 时尚周期**——企业规划/设计/生产/营销系列的完整日历周期\n- **Fit model 试衣模特**——用于确认样衣尺码标准的人体模特\n- **Flats 平面款式图**——用于展示服装结构细节的示意图\n- **Grain(of fabric)布纹方向**——分横纹(纬向weft)、直纹(经向warp)、45度斜纹(bias)三种\n- **Hand 面料手感**\n- **Haute couture 高级定制**——须通过法国高定与成衣联合会(Chambre Syndicale)严苛认证方可使用此称谓\n- **JIT 准时制生产**——按需快速反应生产模式\n- **Knock-off 山寨/仿款**——用廉价材料仿制高价爆款并低价出售\n- **Lead-time 交货提前期**——从下单到到货所需时间\n- **Line-up 排列预览**——正式裁剪前将白坯样衣或成衣在模特身上逐一排列检视,确认系列整体平衡\n- **Made-to-measure 量体定制**\n- **Markup 加价率**——成本价与含税售价之间的差额比例\n- **Mass-customization 大规模个性化定制**\n- **Muslin 白坯布/试样样衣**(见Sample)\n- **Nap(of fabric)顺毛方向**——绒面面料(天鹅绒/灯芯绒/麂皮)特有的单向纹理\n- **Off-the-peg 现成服装/成衣**——标准尺码、可直接购买的男装\n- **Piecework 计件工/流水线分工制**\n- **Portfolio 作品集**\n- **Première Vision(PV)\"第一眼\"面料展**——巴黎每年两届的重要面料贸易展\n- **Prêt-à-porter 成衣**——法语\"准备好穿\",指优质设计师成衣及同名大展\n- **Price point 价格档位**\n- **Private label 自有品牌/贴牌**——工厂利用富余产能为零售商代工贴牌生产\n- **Push v. pull 推式/拉式(供应链策略)**——传统由厂商主导供给(push),未来趋势转向消费者按需定制主导(pull)\n- **Rag trade 时装业(俚语)**——常隐含\"中低端市场\"意味\n- **Sample 样衣/试样**——用坯布或低成本面料制作的首件测试成衣(即muslin)\n- **Sealing sample 封样**——经批准作为后续生产标准的样衣\n- **Selvage 布边**——机织物经纱加固的边缘\n- **Semiotics 符号学**——研究文化与传播中符号意义的学科\n- **Silhouette 廓形**——服装或系列简化为基本几何/字母造型的整体轮廓描述(如A字形、8字形)\n- **Slow fashion 慢时尚**——与快时尚相对,主张耐穿耐用、跨季搭配、使用符合伦理的材料\n- **Sourcing 寻源/采购**——为获得最佳价格与交期而寻找材料/辅料/生产商\n- **Specs 规格单**——标注尺寸、缝制辅料等生产细节的技术图\n- **SKU库存量单位**——商品的唯一识别编码,通常配合条码使用\n- **Storyboard 故事板/主题板**——展示系列概念与款式搭配分解的呈现板\n- **Trunk show 巡回展销**——销售人员携带样品巡回多城市安排店铺预览\n- **Vendor 供应商**\n- **Warp/weft 经纱/纬纱**——机织物纵向(经)与横向(纬)纱线\n- **Wholesale 批发**——企业对企业的大宗商品交易\n- **Yoke 育克**——用于支撑褶皱或宽松部分的连接布片(如衬衫肩育克、裙腰育克)\n- **Zeitgeist 时代精神**——德语词,常用于描述服装如何映照其诞生的时代氛围\n\n---"

      "body": "本笔记完整覆盖了原书引言(Introduction)及正文全部七章(第一至七章),并附精选双语术语表。原书末尾还包含更详尽的完整术语表、打版与缝纫专用术语表(pattern-drafting and sewing terms)、全球院校资源名录(Useful addresses)及索引,因篇幅原因本笔记未逐一收录,建议结合原书相应章节按需查阅。全书内容涵盖行业背景与产业语境、生产与零售体系、人体绘画技法、色彩面料知识、工作室实操(打版/立裁/缝纫)、课题作业与评估方法,以及从毕业设计到职业发展的完整知识体系,可作为服装设计学习与职业规划的系统性中英双语参考资料。"
    }
  ]
};</script><script>
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db=window.NOTES_DATA||{notes:[]},current=db.notes[0]?.id||'',github=null,editing=null,activeSection='入门',collapsedBooks=new Set((db.notes.filter(n=>n.tags?.[0]==='book').slice(1)).map(n=>n.id));function renderMd(s){let out=esc(s).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h2>$1</h2>').replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`(.*?)`/g,'<code>$1</code>').replace(/\n(?=\s*\d+\.\s)/g,'<br><br>').replace(/\n\n/g,'</p><p>');return '<p>'+out+'</p>'}function highlight(html){return html.replace(/<p>([^<]{0,180}(?:概念|原则|核心|定义|特点|特征|作用|分类|方法|前提|含义|要点)[^<]*)<\/p>/g,'<div class=\"highlight\"><span class=\"highlight-text\">$1</span></div>')}function level(n){return n.tags?.[0]||'point'}
function shortTitle(n){return n.title.split(' / ').pop()}
function childrenOf(root){const prefix=root.title+' / ';return db.notes.filter(n=>n.title.startsWith(prefix))}
function pageRoot(n){if(level(n)!=='point')return n;const parts=n.title.split(' / ');return db.notes.find(x=>x.title===parts.slice(0,-1).join(' / '))||n}
function renderSidebar(){const books=db.notes.filter(n=>level(n)==='book');let html='<div class="group"><h3 class="group-title">我的知识库</h3><button class="side-link" id="newNote">＋ 新建笔记</button></div>';for(const book of books){const chapters=db.notes.filter(n=>level(n)==='chapter'&&n.title.startsWith(book.title+' / '));const collapsed=collapsedBooks.has(book.id);html+='<div class="group"><button class="group-title book-toggle" data-book="'+book.id+'"><span>'+(collapsed?'▸':'▾')+'</span> '+esc(shortTitle(book))+'</button>';if(!collapsed){html+='<button class="side-link '+(current===book.id?'active ':'')+'" data-id="'+book.id+'">'+esc(shortTitle(book))+'</button>';for(const ch of chapters)html+='<button class="side-link child '+(current===ch.id?'active ':'')+'" data-id="'+ch.id+'">'+esc(shortTitle(ch))+'</button>'}html+='</div>'}html+='<div class="group"><h3 class="group-title">工具</h3><button class="side-link" id="import">⇧ 导入 Markdown</button><button class="side-link" id="export">⇩ 导出当前笔记</button></div>';$('#sidebar').innerHTML=html;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{current=b.dataset.id;render()});document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{const id=b.dataset.book;collapsedBooks.has(id)?collapsedBooks.delete(id):collapsedBooks.add(id);renderSidebar()});$('#newNote').onclick=()=>openForm();$('#import').onclick=()=>alert('下一步可接入 Markdown 文件导入');$('#export').onclick=exportNote}
function renderEmptySection(name){$('#sidebar').innerHTML='<div class="group"><h3 class="group-title">'+esc(name)+'</h3><button class="side-link" id="newNote">＋ 新建笔记</button></div><div class="group"><p style="color:var(--muted);line-height:1.7">这个栏目还没有笔记。你可以先创建第一篇，后续内容会保存在 GitHub 仓库。</p></div>';$('#article').innerHTML='<div class="crumb">入门　/　<span>'+esc(name)+'</span></div><h1>'+esc(name)+'</h1><p class="summary">这是你的 '+esc(name)+' 栏目。</p><div class="notice">这个栏目目前还没有内容。点击“新建笔记”开始添加，后续笔记会归入这里。</div><div class="tools"><button class="tool primary" id="emptyNew">＋ 新建笔记</button></div>';$('#tocLinks').innerHTML='';$('#sync').textContent='GitHub：未连接';$('#newNote').onclick=()=>openForm();$('#emptyNew').onclick=()=>openForm()}
function render(){if(activeSection!=='入门'){renderEmptySection(activeSection);return}let selected=db.notes.find(x=>x.id===current)||db.notes[0];const root=pageRoot(selected);if(!root)return;current=root.id;renderSidebar();const descendants=childrenOf(root);let article='<div class="crumb">入门　/　<span>'+esc(level(root)==='book'?'知识库':level(root)==='chapter'?'页面':'小节')+'</span></div><h1>'+esc(shortTitle(root))+'</h1><p class="summary">'+esc(root.title.includes('设计艺术学概论')?'记录设计理论、服饰设计与创作方法的系统知识。':'服装设计笔记与个人研究记录。')+'</p><div class="meta"><span class="version">'+esc(level(root).toUpperCase())+'</span><span>更新于 '+new Date(root.updatedAt||Date.now()).toLocaleDateString('zh-CN')+'</span></div><div class="tools"><button class="tool" id="copy">▣ 复制页面</button><button class="tool" id="edit">编辑笔记</button><button class="tool" id="delete">删除</button></div>';if(root.body)article+=highlight(renderMd(root.body));for(const n of descendants){const l=level(n);if(l==='chapter'||l==='section')article+='<h2>'+esc(shortTitle(n))+'</h2>';else article+='<h3>'+esc(shortTitle(n))+'</h3>';if(n.body)article+=highlight(renderMd(n.body))}$('#article').innerHTML=article;const hs=[...$('#article').querySelectorAll('h2,h3')];$('#tocLinks').innerHTML=hs.map((h,i)=>{h.id='section-'+i;return '<a class="level-'+(h.tagName==='H2'?1:2)+'" href="#section-'+i+'">'+esc(h.textContent)+'</a>'}).join('');document.querySelectorAll('#tocLinks a').forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth',block:'start'})});$('#copy').onclick=()=>navigator.clipboard?.writeText([root.body,...descendants.map(n=>n.title+'\n'+n.body)].join('\n\n'));$('#edit').onclick=()=>openForm(root);$('#delete').onclick=()=>remove(root)}
function openForm(n){editing=n||null;$('#formTitle').textContent=n?'编辑笔记':'新建笔记';$('#title').value=n?.title||'';$('#body').value=n?.body||'';$('#tags').value=n?.tags?.join(', ')||'';$('#modal').classList.add('open')}function closeForm(){$('#modal').classList.remove('open');editing=null}$('#cancel').onclick=closeForm;$('#form').onsubmit=async e=>{e.preventDefault();const n={id:editing?.id||crypto.randomUUID(),title:$('#title').value.trim(),body:$('#body').value,tags:$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean),updatedAt:new Date().toISOString()};const i=db.notes.findIndex(x=>x.id===n.id);i<0?db.notes.unshift(n):db.notes[i]=n;current=n.id;render();closeForm();if(github)await push()};function remove(n){if(confirm('确定删除这篇笔记吗？')){db.notes=db.notes.filter(x=>x.id!==n.id);current=db.notes[0]?.id;render();if(github)push()}}function exportNote(){const n=db.notes.find(x=>x.id===current),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['# '+n.title+'\n\n'+n.body],{type:'text/markdown'}));a.download=n.title+'.md';a.click()}$('#search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('[data-id]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q))};$('#mobileMenu').onclick=()=>$('#toc').classList.toggle('open');$('#tocToggle').onclick=()=>{if(window.innerWidth<=800)$('#toc').classList.remove('open');else window.scrollTo({top:0,behavior:'smooth'})};async function api(path,opt={}){const r=await fetch('https://api.github.com/repos/studio2002/fashion-design-notes/contents/'+path,{...opt,headers:{Authorization:'Bearer '+github.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});if(!r.ok)throw Error(await r.text());return r.json()}async function push(){try{let old=await api('data/notes.json');await api('data/notes.json',{method:'PUT',body:JSON.stringify({message:'更新服装设计笔记',content:btoa(unescape(encodeURIComponent(JSON.stringify(db,null,2)))),sha:old.sha})});$('#sync').textContent='GitHub：已同步'}catch(e){$('#sync').textContent='GitHub：同步失败'}}$('#connect').onclick=async()=>{const token=prompt('请输入 GitHub Token（只保存在当前页面内存）');if(!token)return;github={token};try{const x=await api('data/notes.json');db=JSON.parse(decodeURIComponent(escape(atob(x.content.replace(/\n/g,'')))));current=db.notes[0].id;render();$('#sync').textContent='GitHub：已连接'}catch(e){$('#sync').textContent='GitHub：连接失败'}};document.querySelectorAll('.global-nav button').forEach(b=>b.onclick=()=>{activeSection=b.textContent.trim();document.querySelectorAll('.global-nav button').forEach(x=>x.classList.toggle('active',x===b));render()});render();</script><style>.sidebar .book-toggle{display:flex;align-items:center;gap:5px;width:100%;border:0;background:none;text-align:left;color:#292622;padding:0;margin:0 0 15px;font:inherit;font-size:16px;font-weight:750}.sidebar .side-link{border:0!important;background:none!important;box-shadow:none!important;border-radius:0!important;text-align:left!important;color:#55534e!important;padding:9px 11px!important;margin:2px 0!important;font-size:15px!important}.sidebar .side-link:hover{background:#f0efeb!important}.sidebar .side-link.active{background:#e7e6e1!important;border-radius:13px!important;color:#1c1b19!important;font-weight:750}.sidebar .side-link.child{padding-left:25px!important;font-size:15px!important}.sidebar .book-toggle:hover{color:#292622}<style>.sidebar .side-link.child.active{background:#e7e6e1!important;border-radius:13px!important;color:#1c1b19!important;font-weight:750!important}</style></body></html>
